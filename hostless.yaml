# Hostless deployment profile for DEEP33.
# Resource ceilings stay within the included free allowance; no automatic scale-out.
build:
  system: docker

dockerfile_path: "./Dockerfile"
working_directory: "/"
build_context_directory: "/"

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 256
  max_memory: 1024
  min_replicas: 1
  max_replicas: 1
  max_http_requests_per_replica: 10

health_check:
  type: http
  http_path: "/health"
  interval_in_seconds: 30
