services:
  - type: web
    name: deep33-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: NETWORK_CHECK_URL
        value: https://www.google.com/generate_204
      - key: AI_TIMEOUT_SECONDS
        value: "75"
      - key: AI_PROVIDER_TIMEOUT_SECONDS
        value: "18"
