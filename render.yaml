services:
  - type: web
    name: deep33-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --loop uvloop --http httptools --no-access-log
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DEEP33_AUTH_SUPABASE_URL
        value: "https://opocgzydeknuchtrqzfa.supabase.co"
      - key: DEEP33_AUTH_API_KEY
        value: "sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA"
      - key: DEEP33_WEB_TOOLS_ENABLED
        value: "true"
      - key: WEB_SEARCH_BING_ENABLED
        value: "true"
      - key: WEB_SEARCH_FALLBACK_DDG
        value: "true"
      - key: WEB_SEARCH_TIMEOUT_SECONDS
        value: "6"
      - key: WEB_SEARCH_TOTAL_TIMEOUT_SECONDS
        value: "12"
      - key: WEB_SEARCH_PROVIDER_RETRIES
        value: "1"
      - key: WEB_SEARCH_RETRY_BACKOFF_SECONDS
        value: "0.2"

  - type: web
    name: deep33-backup
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit

  - type: web
    name: deep33-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
