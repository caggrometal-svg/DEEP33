name: DEEP33 Multiuser Certified APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Install backend test runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend regression certification
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r backend/requirements.txt
          python -m compileall -q backend
          python -m pytest tests -q

      - name: Android toolchain
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Android validation and APK build
        run: |
          set -euo pipefail
          cd android
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Certify APK integrity
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -s "$APK"
          test -s "$TEST_APK"
          unzip -t "$APK" >/tmp/deep33-apk-integrity.txt
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          sha256sum "$APK" "$TEST_APK" | tee /tmp/deep33-apk-sha256.txt
          {
            echo "DEEP33_APK_CERTIFIED=true"
            echo "DEEP33_MULTIUSER=true"
            echo "MULTIUSER_ISOLATION=PASS"
            echo "COMMIT=$GITHUB_SHA"
            echo "APK=$APK"
            echo "INTEGRITY=PASS"
            echo "BACKEND_TESTS=PASS"
            echo "ANDROID_LINT=PASS"
            echo "ANDROID_UNIT_TESTS=PASS"
            cat /tmp/deep33-apk-sha256.txt
          } | tee certification.txt

      - name: Publish certified APK and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-MULTIUSUARIO-CERTIFIED-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            certification.txt
          if-no-files-found: error
