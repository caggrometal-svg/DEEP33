name: DEEP33 CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  PRIMARY_URL: https://deep33-backend.onrender.com
  SECONDARY_URL: https://deep33-backup.onrender.com

jobs:
  backend_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Import and syntax gate
        run: |
          python -c "import backend.main, backend.gateway, backend.memory; print('DEEP33_IMPORT_OK')"
          python -m compileall -q backend
      - name: Unit and contract tests
        run: python -m pytest tests -q

  production_gate:
    needs: backend_unit
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render to serve this exact GitHub SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            body="$(curl -fsS --max-time 10 "$PRIMARY_URL/health" || true)"
            sha="$(python -c 'import json,sys; print(json.load(sys.stdin).get("git_sha",""))' <<< "$body" 2>/dev/null || true)"
            if [ "$sha" = "$EXPECTED_SHA" ]; then
              ok=1
              echo "RENDER_SHA_PASS $sha"
              break
            fi
            echo "RENDER_SHA_WAIT attempt=$i runtime_sha=$sha expected=$EXPECTED_SHA"
            sleep 5
          done
          test "$ok" = 1

      - name: Verify Render liveness and readiness
        run: |
          set -euo pipefail
          curl -fsS "$PRIMARY_URL/liveness" > /tmp/liveness.json
          curl -fsS "$PRIMARY_URL/ready" > /tmp/ready.json
          python - <<'PY'
          import json
          ready=json.load(open("/tmp/ready.json"))
          assert ready["status"]=="PASS" and ready["ready"] is True, ready
          print("RENDER_READY_PASS")
          PY

      - name: Verify real production inference
        run: |
          set -euo pipefail
          curl -fsS --max-time 95 "$PRIMARY_URL/v1/ai/diagnostics" > /tmp/diag.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/diag.json"))
          assert d["online"] is True, d
          assert d["checks"]["MODEL"]=="PASS", d
          print("MODEL_PASS", d["inference"])
          PY

      - name: Verify SECONDARY backup health and inference
        run: |
          set -euo pipefail
          curl -fsS "$SECONDARY_URL/health" > /tmp/backup_health.json
          curl -fsS "$SECONDARY_URL/ready" > /tmp/backup_ready.json
          curl -fsS --max-time 95 "$SECONDARY_URL/v1/ai/diagnostics" > /tmp/backup_diag.json
          python - <<'PY'
          import json
          h=json.load(open("/tmp/backup_health.json"))
          r=json.load(open("/tmp/backup_ready.json"))
          d=json.load(open("/tmp/backup_diag.json"))
          assert h["status"]=="PASS", h
          assert r["status"]=="PASS" and r["ready"] is True, r
          assert d["online"] is True and d["checks"]["MODEL"]=="PASS", d
          print("RAILWAY_BACKUP_PASS")
          PY

  android_e2e:
    needs: production_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Android real connectivity E2E
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEEP33_PRIMARY_URL: https://deep33-backend.onrender.com
          DEEP33_SECONDARY_URL: https://deep33-backup.onrender.com
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: false
          disable-linux-hw-accel: auto
          enable-hw-keyboard: false
          channel: stable
          script: cd android && gradle :app:assembleDebug :app:connectedDebugAndroidTest --no-daemon
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEEP33-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android_failover:
    needs: production_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Android PRIMARY-down to SECONDARY failover
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEEP33_PRIMARY_URL: https://deep33-primary.invalid
          DEEP33_SECONDARY_URL: https://deep33-backup.onrender.com
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: failover
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5556
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: false
          enable-hw-keyboard: false
          channel: stable
          script: cd android && gradle :app:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=cl.caggrometal.deep33.Deep33FailoverTest

  recovery_gate:
    needs: [android_e2e, android_failover]
    runs-on: ubuntu-latest
    steps:
      - name: Verify primary recovery after failover exercise
        run: |
          set -euo pipefail
          curl -fsS "$PRIMARY_URL/health" >/tmp/recovery-health.json
          curl -fsS --max-time 95 "$PRIMARY_URL/v1/ai/diagnostics" >/tmp/recovery-diag.json
          python - <<'PY'
          import json
          h=json.load(open("/tmp/recovery-health.json"))
          d=json.load(open("/tmp/recovery-diag.json"))
          assert h["status"]=="PASS", h
          assert d["online"] is True and d["checks"]["MODEL"]=="PASS", d
          print("RECOVERY_PASS")
          PY

  release_gate:
    needs: recovery_gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "DEEP33_CRITICAL_GATES_PASS"
