name: DEEP33 CI

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  PRIMARY_URL: https://deep33-backend.onrender.com

jobs:
  backend_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Import and syntax gate
        run: |
          python -c "import backend.main, backend.gateway, backend.memory; print('DEEP33_IMPORT_OK')"
          python -m compileall -q backend
      - name: Unit and contract tests
        run: python -m pytest tests -q

  android_validation:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    needs: backend_unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Android lint and build
        run: cd android && gradle :app:lintDebug :app:assembleDebug :app:testDebugUnitTest --no-daemon

  production_gate:
    if: ${{ github.event_name != 'pull_request' }}
    needs: backend_unit
    runs-on: ubuntu-latest
    steps:
      - name: Wait for PRIMARY exact Git SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            body="$(curl -fsS --max-time 10 "$PRIMARY_URL/health" || true)"
            sha="$(python -c 'import json,sys; print(json.load(sys.stdin).get("git_sha",""))' <<< "$body" 2>/dev/null || true)"
            if [ "$sha" = "$EXPECTED_SHA" ]; then
              ok=1
              echo "PRIMARY_SHA_PASS $sha"
              break
            fi
            sleep 5
          done
          test "$ok" = 1

      - name: Verify PRIMARY liveness and readiness
        run: |
          set -euo pipefail
          curl -fsS "$PRIMARY_URL/liveness" >/tmp/liveness.json
          curl -fsS "$PRIMARY_URL/ready" >/tmp/ready.json
          python - <<'PY'
          import json
          body=json.load(open("/tmp/ready.json"))
          assert body["status"]=="PASS" and body["ready"] is True, body
          print("PRIMARY_READY_PASS")
          PY

      - name: Verify PRIMARY real inference
        run: |
          set -euo pipefail
          curl -fsS --max-time 95 "$PRIMARY_URL/v1/ai/diagnostics" >/tmp/diag.json
          python - <<'PY'
          import json
          body=json.load(open("/tmp/diag.json"))
          assert body["online"] is True, body
          assert body["checks"]["MODEL"]=="PASS", body
          assert body["checks"]["CHAT"]=="PASS", body
          print("PRIMARY_INFERENCE_PASS", body["inference"])
          PY

  android_e2e:
    needs: production_gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android real connectivity E2E
        env:
          DEEP33_PRIMARY_URL: https://deep33-backend.onrender.com
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: auto
          enable-hw-keyboard: false
          channel: stable
          script: |
            set -euo pipefail
            cd android
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest.apk' | head -n 1)"
            test -n "$TEST_APK"
            adb install -r "$TEST_APK"
            timeout --foreground 12m adb shell am instrument -w -r cl.caggrometal.deep33.test/androidx.test.runner.AndroidJUnitRunner

      - name: Android E2E diagnostics
        if: ${{ always() }}
        run: |
          set +e
          echo "=== ADB DEVICES ==="
          adb devices -l || true
          echo "=== SDK ==="
          adb shell getprop ro.build.version.sdk || true
          adb shell getprop ro.build.version.release || true
          echo "=== INSTRUMENTATION ==="
          adb shell pm list instrumentation || true
          echo "=== PROCESSES ==="
          adb shell ps -A | grep -Ei 'instrument|deep33|gradle' || true
          echo "=== CRASH BUFFER ==="
          adb logcat -d -b crash -t 1200 || true

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: DEEP33-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  recovery_gate:
    needs: android_e2e
    runs-on: ubuntu-latest
    steps:
      - name: Verify PRIMARY recovery
        run: |
          set -euo pipefail
          curl -fsS "$PRIMARY_URL/health" >/tmp/recovery-health.json
          curl -fsS --max-time 95 "$PRIMARY_URL/v1/ai/diagnostics" >/tmp/recovery-diag.json
          python - <<'PY'
          import json
          h=json.load(open("/tmp/recovery-health.json"))
          d=json.load(open("/tmp/recovery-diag.json"))
          assert h["status"]=="PASS", h
          assert d["online"] is True and d["checks"]["MODEL"]=="PASS", d
          print("RECOVERY_PASS")
          PY

  rollback_on_failure:
    needs: [backend_unit, production_gate, android_e2e, recovery_gate]
    if: ${{ github.event_name == 'push' && failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Roll back main to last PASS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "ROLLBACK_SKIPPED_CONCURRENT_COMMIT current=$current failed=$GITHUB_SHA"
            exit 0
          fi
          if pass="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/production-pass" --jq '.object.sha' 2>/dev/null)"; then
            :
          else
            pass="${{ github.event.before }}"
          fi
          if ! printf '%s' "$pass" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ROLLBACK_ABORT invalid_target=$pass"
            exit 1
          fi
          test "$pass" != "$GITHUB_SHA"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f "sha=$pass" -F "force=true"
          echo "ROLLBACK_PASS target=$pass"

  release_gate:
    needs: recovery_gate
    if: ${{ github.event_name == 'push' && success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark exact release PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f production-pass "$GITHUB_SHA"
          git push origin refs/tags/production-pass --force
          echo "DEEP33_CRITICAL_GATES_PASS $GITHUB_SHA"
