concurrency:
  group: deep33-ci-v7-${{ github.ref }}
  cancel-in-progress: true

name: DEEP33 CI
# CI trigger: validate the latest Android UI fix.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  PRIMARY_URL: https://deep33-backend.vercel.app
  SECONDARY_URL: https://deep33-backend-iac33.vercel.app
  TERTIARY_URL: https://deep33-backend-git-main-iac33.vercel.app
  SUPABASE_URL: https://opocgzydeknuchtrqzfa.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA

jobs:
  backend_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Reject legacy upstream dependencies
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=.git "c-33\\.blitz\\.cloud\|caggrometal-svg/.*IAC33\|deep33.c-33" supabase backend android README.md render.yaml Dockerfile 2>/dev/null; then
            echo "LEGACY_UPSTREAM_REFERENCE_FOUND"
            exit 1
          fi
          echo "NO_LEGACY_UPSTREAM_PASS"
      - name: Import and syntax gate
        run: |
          python -c "import backend.main, backend.gateway, backend.memory; print('DEEP33_IMPORT_OK')"
          python -m compileall -q backend
      - name: Unit and contract tests
        run: python -m pytest tests -q

  edge_typescript_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.6
      - name: Type-check primary, secondary, and hybrid-search Edge functions
        run: |
          deno check supabase/functions/deep33-proxy/index.ts
          deno check supabase/functions/deep33-tertiary/index.ts
          deno check supabase/functions/deep33-hybrid-search/index.ts

  production_realtime_search:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create authenticated production session
        run: |
          set -euo pipefail
          token=""
          for attempt in $(seq 1 5); do
            profile_id="ci-production-realtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${SECONDS}-${attempt}"
            response="$(curl -sS --connect-timeout 8 --max-time 30 \
              -w '\nDEEP33_HTTP_STATUS:%{http_code}' \
              -X POST "https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-auth" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "content-type: application/json" \
              -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}" || true)"
            status="${response##*DEEP33_HTTP_STATUS:}"
            auth_json="${response%$'\n'DEEP33_HTTP_STATUS:*}"
            if [ "$status" = "200" ]; then
              token="$(printf '%s' "$auth_json" | jq -r '.access_token // empty')"
              [ -n "$token" ] && break
            fi
            if [ "$status" = "409" ]; then
              echo "AUTH_PROFILE_COLLISION attempt=$attempt"
            elif [ "$status" = "000" ] || [ "$status" = "429" ] || [[ "$status" == 5* ]]; then
              echo "AUTH_TRANSIENT_FAILURE attempt=$attempt http=$status"
            else
              echo "AUTH_SESSION_FATAL http=$status"
              printf '%s\n' "$auth_json" | jq -c '{error: (.error // "unknown")}' || true
              exit 1
            fi
            [ "$attempt" -lt 5 ] && sleep 3
          done
          test -n "$token" || { echo "AUTH_SESSION_FAILED retries_exhausted"; exit 1; }
          echo "DEEP33_CI_TOKEN=$token" >> "$GITHUB_ENV"
          echo "DEEP33_CI_SESSION_ID=ci-production-realtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Verify PRIMARY realtime search
        run: |
          set -euo pipefail
          query="situación actual de la comuna de Las Condes en Chile"
          search_ok=0
          result=""
          for attempt in $(seq 1 6); do
            response="$(curl -sS --connect-timeout 8 --max-time 90 \
              -w '\nDEEP33_HTTP_STATUS:%{http_code}' \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $DEEP33_CI_TOKEN" \
              -H "X-DEEP33-Session-Id: $DEEP33_CI_SESSION_ID" \
              --get "$PRIMARY_URL/v1/web/search" \
              --data-urlencode "q=$query" || true)"
            status_code="${response##*DEEP33_HTTP_STATUS:}"
            result="${response%$'\n'DEEP33_HTTP_STATUS:*}"
            if [ "$status_code" = "200" ] && printf '%s' "$result" | jq -e '.ok == true and .realtime == true and .fresh_request == true and .engine == "DEEP33 Search Engine" and .engine_version == "1.4.0" and (.queries | length) >= 1 and (.providers | length) >= 1 and ((.results // []) | length) >= 1 and (.retrieved_at | strings | length) > 10' >/dev/null 2>&1; then
              search_ok=1
              printf '%s\n' "$result"
              echo "PRIMARY_REALTIME_SEARCH_PASS"
              break
            fi
            echo "PRIMARY_REALTIME_SEARCH_NOT_READY attempt=$attempt status=$status_code"
              printf '%s\n' "$result"
            sleep 5
          done
          test "$search_ok" = "1" || { echo "PRIMARY_REALTIME_SEARCH_FAIL"; exit 1; }
      - name: Wait for TERTIARY web tool readiness
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 18); do
            echo "TERTIARY_WEB_STATUS_ATTEMPT=$attempt"
            body="$(curl -sS --connect-timeout 8 --max-time 30 -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $DEEP33_CI_TOKEN" "$TERTIARY_URL/v1/web/status" || true)"
            printf '%s\n' "$body"
            if printf '%s' "$body" | jq -e '.engine=="DEEP33 Search Engine" and .engine_version=="1.3.0" and .tool_loop_enabled==true' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1" || { echo "TERTIARY_WEB_STATUS_FAIL"; exit 1; }
          echo "TERTIARY_WEB_STATUS_PASS"

      - name: Verify TERTIARY realtime search
        run: |
          set -euo pipefail
          query="situación actual de la comuna de Las Condes en Chile"
          session_id="ci-production-realtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          status_code="000"
          result=""
          for attempt in $(seq 1 8); do
            echo "TERTIARY_REALTIME_SEARCH_ATTEMPT=$attempt"
            response="$(curl -sS --connect-timeout 8 --max-time 90 \
              -w '\nDEEP33_HTTP_STATUS:%{http_code}' \
              -H "Authorization: Bearer $DEEP33_CI_TOKEN" \
              -H "X-DEEP33-Session-Id: $session_id" \
              --get "$TERTIARY_URL/v1/web/search" \
              --data-urlencode "q=$query" || true)"
            status_code="${response##*DEEP33_HTTP_STATUS:}"
            result="${response%$'\n'DEEP33_HTTP_STATUS:*}"
            if [ "$status_code" = "200" ] && printf '%s' "$result" | jq -e '.ok == true and .realtime == true and .fresh_request == true and .engine == "DEEP33 Search Engine" and .engine_version == "1.4.0" and (.queries | length) >= 1 and (.providers | length) >= 1 and (.retrieved_at | strings | length) > 10' >/dev/null 2>&1; then
              printf '%s\n' "$result"
              echo "TERTIARY_REALTIME_SEARCH_PASS"
              exit 0
            fi
            echo "TERTIARY_REALTIME_SEARCH_NOT_READY status=$status_code"
            printf '%s\n' "$result"
            sleep 5
          done
          echo "TERTIARY_REALTIME_SEARCH_FAIL status=$status_code"
          exit 1

  android_validation:
    needs: backend_unit
    runs-on: ubuntu-latest
    env:
      DEEP33_PRIMARY_URL: https://deep33-backend-iac33.vercel.app
      DEEP33_SECONDARY_URL: https://deep33-backend-git-main-iac33.vercel.app
      DEEP33_TERTIARY_URL: https://deep33-backend.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Android lint and build
        run: cd android && gradle :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon

      - name: Publish Vercel-validation APK
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-vercel-validation-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  vercel_realtime_search:
    if: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'fix/vercel-android-route-221026' || github.event.pull_request.head.ref == 'fix/production-realtime-gates-251026' || github.event.pull_request.head.ref == 'fix/chat-realtime-news-evidence-quorum-251026')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [backend_unit, android_validation]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      VERCEL_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/production-realtime-gates-251026' && 'https://deep33-backend-git-fix-production-realtime-gates-251026-iac33.vercel.app' || github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/chat-realtime-news-evidence-quorum-251026' && 'https://deep33-backend-git-fix-chat-realtime-news-evidence-869f34-iac33.vercel.app' || github.event_name == 'pull_request' && 'https://deep33-backend-git-fix-vercel-android-route-221026-iac33.vercel.app' || 'https://deep33-backend.vercel.app' }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
    steps:
      - name: Require Vercel Preview Protection bypass secret
        run: |
          set -euo pipefail
          test -n "${VERCEL_PROTECTION_BYPASS:-}" || {
            echo "VERCEL_BYPASS_SECRET_MISSING: add repository Actions secret VERCEL_PROTECTION_BYPASS"
            exit 1
          }
      - name: Create authenticated Vercel validation session
        run: |
          set -euo pipefail
          token=''
          for attempt in $(seq 1 5); do
            profile_id="ci-vercel-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${attempt}"
            session_id="ci-vercel-session-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            status="$(curl -sS --connect-timeout 8 --max-time 30 -o "$RUNNER_TEMP/deep33-vercel-auth.json" -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/deep33-auth" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "content-type: application/json" -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}" || true)"
            if [ "$status" = "200" ]; then
              token="$(jq -r '.access_token // empty' "$RUNNER_TEMP/deep33-vercel-auth.json")"
              if [ -n "$token" ]; then break; fi
            fi
            echo "VERCEL_AUTH_RETRY attempt=$attempt http=$status"
            [ "$attempt" -lt 5 ] && sleep 3
          done
          test -n "$token" || { echo "VERCEL_AUTH_SESSION_FAIL"; jq -c '{error:(.error // .message // "unknown")}' "$RUNNER_TEMP/deep33-vercel-auth.json" 2>/dev/null || true; exit 1; }
          echo "::add-mask::$token"
          echo "DEEP33_VERCEL_TEST_TOKEN=$token" >> "$GITHUB_ENV"
          echo "DEEP33_VERCEL_TEST_SESSION_ID=$session_id" >> "$GITHUB_ENV"

      - name: Mint short-lived GitHub OIDC token for protected Vercel preview
        id: vercel_oidc
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);

      - name: Verify deployed Vercel SHA matches the tested commit
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel_oidc.outputs.token }}
          EXPECTED_VERCEL_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          headers=()
          if [ -n "${VERCEL_TRUSTED_OIDC_TOKEN:-}" ]; then
            headers+=(-H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN")
          fi
          headers+=(-H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS")
          matched=0
          for attempt in $(seq 1 12); do
            status_code="$(curl -sS --connect-timeout 10 --max-time 30 \
              -D "$RUNNER_TEMP/deep33-vercel-health.headers" -o "$RUNNER_TEMP/deep33-vercel-health.json" -w "%{http_code}" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $DEEP33_VERCEL_TEST_TOKEN" \
              -H "X-DEEP33-Session-Id: $DEEP33_VERCEL_TEST_SESSION_ID" \
              "${headers[@]}" "$VERCEL_URL/health" || true)"
            if [ "$status_code" = "200" ] && jq -e --arg expected "$EXPECTED_VERCEL_SHA" '
              .status == "PASS" and
              (.git_sha | type == "string") and
              ((.git_sha | ascii_downcase) == ($expected | ascii_downcase)) and
              (.build_id | type == "string" and length > 0)
            ' "$RUNNER_TEMP/deep33-vercel-health.json" >/dev/null 2>&1; then
              jq -c '{status,service,git_sha,build_id,git_branch}' "$RUNNER_TEMP/deep33-vercel-health.json"
              echo "VERCEL_DEPLOYED_SHA_MATCH_PASS expected=$EXPECTED_VERCEL_SHA"
              matched=1
              break
            fi
            echo "VERCEL_DEPLOYED_SHA_MISMATCH attempt=$attempt http=$status_code expected=$EXPECTED_VERCEL_SHA"
            jq -c '{status,service,git_sha,build_id,git_branch}' "$RUNNER_TEMP/deep33-vercel-health.json" 2>/dev/null || true
            location="$(awk 'tolower($0) ~ /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$RUNNER_TEMP/deep33-vercel-health.headers" 2>/dev/null | tail -n 1 | sed 's/[?#].*$//')"
            content_type="$(awk 'tolower($0) ~ /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$RUNNER_TEMP/deep33-vercel-health.headers" 2>/dev/null | tail -n 1)"
            [ -n "$location" ] && echo "VERCEL_HEALTH_REDIRECT_LOCATION_SAFE=$location"
            [ -n "$content_type" ] && echo "VERCEL_HEALTH_RESPONSE_CONTENT_TYPE=$content_type"
            [ "$attempt" -lt 12 ] && sleep 5
          done
          test "$matched" = "1" || { echo "VERCEL_DEPLOYED_SHA_MATCH_FAIL"; exit 1; }

      - name: Mint fresh OIDC token for live Vercel search
        id: vercel_search_oidc
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Verify live Vercel search and page extraction
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel_search_oidc.outputs.token }}
        run: |
          set -euo pipefail
          status_code="000"
          for attempt in $(seq 1 4); do
            status_code="$(curl -sS --connect-timeout 10 --max-time 75 -D "$RUNNER_TEMP/deep33-vercel-search.headers" -o "$RUNNER_TEMP/deep33-vercel-search.json" -w "%{http_code}" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $DEEP33_VERCEL_TEST_TOKEN" -H "X-DEEP33-Session-Id: $DEEP33_VERCEL_TEST_SESSION_ID" -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" -H "Cache-Control: no-cache" --get "$VERCEL_URL/v1/web/search" --data-urlencode "q=latest Python official documentation release" || true)"
            if [ "$status_code" = "200" ] && jq -e '.ok == true and .realtime == true and ((.results // []) | length) >= 1 and ((.fetched_pages // []) | length) >= 1 and (.domains_used // 0) >= 1 and (.extracted_text_chars // 0) >= 80' "$RUNNER_TEMP/deep33-vercel-search.json" >/dev/null 2>&1; then
              jq -c '{ok,status,realtime,provider,providers,domains_used,extracted_text_chars,results_count:((.results // [])|length),fetched_pages_count:((.fetched_pages // [])|length),first_result:((.results // [])[0] // {} | {title,url,source_domain})}' "$RUNNER_TEMP/deep33-vercel-search.json"
              echo "VERCEL_REALTIME_SEARCH_AND_EXTRACTION_PASS"
              exit 0
            fi
            echo "VERCEL_REALTIME_SEARCH_NOT_READY attempt=$attempt http=$status_code"
            jq -c '{ok,status,code,errors,domains_used,extracted_text_chars,results_count:((.results // [])|length),fetched_pages_count:((.fetched_pages // [])|length)}' "$RUNNER_TEMP/deep33-vercel-search.json" 2>/dev/null || true
            location="$(awk 'tolower($0) ~ /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$RUNNER_TEMP/deep33-vercel-search.headers" 2>/dev/null | tail -n 1 | sed 's/[?#].*$//')"
            content_type="$(awk 'tolower($0) ~ /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print}' "$RUNNER_TEMP/deep33-vercel-search.headers" 2>/dev/null | tail -n 1)"
            [ -n "$location" ] && echo "VERCEL_REDIRECT_LOCATION_SAFE=$location"
            [ -n "$content_type" ] && echo "VERCEL_RESPONSE_CONTENT_TYPE=$content_type"
            [ "$attempt" -lt 4 ] && sleep 5
          done
          echo "VERCEL_REALTIME_SEARCH_FAIL http=$status_code"
          exit 1
      - name: Mint fresh OIDC token for Chile realtime-news quorum
        id: vercel_news_oidc
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Verify fresh Chilean news has a three-domain quorum
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel_news_oidc.outputs.token }}
        run: |
          set -euo pipefail
          status_code="000"
          for attempt in $(seq 1 5); do
            status_code="$(curl -sS --connect-timeout 10 --max-time 75 -o "$RUNNER_TEMP/deep33-vercel-chile-news.json" -w "%{http_code}" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $DEEP33_VERCEL_TEST_TOKEN" \
              -H "X-DEEP33-Session-Id: $DEEP33_VERCEL_TEST_SESSION_ID" \
              -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
              -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" \
              -H "Cache-Control: no-cache" \
              --get "$VERCEL_URL/v1/web/search" --data-urlencode "q=últimas noticias de Chile hoy" || true)"
            if [ "$status_code" = "200" ] && jq -e '
              .ok == true and .realtime == true and .fresh_request == true and
              ([.results[]? | select((.published_at // "") != "" and .fetched == true and .evidence_type == "verified_current_news_article")] | length) >= 3 and
              all(.results[]?; (.published_at // "") != "" and .fetched == true and .evidence_type == "verified_current_news_article" and ((.url // "") | test("^https://"))) and
              ([.results[]?.source_domain | select(type == "string" and length > 0)] | unique | length) >= 3 and
              ([.providers[]? | select(type == "string" and length > 0 and . != "unknown" and . != "multi")] | unique | length) >= 2 and
              ((.fetched_pages // []) | length) >= 3 and
              (.domains_used // 0) >= 3 and
              (.extracted_text_chars // 0) >= 240
            ' "$RUNNER_TEMP/deep33-vercel-chile-news.json" >/dev/null 2>&1; then
              jq -c '{ok,status,realtime,fresh_request,providers,domains_used,extracted_text_chars,results:([.results[]? | {title,url,source_domain,published_at}][0:5]),fetched_pages_count:((.fetched_pages // [])|length)}' "$RUNNER_TEMP/deep33-vercel-chile-news.json"
              echo "VERCEL_CHILE_NEWS_THREE_DOMAIN_QUORUM_PASS"
              exit 0
            fi
            echo "VERCEL_CHILE_NEWS_QUORUM_RETRY attempt=$attempt http=$status_code"
            jq -c '{ok,status,code,errors,fresh_request,providers,domains_used,extracted_text_chars,results:([.results[]? | {title,url,source_domain,published_at}][0:5]),fetched_pages_count:((.fetched_pages // [])|length)}' "$RUNNER_TEMP/deep33-vercel-chile-news.json" 2>/dev/null || true
            [ "$attempt" -lt 5 ] && sleep 5
          done
          echo "VERCEL_CHILE_NEWS_THREE_DOMAIN_QUORUM_FAIL http=$status_code"
          exit 1
      - name: Mint fresh OIDC token for Spanish live-search check
        id: vercel_spanish_oidc
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Verify natural-language Spanish query stays on topic (PR and production)
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel_spanish_oidc.outputs.token }}
        run: |
          set -euo pipefail
          query="Busca en Internet cuál es la versión estable más reciente de Python publicada oficialmente. Contrasta las páginas oficiales recuperadas y cita enlaces directos."
          status_code="000"
          for attempt in $(seq 1 8); do
            status_code="$(curl -sS --connect-timeout 10 --max-time 75 \
              -o "$RUNNER_TEMP/deep33-vercel-spanish-search.json" -w "%{http_code}" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $DEEP33_VERCEL_TEST_TOKEN" \
              -H "X-DEEP33-Session-Id: $DEEP33_VERCEL_TEST_SESSION_ID" \
              -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" \
              -H "Cache-Control: no-cache" \
              --get "$VERCEL_URL/v1/web/search" --data-urlencode "q=$query" || true)"
            if [ "$status_code" = "200" ] && jq -e '
              .ok == true and .realtime == true and
              ((.results // []) | length) >= 2 and
              ((.fetched_pages // []) | length) >= 2 and
              (.domains_used // 0) >= 2 and
              (.extracted_text_chars // 0) >= 80 and
              ((([.results[]? | ((.title // "") + " " + (.url // "") + " " + (.snippet // ""))] | join(" ")) | ascii_downcase) | test("python"))
            ' "$RUNNER_TEMP/deep33-vercel-spanish-search.json" >/dev/null 2>&1; then
              jq -c '{
                ok,status,realtime,providers,domains_used,extracted_text_chars,
                results:([.results[]? | {title,url,source_domain}][0:5]),
                fetched_pages_count:((.fetched_pages // [])|length)
              }' "$RUNNER_TEMP/deep33-vercel-spanish-search.json"
              echo "VERCEL_SPANISH_REALTIME_TOPIC_SEARCH_PASS"
              exit 0
            fi
            echo "VERCEL_SPANISH_REALTIME_TOPIC_SEARCH_RETRY attempt=$attempt http=$status_code"
            jq -c '{ok,status,code,errors,domains_used,extracted_text_chars,results:([.results[]? | {title,url,source_domain}][0:5]),fetched_pages_count:((.fetched_pages // [])|length)}' "$RUNNER_TEMP/deep33-vercel-spanish-search.json" 2>/dev/null || true
            [ "$attempt" -lt 8 ] && sleep 5
          done
          echo "VERCEL_SPANISH_REALTIME_TOPIC_SEARCH_FAIL http=$status_code"
          exit 1

      - name: Mint fresh OIDC token for finance-stream check
        id: vercel_finance_oidc
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Verify current Chilean dollar through Android streaming endpoint
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel_finance_oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/deep33-vercel-finance.sse"
          headers="$RUNNER_TEMP/deep33-vercel-finance.headers"
          set +e
          status_code="$(curl -sS --no-buffer --connect-timeout 10 --max-time 45 \
            -D "$headers" -o "$body" -w "%{http_code}" \
            -X POST "$VERCEL_URL/v1/chat/stream" \
            -H "Authorization: Bearer $DEEP33_VERCEL_TEST_TOKEN" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "X-DEEP33-Session-Id: $DEEP33_VERCEL_TEST_SESSION_ID" \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            -H "x-vercel-protection-bypass: $VERCEL_PROTECTION_BYPASS" \
            -H "X-Request-ID: ci-vercel-finance-$GITHUB_RUN_ID" \
            -H "X-Idempotency-Key: ci-vercel-finance-$GITHUB_RUN_ID" \
            -H "X-DEEP33-Personality: NEUTRO" \
            -H "x-deep33-skip-web-tools: true" \
            -H "Accept: text/event-stream" \
            -H "Content-Type: application/json" \
            --data '{"messages":[{"role":"user","content":"Valor del dólar en Chile hoy"}],"personality":"NEUTRO"}')"
          curl_rc=$?
          set -e
          echo "VERCEL_FINANCE_STREAM http=$status_code curl_exit=$curl_rc"
          if [ "$curl_rc" -ne 0 ] || [ "$status_code" != "200" ]; then
            tail -c 2500 "$body" 2>/dev/null || true
            exit 1
          fi
          python - "$body" <<'PY'
          import json
          import re
          import sys
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          raw = open(sys.argv[1], encoding="utf-8").read()
          chunks = []
          for block in re.split(r"\r?\n\r?\n", raw):
              data_lines = [
                  line[5:].strip()
                  for line in block.splitlines()
                  if line.startswith("data:")
              ]
              if not data_lines:
                  continue
              payload = "\n".join(data_lines)
              if payload == "[DONE]":
                  continue
              try:
                  item = json.loads(payload)
              except (json.JSONDecodeError, TypeError):
                  continue
              choices = item.get("choices") or []
              if choices:
                  delta = (choices[0].get("delta") or {}).get("content")
                  if isinstance(delta, str):
                      chunks.append(delta)

          answer = "".join(chunks)
          print("VERCEL_FINANCE_ANSWER=" + answer.replace("\n", " ")[:1800])
          if not answer.strip():
              raise SystemExit("VERCEL_FINANCE_STREAM_EMPTY_TEXT")

          source = re.search(
              r"Fuentes consultadas:\s*-?\s*[^:\r\n]+:\s*(https://[^\s)]+)",
              answer,
              flags=re.IGNORECASE,
          )
          if not source:
              raise SystemExit("VERCEL_FINANCE_STREAM_SOURCE_MISSING")
          source_url = source.group(1).rstrip(".,")
          host = (urlparse(source_url).hostname or "").lower()
          yahoo = "Yahoo Finance (USD/CLP)" in answer and host == "query1.finance.yahoo.com"
          official = "MiIndicador.cl (official fallback)" in answer and host == "mindicador.cl"
          if not (yahoo or official):
              raise SystemExit("VERCEL_FINANCE_STREAM_SOURCE_UNEXPECTED")

          market = re.search(
              r"1 dólar estadounidense = ([0-9.]+(?:,[0-9]{1,2})?) pesos chilenos\.\s*"
              r"Hora de mercado reportada:\s*([^\s]+)",
              answer,
              flags=re.IGNORECASE,
          )
          daily = re.search(
              r"El dólar observado informado por .+? es ([0-9.]+(?:,[0-9]{1,2})?) "
              r"pesos chilenos por dólar para la fecha (\d{4}-\d{2}-\d{2})",
              answer,
              flags=re.IGNORECASE,
          )
          if market:
              value_text, timestamp_text = market.groups()
              quote_time = datetime.fromisoformat(timestamp_text.replace("Z", "+00:00"))
              age_seconds = (datetime.now(timezone.utc) - quote_time.astimezone(timezone.utc)).total_seconds()
              if age_seconds < -300 or age_seconds > 36 * 3600:
                  raise SystemExit("VERCEL_FINANCE_STREAM_MARKET_QUOTE_STALE")
          elif daily:
              value_text, date_text = daily.groups()
              quote_date = datetime.fromisoformat(date_text).date()
              age_days = (datetime.now(timezone.utc).date() - quote_date).days
              if age_days < -1 or age_days > 3:
                  raise SystemExit("VERCEL_FINANCE_STREAM_DAILY_QUOTE_STALE")
          else:
              raise SystemExit("VERCEL_FINANCE_STREAM_NUMERIC_QUOTE_MISSING")

          normalized = (
              value_text.replace(".", "").replace(",", ".")
              if "," in value_text
              else value_text.replace(".", "")
          )
          value = float(normalized)
          if not 50 <= value <= 10000:
              raise SystemExit("VERCEL_FINANCE_STREAM_VALUE_OUT_OF_RANGE")

          print(
              "VERCEL_FINANCE_STREAM_PASS "
              f"provider={'Yahoo Finance' if yahoo else 'MiIndicador.cl'} "
              f"value={value_text} source={source_url}"
          )
          PY
          
  performance_gate:
    needs: [backend_unit, android_validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: pip install -r backend/requirements.txt
      - name: Performance architecture contract
        run: |
          set -euo pipefail
          python -m pytest tests/test_performance_contract.py tests/test_web_loop.py tests/test_search_engine.py -q
          echo "DEEP33_PERFORMANCE_CONTRACT_PASS"
      - name: Protect transport endpoint contract
        run: |
          set -euo pipefail
          python -m pytest tests/test_connectivity_hardening.py -q
          echo "TRANSPORT_ENDPOINT_CONTRACT_PASS"
      - name: Phase 11 performance trace certification
        run: |
          set -euo pipefail
          python -m pytest tests/test_performance_contract.py -q
          echo "DEEP33_PHASE_11_TRACE_PASS"
      - name: Static performance invariants
        run: |
          set -euo pipefail
          grep -q 'async def deferred_stream()' backend/main.py
          grep -q 'async for chunk in stream_gateway(' backend/main.py
          grep -q '_sse_status("thinking"' backend/main.py
          grep -q '_sse_status("token_stream"' backend/main.py
          ! grep -q '_sse_text_chunks(result\["text"\])' backend/main.py
          grep -q 'PARALLEL_PROVIDERS' backend/search/engine.py
          grep -q 'SEARCH_CACHE_TTL_SECONDS' tools/web_search.py
          grep -q 'generationStateListeners' android/app/src/main/java/cl/caggrometal/deep33/SessionStore.kt
          grep -q 'lastCheckpointAt' android/app/src/main/java/cl/caggrometal/deep33/Deep33GenerationService.kt
          grep -q 'speakStreamingSentences' android/app/src/main/java/cl/caggrometal/deep33/MainActivity.kt
          echo "DEEP33_PERFORMANCE_INVARIANTS_PASS"

  android_feature_instrumentation:
    needs: backend_unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEEP33_PRIMARY_URL: https://deep33-backend-iac33.vercel.app
      DEEP33_SECONDARY_URL: https://deep33-backend-git-main-iac33.vercel.app
      DEEP33_TERTIARY_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Enable KVM for Android Emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Run DEEP33 local feature instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-feature-tests
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          disable-spellchecker: true
          channel: stable
          working-directory: android
          script: |
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cl.caggrometal.deep33.Deep33UiContractV2Test,cl.caggrometal.deep33.Deep33FeaturePersistenceTest,cl.caggrometal.deep33.Deep33LifecycleRecoveryTest,cl.caggrometal.deep33.SessionStorePersistenceTest --no-daemon

  change_scope:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.scope.outputs.backend_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: scope
        run: |
          set -euo pipefail
          baseline="${{ github.event.before }}"
          backend_changed=true
          echo "SCOPE_BASELINE=event-before:$baseline"

          # A missing/invalid push baseline must fail closed to running the gates.
          if [ "${{ github.event_name }}" = "push" ] &&
             [ -n "$baseline" ] &&
             [ "$baseline" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "$baseline^{commit}" 2>/dev/null; then
            if changed="$(git diff --name-only "$baseline" "$GITHUB_SHA")"; then
              backend_changed=false
              if printf "%s\\n" "$changed" | grep -Eq '^(backend/|supabase/|Dockerfile$|android/app/build.gradle.kts$|android/app/src/main/java/cl/caggrometal/deep33/Deep33Api.kt$|android/deep33-real-connectivity-e2e.sh$|.github/workflows/)'; then
                backend_changed=true
              fi
            else
              echo "SCOPE_DIFF_UNAVAILABLE_FAIL_CLOSED"
              backend_changed=true
            fi
          fi
          echo "backend_changed=$backend_changed" >> "$GITHUB_OUTPUT"


  production_gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [backend_unit, change_scope]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for backend change detection
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Create authenticated production gate session
        run: |
          set -euo pipefail
          token=""
          for attempt in $(seq 1 3); do
            profile_id="ci-production-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${SECONDS}-${attempt}"
            status="$(curl -sS --connect-timeout 8 --max-time 30 -o "$RUNNER_TEMP/deep33-gate-auth.json" -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/deep33-auth" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "content-type: application/json" -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}" || true)"
            if [ "$status" = "200" ]; then
              token="$(jq -r '.access_token // empty' "$RUNNER_TEMP/deep33-gate-auth.json")"
              break
            fi
            if [ "$status" = "409" ]; then echo "GATE_AUTH_PROFILE_COLLISION attempt=$attempt"; continue; fi
            echo "GATE_AUTH_SESSION_FAILED status=$status"
            jq -c '{error: (.error // "unknown")}' "$RUNNER_TEMP/deep33-gate-auth.json" || true
            exit 1
          done
          test -n "$token" || { echo "GATE_AUTH_SESSION_FAILED retries_exhausted"; exit 1; }
          cat > "$RUNNER_TEMP/deep33-authenticated-curl.sh" <<'BASH'
          curl() {
            local arg has_auth=0
            for arg in "$@"; do
              case "$arg" in Authorization:*|authorization:*) has_auth=1 ;; esac
            done
            if [ "$has_auth" = "1" ]; then
              command curl "$@"
            else
              command curl "$@" -H "Authorization: Bearer ${DEEP33_GATE_TOKEN:?DEEP33_GATE_TOKEN_MISSING}"
            fi
          }
          BASH
          echo "DEEP33_GATE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "BASH_ENV=$RUNNER_TEMP/deep33-authenticated-curl.sh" >> "$GITHUB_ENV"
      - name: Verify real multiuser memory isolation by JWT sub
        run: |
          set -euo pipefail
          session="ci-isolation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          marker_a="DEEP33_USER_A_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${RANDOM}"
          marker_b="DEEP33_USER_B_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${RANDOM}"

          profile_b="ci-isolation-b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${SECONDS}"
          command curl -sS --connect-timeout 8 --max-time 30 \
            -o "$RUNNER_TEMP/deep33-isolation-auth-b.json" -w "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/deep33-auth" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "content-type: application/json" \
            -d "{\"action\":\"session\",\"memory_profile_id\":\"${profile_b}\"}" \
            > "$RUNNER_TEMP/deep33-isolation-auth-b.status"
          test "$(cat "$RUNNER_TEMP/deep33-isolation-auth-b.status")" = "200" || {
            echo "MULTIUSER_AUTH_B_FAIL"
            cat "$RUNNER_TEMP/deep33-isolation-auth-b.json" || true
            exit 1
          }
          token_b="$(jq -r '.access_token // empty' "$RUNNER_TEMP/deep33-isolation-auth-b.json")"
          test -n "$token_b"

          remember() {
            local token="$1" marker="$2" out="$3"
            local status
            status="$(curl -sS --connect-timeout 8 --max-time 30 -o "$out" -w "%{http_code}" \
              -X POST "$PRIMARY_URL/v1/memory/remember" \
              -H "Authorization: Bearer $token" \
              -H "X-DEEP33-Session-Id: $session" \
              -H "content-type: application/json" \
              -d "$(jq -nc --arg content "$marker" '{kind:"explicit",content:$content}')" || true)"
            test "$status" = "200" || { echo "MULTIUSER_REMEMBER_FAIL http=$status"; cat "$out" || true; exit 1; }
          }

          remember "$DEEP33_GATE_TOKEN" "$marker_a" "$RUNNER_TEMP/deep33-user-a-remember.json"
          remember "$token_b" "$marker_b" "$RUNNER_TEMP/deep33-user-b-remember.json"

          context() {
            local token="$1" out="$2"
            local status
            status="$(curl -sS --connect-timeout 8 --max-time 30 -o "$out" -w "%{http_code}" \
              "$PRIMARY_URL/v1/memory/context" \
              -H "Authorization: Bearer $token" \
              -H "X-DEEP33-Session-Id: $session" || true)"
            test "$status" = "200" || { echo "MULTIUSER_CONTEXT_FAIL http=$status"; cat "$out" || true; exit 1; }
          }

          context "$DEEP33_GATE_TOKEN" "$RUNNER_TEMP/deep33-user-a-context.json"
          context "$token_b" "$RUNNER_TEMP/deep33-user-b-context.json"

          jq -e --arg own "$marker_a" 'tostring | contains($own)' "$RUNNER_TEMP/deep33-user-a-context.json" >/dev/null
          jq -e --arg other "$marker_b" 'tostring | contains($other) | not' "$RUNNER_TEMP/deep33-user-a-context.json" >/dev/null
          jq -e --arg own "$marker_b" 'tostring | contains($own)' "$RUNNER_TEMP/deep33-user-b-context.json" >/dev/null
          jq -e --arg other "$marker_a" 'tostring | contains($other) | not' "$RUNNER_TEMP/deep33-user-b-context.json" >/dev/null
          echo "DEEP33_MULTIUSER_JWT_ISOLATION_PASS"

      - name: Validate PRIMARY deployment when backend changed
        run: |
          set -euo pipefail
          echo "PRODUCTION_SCOPE_BACKEND_CHANGED=${{ needs.change_scope.outputs.backend_changed }}"
          if [ "${{ needs.change_scope.outputs.backend_changed }}" != "true" ]; then
            echo "PRIMARY_DEPLOY_SHA_CHECK_SKIPPED_BACKEND_UNCHANGED"
            exit 0
          fi

          ready=0
          for attempt in $(seq 1 12); do
            echo "PRIMARY_DEPLOY_ATTEMPT=$attempt expected=$GITHUB_SHA"
            body="$(curl -sS --connect-timeout 8 --max-time 30 "$PRIMARY_URL/health" || true)"
            echo "$body"
            if printf "%s" "$body" | jq -e --arg sha "$GITHUB_SHA" '.status=="PASS" and .service=="DEEP33 Backend" and .git_sha==$sha' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = "1" || {
            echo "PRIMARY_DEPLOY_SHA_NOT_READY"
            exit 1
          }
          echo "PRIMARY_DEPLOY_SHA_PASS"

      - name: Verify DEEP33 edge connectivity and search
        run: |
          set -euo pipefail
          audit_ok=0
          for attempt in $(seq 1 6); do
            echo "EDGE_AUDIT_ATTEMPT=$attempt"
            if curl -fsS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/health" >/tmp/health.json &&
              jq -e '.status=="PASS" and (.service=="DEEP33 Edge Gateway" or .service=="DEEP33 Backend")' /tmp/health.json >/dev/null &&
              curl -fsS --connect-timeout 8 --max-time 90 "$PRIMARY_URL/v1/connectivity/audit" >/tmp/audit.json &&
              jq -e '.status=="PASS" and .edge=="PASS" and .internet=="PASS" and .upstream.ready==true and .search.ok==true and (.search.results|length)>=1' /tmp/audit.json >/dev/null; then
              audit_ok=1
              break
            fi
            echo "EDGE_AUDIT_NOT_READY"
            sleep 10
          done
          if [ "$audit_ok" != "1" ]; then
            echo "DEEP33_INTERNET_SEARCH_FAIL"
            echo "HEALTH_BODY_BEGIN"
            cat /tmp/health.json 2>/dev/null || true
            echo
            echo "HEALTH_BODY_END"
            echo "AUDIT_BODY_BEGIN"
            cat /tmp/audit.json 2>/dev/null || true
            echo
            echo "AUDIT_BODY_END"
            exit 1
          fi
          echo "DEEP33_INTERNET_SEARCH_PASS"

      - name: Require independent failover endpoints
        env:
          PRIMARY_URL: ${{ env.PRIMARY_URL }}
          SECONDARY_URL: ${{ env.SECONDARY_URL }}
          TERTIARY_URL: ${{ env.TERTIARY_URL }}
        run: |
          set -euo pipefail
          if [ -n "$SECONDARY_URL" ] && [ -n "$TERTIARY_URL" ]; then
            test "$PRIMARY_URL" != "$SECONDARY_URL" || { echo "PRIMARY_SECONDARY_DUPLICATE"; exit 1; }
            test "$PRIMARY_URL" != "$TERTIARY_URL" || { echo "PRIMARY_TERTIARY_DUPLICATE"; exit 1; }
            test "$SECONDARY_URL" != "$TERTIARY_URL" || { echo "SECONDARY_TERTIARY_DUPLICATE"; exit 1; }
            echo "FAILOVER_DIVERSITY_PASS"
          else
            echo "FAILOVER_DIVERSITY_SKIPPED_SINGLE_CANONICAL_EDGE"
          fi
      - name: Verify production endpoint diversity
        run: |
          set -euo pipefail
          test -n "$PRIMARY_URL"
          if [ -n "$SECONDARY_URL" ] && [ -n "$TERTIARY_URL" ]; then
            test "$PRIMARY_URL" != "$SECONDARY_URL"
            test "$PRIMARY_URL" != "$TERTIARY_URL"
            test "$SECONDARY_URL" != "$TERTIARY_URL"
            echo "FAILOVER_ENDPOINT_DIVERSITY_PASS"
          else
            echo "FAILOVER_ENDPOINT_DIVERSITY_SKIPPED_SINGLE_CANONICAL_EDGE"
          fi

      - name: Verify all production nodes readiness
        run: |
          set -euo pipefail
          entries=("PRIMARY|$PRIMARY_URL")
          [ -n "$SECONDARY_URL" ] && entries+=("SECONDARY|$SECONDARY_URL")
          [ -n "$TERTIARY_URL" ] && entries+=("TERTIARY|$TERTIARY_URL")
          for entry in "${entries[@]}"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            ok=0
            last_body=""
            for i in $(seq 1 6); do
              last_body="$(curl -sS --connect-timeout 8 --max-time 45 "$url/ready" || true)"
              if printf "%s" "$last_body" | jq -e '.status=="PASS" and .ready==true' >/dev/null 2>&1; then
                echo "${name}_READY_PASS"
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "${name}_READY_FAIL"
              echo "${name}_READY_BODY_BEGIN"
              printf "%s\n" "$last_body"
              echo "${name}_READY_BODY_END"
              diag="$(curl -sS --connect-timeout 8 --max-time 90 "$url/v1/ai/diagnostics" || true)"
              echo "${name}_DIAGNOSTICS_BEGIN"
              printf "%s\n" "$diag"
              echo "${name}_DIAGNOSTICS_END"
              exit 1
            fi
          done

      - name: Verify PRIMARY memory availability
        run: |
          set -euo pipefail
          SESSION="ci-memory-${{ github.run_id }}"
          curl -fsS --connect-timeout 8 --max-time 45 \
            "$PRIMARY_URL/v1/memory/context" \
            -H "X-DEEP33-Session-Id: $SESSION" |
            jq -e 'has("messages") and has("memories")'
          echo "PRIMARY_MEMORY_AVAILABLE_PASS"

      - name: Verify PRIMARY real inference
        run: |
          set -euo pipefail
          diagnostics_ok=0
          for attempt in $(seq 1 5); do
            status="$(curl -sS --connect-timeout 8 --max-time 60 -o /tmp/diag.json -w "%{http_code}" "$PRIMARY_URL/v1/ai/diagnostics" || true)"
            if [ "$status" = "200" ] && jq -e '.online==true and .checks.MODEL=="PASS" and .checks.CHAT=="PASS"' /tmp/diag.json >/dev/null 2>&1; then
              diagnostics_ok=1
              break
            fi
            echo "PRIMARY_INFERENCE_NOT_READY attempt=$attempt http=$status"
            jq -c '{online,checks,inference,timestamp}' /tmp/diag.json 2>/dev/null || true
            [ "$attempt" -lt 5 ] && sleep 5
          done
          test "$diagnostics_ok" = "1" || { echo "PRIMARY_INFERENCE_FAIL"; cat /tmp/diag.json 2>/dev/null || true; exit 1; }
          jq -c '{online,checks,inference}' /tmp/diag.json
          echo "PRIMARY_INFERENCE_PASS"


      - name: Verify PRIMARY Hybrid Search + pgvector
        run: |
          set -euo pipefail
          SESSION="ci-hybrid-${{ github.run_id }}"
          STATUS="$(curl -fsS --connect-timeout 8 --max-time 30 "$PRIMARY_URL/v1/search/hybrid/status" -H "X-DEEP33-Session-Id: $SESSION")"
          if ! printf "%s" "$STATUS" | jq -e '.engine=="DEEP33 Hybrid Search" and .engine_version=="1.3.0" and .enabled==true and .configured==true and .dimensions==1536 and .transport=="supabase_edge_function" and .vector_backend=="pgvector" and .keyword_backend=="postgresql_tsvector"' >/dev/null; then
            echo "PRIMARY_HYBRID_STATUS_FAIL"
            printf "%s\n" "$STATUS"
            exit 1
          fi
          echo "PRIMARY_HYBRID_STATUS_PASS"

          EDGE_STATUS="$(curl -fsS --connect-timeout 8 --max-time 30 "$PRIMARY_URL/v1/ai/edge-status")"
          echo "PRIMARY_EDGE_AI_STATUS=$EDGE_STATUS"

          EMBEDDING="$(python -c 'import json; print(json.dumps([1.0]+[0.0]*1535))')"
          BODY="$(jq -n --arg q "DEEP33 hybrid verification" --argjson e "$EMBEDDING" '{query:$q,embedding:$e,limit:5,metadata_filter:{}}')"
          hybrid_ok=0
          last_search=""
          for attempt in $(seq 1 3); do
            echo "PRIMARY_HYBRID_SEARCH_ATTEMPT=$attempt"
            last_search="$(curl -sS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/v1/search/hybrid" -H "Content-Type: application/json" -H "X-DEEP33-Session-Id: $SESSION" -d "$BODY" || true)"
            if printf "%s" "$last_search" | jq -e '.engine=="DEEP33 Hybrid Search" and .engine_version=="1.3.0" and .mode=="hybrid" and (.results|type)=="array"' >/dev/null 2>&1; then
              hybrid_ok=1
              break
            fi
            echo "PRIMARY_HYBRID_SEARCH_NOT_READY"
            printf "%s\n" "$last_search"
            sleep 5
          done
          if [ "$hybrid_ok" != "1" ]; then
            echo "PRIMARY_HYBRID_SEARCH_FAIL"
            printf "%s\n" "$last_search"
            exit 1
          fi
          echo "PRIMARY_HYBRID_SEARCH_PASS"
      - name: Verify PRIMARY DEEP33 Search Engine
        run: |
          set -euo pipefail
          SESSION="${{ github.run_id }}"
          status_ok=0
          for attempt in $(seq 1 3); do
            STATUS="$(curl -sS --connect-timeout 8 --max-time 30 "$PRIMARY_URL/v1/web/status" -H "X-DEEP33-Session-Id: $SESSION" || true)"
            if printf "%s" "$STATUS" | jq -e '.engine=="DEEP33 Search Engine" and .engine_version=="1.3.0" and .tool_loop_enabled==true' >/dev/null 2>&1; then
              status_ok=1
              break
            fi
            echo "PRIMARY_WEB_STATUS_NOT_READY attempt=$attempt"
            printf "%s\n" "$STATUS"
            sleep 5
          done
          test "$status_ok" = "1"

          search_ok=0
          for attempt in $(seq 1 3); do
            SEARCH="$(curl -sS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/v1/web/search?q=Noticias%20mundiales" -H "X-DEEP33-Session-Id: $SESSION" || true)"
            if printf "%s" "$SEARCH" | jq -e '.ok==true and .engine=="DEEP33 Search Engine" and .engine_version=="1.3.0" and .realtime==true and .depth=="realtime" and (.results|length)>=1 and (.verification.distinct_domains)>=1' >/dev/null 2>&1; then
              search_ok=1
              break
            fi
            echo "PRIMARY_WEB_SEARCH_NOT_READY query=Noticias-mundiales attempt=$attempt"
            printf "%s\n" "$SEARCH"
            sleep 5
          done
          test "$search_ok" = "1"

          direct_ok=0
          for attempt in $(seq 1 3); do
            DIRECT_STATUS="$(curl -sS --connect-timeout 8 --max-time 120 -o /tmp/direct-ai.json -w "%{http_code}" "$PRIMARY_URL/v1/ai/generate" \
              -H "Content-Type: application/json" \
              -H "X-DEEP33-Session-Id: $SESSION-direct-$attempt" \
              -H "X-Idempotency-Key: ci-direct-generation-${{ github.run_id }}-$attempt" \
              -H "X-DEEP33-Skip-Web-Tools: true" \
              -d '{"messages":[{"role":"user","content":"Responde solo: OK"}]}')"
            echo "PRIMARY_DIRECT_GENERATION_HTTP=$DIRECT_STATUS attempt=$attempt"
            if [ "$DIRECT_STATUS" = "200" ]; then
              direct_ok=1
              break
            fi
            cat /tmp/direct-ai.json || true
            sleep 5
          done
          if [ "$direct_ok" != "1" ]; then
            echo "PRIMARY_DIRECT_GENERATION_FAIL_BODY_BEGIN"
            cat /tmp/direct-ai.json || true
            echo
            echo "PRIMARY_DIRECT_GENERATION_FAIL_BODY_END"
            exit 1
          fi
          echo "PRIMARY_DIRECT_GENERATION_PASS"

          web_ok=0
          for attempt in $(seq 1 3); do
            WEB_STATUS="$(curl -sS --connect-timeout 8 --max-time 120 -o /tmp/web-ai.json -w "%{http_code}" "$PRIMARY_URL/v1/ai/generate" \
              -H "Content-Type: application/json" \
              -H "X-DEEP33-Session-Id: $SESSION-web-$attempt" \
              -H "X-Idempotency-Key: ci-web-generation-${{ github.run_id }}-$attempt" \
              -d '{"messages":[{"role":"user","content":"Busca en internet la fecha actual en Chile y responde solo: OK"}]}')"
            echo "PRIMARY_WEB_GENERATION_HTTP=$WEB_STATUS attempt=$attempt"
            if [ "$WEB_STATUS" = "200" ]; then
              web_ok=1
              break
            fi
            cat /tmp/web-ai.json || true
            sleep 5
          done
          if [ "$web_ok" != "1" ]; then
            echo "PRIMARY_WEB_GENERATION_FAIL_BODY_BEGIN"
            cat /tmp/web-ai.json || true
            echo
            echo "PRIMARY_WEB_GENERATION_FAIL_BODY_END"
            exit 1
          fi
          echo "PRIMARY_WEB_SEARCH_ENGINE_PASS"

  android_e2e:
    # On a PR, run the real Android app against that PR's protected Vercel preview
    # using a short-lived GitHub OIDC token; on main, test the public production alias.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/vercel-android-route-221026')) && needs.android_validation.result == 'success' && needs.change_scope.result == 'success' }}
    needs: [android_validation, change_scope]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      DEEP33_E2E_VERCEL_URL: ${{ github.event_name == 'pull_request' && 'https://deep33-backend-git-fix-vercel-android-route-221026-iac33.vercel.app' || 'https://deep33-backend.vercel.app' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Enable KVM for Android Emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm


      - name: Android real connectivity E2E — attempt 1
        id: android_e2e_attempt_1
        continue-on-error: true
        env:
          DEEP33_E2E_VERCEL_URL: ${{ env.DEEP33_E2E_VERCEL_URL }}
          DEEP33_PRIMARY_URL: ${{ env.PRIMARY_URL }}
          DEEP33_SECONDARY_URL: ${{ env.SECONDARY_URL }}
          DEEP33_E2E_ATTEMPT: "1"
          DEEP33_REQUIRE_REDUNDANCY: "false"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 1.1.1.1,8.8.8.8
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          working-directory: android
          script: bash deep33-real-connectivity-e2e.sh

      - name: Android real connectivity E2E — attempt 2
        id: android_e2e_attempt_2
        if: ${{ steps.android_e2e_attempt_1.outcome != 'success' }}
        continue-on-error: true
        env:
          DEEP33_E2E_VERCEL_URL: ${{ env.DEEP33_E2E_VERCEL_URL }}
          DEEP33_PRIMARY_URL: ${{ env.PRIMARY_URL }}
          DEEP33_SECONDARY_URL: ${{ env.SECONDARY_URL }}
          DEEP33_E2E_ATTEMPT: "2"
          DEEP33_REQUIRE_REDUNDANCY: "true"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-retry
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 1.1.1.1,8.8.8.8
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          working-directory: android
          script: bash deep33-real-connectivity-e2e.sh

      - name: Android real connectivity E2E — attempt 3
        id: android_e2e_attempt_3
        if: ${{ steps.android_e2e_attempt_1.outcome != 'success' && steps.android_e2e_attempt_2.outcome != 'success' }}
        continue-on-error: true
        env:
          DEEP33_E2E_VERCEL_URL: ${{ env.DEEP33_E2E_VERCEL_URL }}
          DEEP33_PRIMARY_URL: ${{ env.PRIMARY_URL }}
          DEEP33_SECONDARY_URL: ${{ env.SECONDARY_URL }}
          DEEP33_E2E_ATTEMPT: "3"
          DEEP33_REQUIRE_REDUNDANCY: "true"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-final
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 1.1.1.1,8.8.8.8
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          working-directory: android
          script: bash deep33-real-connectivity-e2e.sh

      - name: Assert Android E2E success
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # The emulator wrapper can fail during teardown after instrumentation already
          # passed. Trust only a marker written by the test script after all test
          # assertions pass; never infer a pass from emulator startup or build success.
          if [ -f /tmp/deep33-e2e/attempt-1-pass.marker ] ||
             [ -f /tmp/deep33-e2e/attempt-2-pass.marker ] ||
             [ -f /tmp/deep33-e2e/attempt-3-pass.marker ]; then
            echo "ANDROID_E2E_PASS verified_instrumentation_marker"
            exit 0
          fi
          if [ "${{ steps.android_e2e_attempt_1.outcome }}" = "success" ] ||
             [ "${{ steps.android_e2e_attempt_2.outcome }}" = "success" ] ||
             [ "${{ steps.android_e2e_attempt_3.outcome }}" = "success" ]; then
            echo "ANDROID_E2E_PASS emulator_runner_success"
            exit 0
          fi
          echo "ANDROID_E2E_FAIL all_attempts_failed_no_instrumentation_marker"
          exit 1

      - name: Android E2E diagnostics
        if: ${{ always() }}
        run: |
          set +e
          mkdir -p /tmp/deep33-e2e
          echo "=== ADB DEVICES ==="
          adb devices -l || true
          echo "=== SDK ==="
          timeout 10s adb shell getprop ro.build.version.sdk || true
          timeout 10s adb shell getprop ro.build.version.release || true
          echo "=== DNS ==="
          timeout 10s adb shell getprop net.dns1 || true
          timeout 10s adb shell getprop net.dns2 || true
          echo "=== INSTRUMENTATION ==="
          timeout 10s adb shell pm list instrumentation || true
          echo "=== PROCESSES ==="
          timeout 10s adb shell ps -A | grep -Ei 'instrument|deep33|gradle' || true
          echo "=== CRASH BUFFER ==="
          timeout 15s adb logcat -d -b crash -t 1200 > /tmp/deep33-e2e/crash.log || true

      - name: Publish APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ success() }}
        with:
          name: DEEP33-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Android E2E evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: DEEP33-android-e2e-evidence
          path: |
            /tmp/deep33-e2e
            android/app/build/outputs/androidTest-results
            android/app/build/outputs/logs
          if-no-files-found: warn

  recovery_gate:
    needs: [android_e2e, android_validation, change_scope]
    # Always collect recovery evidence after E2E, even when E2E itself fails.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.android_validation.result == 'success' && needs.change_scope.result == 'success' }}
    runs-on: ubuntu-latest
    steps:

      - name: Create authenticated recovery gate session
        run: |
          set -euo pipefail
          token=""
          for attempt in $(seq 1 3); do
            profile_id="ci-recovery-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${SECONDS}-${attempt}"
            status="$(curl -sS --connect-timeout 8 --max-time 30 -o "$RUNNER_TEMP/deep33-gate-auth.json" -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/deep33-auth" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "content-type: application/json" -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}" || true)"
            if [ "$status" = "200" ]; then
              token="$(jq -r '.access_token // empty' "$RUNNER_TEMP/deep33-gate-auth.json")"
              break
            fi
            if [ "$status" = "409" ]; then echo "GATE_AUTH_PROFILE_COLLISION attempt=$attempt"; continue; fi
            echo "GATE_AUTH_SESSION_FAILED status=$status"
            jq -c '{error: (.error // "unknown")}' "$RUNNER_TEMP/deep33-gate-auth.json" || true
            exit 1
          done
          test -n "$token" || { echo "GATE_AUTH_SESSION_FAILED retries_exhausted"; exit 1; }
          cat > "$RUNNER_TEMP/deep33-authenticated-curl.sh" <<'BASH'
          curl() {
            local arg has_auth=0
            for arg in "$@"; do
              case "$arg" in Authorization:*|authorization:*) has_auth=1 ;; esac
            done
            if [ "$has_auth" = "1" ]; then
              command curl "$@"
            else
              command curl "$@" -H "Authorization: Bearer ${DEEP33_GATE_TOKEN:?DEEP33_GATE_TOKEN_MISSING}"
            fi
          }
          BASH
          echo "DEEP33_GATE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "BASH_ENV=$RUNNER_TEMP/deep33-authenticated-curl.sh" >> "$GITHUB_ENV"
      - name: Verify all production nodes after Android E2E
        run: |
          set -euo pipefail
          entries=("PRIMARY|$PRIMARY_URL")
          [ -n "$SECONDARY_URL" ] && entries+=("SECONDARY|$SECONDARY_URL")
          [ -n "$TERTIARY_URL" ] && entries+=("TERTIARY|$TERTIARY_URL")
          for entry in "${entries[@]}"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            node_ok=0
            for attempt in $(seq 1 3); do
              health_code="$(curl -sS --connect-timeout 8 --max-time 20 -o "/tmp/${name,,}-recovery-health.json" -w "%{http_code}" "$url/health" || true)"
              ready_code="$(curl -sS --connect-timeout 8 --max-time 30 -o "/tmp/${name,,}-recovery-ready.json" -w "%{http_code}" "$url/ready" || true)"
              if [ "$health_code" = "200" ] &&
                 jq -e '.status=="PASS"' "/tmp/${name,,}-recovery-health.json" >/dev/null 2>&1 &&
                 [ "$ready_code" = "200" ] &&
                 jq -e '.status=="PASS" and .ready==true' "/tmp/${name,,}-recovery-ready.json" >/dev/null 2>&1; then
                node_ok=1
                break
              fi
              echo "${name}_RECOVERY_NOT_READY attempt=$attempt health=$health_code ready=$ready_code"
              jq -c '{status,service,timestamp}' "/tmp/${name,,}-recovery-health.json" 2>/dev/null || true
              jq -c '{status,ready,checks,timestamp}' "/tmp/${name,,}-recovery-ready.json" 2>/dev/null || true
              sleep 3
            done
            test "$node_ok" = "1" || { echo "${name}_RECOVERY_FAIL"; exit 1; }
            echo "${name}_RECOVERY_PASS"
          done

      - name: Verify PRIMARY edge and inference after recovery
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 90 "$PRIMARY_URL/v1/connectivity/audit" |
            jq -e '.status=="PASS" and .edge=="PASS" and .internet=="PASS" and .upstream.ready==true and .search.ok==true'
          inference_ok=0
          for attempt in $(seq 1 3); do
            diag="$(curl -sS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/v1/ai/diagnostics" || true)"
            if printf '%s' "$diag" | jq -e '.online==true and .checks.MODEL=="PASS" and .checks.CHAT=="PASS"' >/dev/null 2>&1; then
              inference_ok=1
              break
            fi
            echo "RECOVERY_INFERENCE_NOT_READY attempt=$attempt"
            printf '%s' "$diag" | jq -c '{online,checks,inference,timestamp}' 2>/dev/null || true
            sleep 3
          done
          test "$inference_ok" = "1" || { echo "RECOVERY_INFERENCE_FAIL"; exit 1; }
          echo "RECOVERY_INFERENCE_PASS"


  release_gate:
    needs: [change_scope, backend_unit, production_realtime_search, vercel_realtime_search, android_validation, performance_gate, android_feature_instrumentation, production_gate, android_e2e, recovery_gate]
    # Run on every main push; fail explicitly when a required gate did not pass.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require all production and Android gates
        env:
          DEEP33_CHANGE_SCOPE_RESULT: ${{ needs.change_scope.result }}
          DEEP33_BACKEND_UNIT_RESULT: ${{ needs.backend_unit.result }}
          DEEP33_REALTIME_SEARCH_RESULT: ${{ needs.production_realtime_search.result }}
          DEEP33_VERCEL_REALTIME_RESULT: ${{ needs.vercel_realtime_search.result }}
          DEEP33_ANDROID_VALIDATION_RESULT: ${{ needs.android_validation.result }}
          DEEP33_PERFORMANCE_GATE_RESULT: ${{ needs.performance_gate.result }}
          DEEP33_ANDROID_FEATURE_RESULT: ${{ needs.android_feature_instrumentation.result }}
          DEEP33_PRODUCTION_GATE_RESULT: ${{ needs.production_gate.result }}
          DEEP33_ANDROID_E2E_RESULT: ${{ needs.android_e2e.result }}
          DEEP33_RECOVERY_GATE_RESULT: ${{ needs.recovery_gate.result }}
        run: |
          set -euo pipefail
          results=(
            "$DEEP33_CHANGE_SCOPE_RESULT"
            "$DEEP33_BACKEND_UNIT_RESULT"
            "$DEEP33_REALTIME_SEARCH_RESULT"
            "$DEEP33_VERCEL_REALTIME_RESULT"
            "$DEEP33_ANDROID_VALIDATION_RESULT"
            "$DEEP33_PERFORMANCE_GATE_RESULT"
            "$DEEP33_ANDROID_FEATURE_RESULT"
            "$DEEP33_PRODUCTION_GATE_RESULT"
            "$DEEP33_ANDROID_E2E_RESULT"
            "$DEEP33_RECOVERY_GATE_RESULT"
          )
          if [[ "${results[*]}" != "success success success success success success success success success success" ]]; then
            echo "DEEP33_RELEASE_BLOCKED change_scope=$DEEP33_CHANGE_SCOPE_RESULT backend_unit=$DEEP33_BACKEND_UNIT_RESULT realtime_search=$DEEP33_REALTIME_SEARCH_RESULT vercel_realtime_search=$DEEP33_VERCEL_REALTIME_RESULT android_validation=$DEEP33_ANDROID_VALIDATION_RESULT performance_gate=$DEEP33_PERFORMANCE_GATE_RESULT android_feature_instrumentation=$DEEP33_ANDROID_FEATURE_RESULT production=$DEEP33_PRODUCTION_GATE_RESULT android_e2e=$DEEP33_ANDROID_E2E_RESULT recovery=$DEEP33_RECOVERY_GATE_RESULT"
            exit 1
          fi
          echo "DEEP33_RELEASE_PRECONDITIONS_PASS $GITHUB_SHA"
      - name: Mark exact release PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa production-pass "$GITHUB_SHA" -m "DEEP33 certified production release $GITHUB_SHA"
          git push origin refs/tags/production-pass --force
          gh workflow run android-debug-apk.yml --ref production-pass
          gh workflow run android-fast-apk.yml --ref production-pass
          gh workflow run android-package.yml --ref production-pass
          echo "DEEP33_CRITICAL_GATES_PASS $GITHUB_SHA"
          echo "DEEP33_CERTIFIED_APK_DISPATCH_PASS $GITHUB_SHA"
# Full certification trigger
