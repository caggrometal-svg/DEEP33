concurrency:
  group: deep33-ci-${{ github.ref }}
  cancel-in-progress: true

name: DEEP33 CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  PRIMARY_URL: https://guqevsjbjyapqjjtutza.supabase.co/functions/v1/deep33-proxy
  SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  TERTIARY_URL: https://guqevsjbjyapqjjtutza.supabase.co/functions/v1/deep33-tertiary

jobs:
  backend_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Import and syntax gate
        run: |
          python -c "import backend.main, backend.gateway, backend.memory; print('DEEP33_IMPORT_OK')"
          python -m compileall -q backend
      - name: Unit and contract tests
        run: python -m pytest tests -q

  android_validation:
    needs: backend_unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Android lint and build
        run: cd android && gradle :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon

  production_gate:
    if: ${{ github.event_name != 'pull_request' }}
    needs: backend_unit
    runs-on: ubuntu-latest
    steps:
      - name: Verify DEEP33 edge connectivity and search
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/health" | jq -e '.status=="PASS" and .service=="DEEP33 Backend"'
          curl -fsS --connect-timeout 8 --max-time 90 "$PRIMARY_URL/v1/connectivity/audit" | tee /tmp/audit.json
          jq -e '.edge=="PASS" and .internet=="PASS" and .search.ok==true and (.search.results|length)>=1' /tmp/audit.json
          echo "DEEP33_INTERNET_SEARCH_PASS"

      - name: Require independent failover endpoints
        env:
          PRIMARY_URL: ${{ env.PRIMARY_URL }}
          SECONDARY_URL: ${{ env.SECONDARY_URL }}
          TERTIARY_URL: ${{ env.TERTIARY_URL }}
        run: |
          set -euo pipefail
          test -n "$SECONDARY_URL" || { echo "SECONDARY_URL_SECRET_MISSING"; exit 1; }
          test -n "$TERTIARY_URL" || { echo "TERTIARY_URL_SECRET_MISSING"; exit 1; }
          test "$PRIMARY_URL" != "$SECONDARY_URL" || { echo "PRIMARY_SECONDARY_DUPLICATE"; exit 1; }
          test "$PRIMARY_URL" != "$TERTIARY_URL" || { echo "PRIMARY_TERTIARY_DUPLICATE"; exit 1; }
          test "$SECONDARY_URL" != "$TERTIARY_URL" || { echo "SECONDARY_TERTIARY_DUPLICATE"; exit 1; }
          echo "FAILOVER_DIVERSITY_PASS"
      - name: Verify production endpoint diversity
        run: |
          set -euo pipefail
          test -n "$PRIMARY_URL"
          test -n "$SECONDARY_URL"
          test -n "$TERTIARY_URL"
          test "$PRIMARY_URL" != "$SECONDARY_URL"
          test "$PRIMARY_URL" != "$TERTIARY_URL"
          test "$SECONDARY_URL" != "$TERTIARY_URL"
          echo "FAILOVER_ENDPOINT_DIVERSITY_PASS"

      - name: Verify all production nodes readiness
        run: |
          set -euo pipefail
          for entry in \
            "PRIMARY|$PRIMARY_URL" \
            "SECONDARY|$SECONDARY_URL" \
            "TERTIARY|$TERTIARY_URL"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            ok=0
            last_body=""
            for i in $(seq 1 6); do
              last_body="$(curl -sS --connect-timeout 8 --max-time 45 "$url/ready" || true)"
              if printf "%s" "$last_body" | jq -e '.status=="PASS" and .ready==true' >/dev/null 2>&1; then
                echo "${name}_READY_PASS"
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "${name}_READY_FAIL"
              echo "${name}_READY_BODY_BEGIN"
              printf "%s\n" "$last_body"
              echo "${name}_READY_BODY_END"
              diag="$(curl -sS --connect-timeout 8 --max-time 90 "$url/v1/ai/diagnostics" || true)"
              echo "${name}_DIAGNOSTICS_BEGIN"
              printf "%s\n" "$diag"
              echo "${name}_DIAGNOSTICS_END"
              exit 1
            fi
          done

      - name: Verify PRIMARY memory availability
        run: |
          set -euo pipefail
          SESSION="ci-memory-${{ github.run_id }}"
          curl -fsS --connect-timeout 8 --max-time 45 \
            "$PRIMARY_URL/v1/memory/context" \
            -H "X-DEEP33-Session-Id: $SESSION" |
            jq -e 'has("messages") and has("memories")'
          echo "PRIMARY_MEMORY_AVAILABLE_PASS"

      - name: Verify PRIMARY real inference
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 120 "$PRIMARY_URL/v1/ai/diagnostics" >/tmp/diag.json
          python - <<'PY'
          import json
          body=json.load(open("/tmp/diag.json"))
          assert body["online"] is True, body
          assert body["checks"]["MODEL"]=="PASS", body
          assert body["checks"]["CHAT"]=="PASS", body
          print("PRIMARY_INFERENCE_PASS", body["inference"])
          PY


      - name: Verify PRIMARY Hybrid Search + pgvector
        run: |
          set -euo pipefail
          SESSION="ci-hybrid-${{ github.run_id }}"
          STATUS="$(curl -fsS --connect-timeout 8 --max-time 30 "$PRIMARY_URL/v1/search/hybrid/status" -H "X-DEEP33-Session-Id: $SESSION")"
          if ! printf "%s" "$STATUS" | jq -e '.engine=="DEEP33 Hybrid Search" and .engine_version=="1.1.0" and .enabled==true and .configured==true and .dimensions==1536 and .transport=="supabase_edge_function" and .vector_backend=="pgvector" and .keyword_backend=="postgresql_tsvector"' >/dev/null; then
            echo "PRIMARY_HYBRID_STATUS_FAIL"
            printf "%s\n" "$STATUS"
            exit 1
          fi
          echo "PRIMARY_HYBRID_STATUS_PASS"

          EMBEDDING="$(python -c 'import json; print(json.dumps([1.0]+[0.0]*1535))')"
          BODY="$(jq -n --arg q "DEEP33 hybrid verification" --argjson e "$EMBEDDING" '{query:$q,embedding:$e,limit:5,metadata_filter:{}}')"
          SEARCH="$(curl -fsS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/v1/search/hybrid" -H "Content-Type: application/json" -H "X-DEEP33-Session-Id: $SESSION" -d "$BODY")"
          if ! printf "%s" "$SEARCH" | jq -e '.engine=="DEEP33 Hybrid Search" and .engine_version=="1.1.0" and .mode=="hybrid" and (.results|type)=="array"' >/dev/null; then
            echo "PRIMARY_HYBRID_SEARCH_FAIL"
            printf "%s\n" "$SEARCH"
            exit 1
          fi
          echo "PRIMARY_HYBRID_SEARCH_PASS"
      - name: Verify PRIMARY DEEP33 Search Engine
        run: |
          set -euo pipefail
          SESSION="ci-search-${{ github.run_id }}"
          STATUS="$(curl -fsS --connect-timeout 8 --max-time 30 "$PRIMARY_URL/v1/web/status" -H "X-DEEP33-Session-Id: $SESSION")"
          printf "%s" "$STATUS" | jq -e '.engine=="DEEP33 Search Engine" and .engine_version=="1.1.0" and .tool_loop_enabled==true' >/dev/null

          SEARCH="$(curl -fsS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/v1/web/search?q=DEEP33%20internet" -H "X-DEEP33-Session-Id: $SESSION")"
          printf "%s" "$SEARCH" | jq -e '.ok==true and .engine=="DEEP33 Search Engine" and .engine_version=="1.1.0" and .provider_independent==true and (.results|length)>=1 and (.verification.distinct_domains)>=1' >/dev/null

          curl -fsS --connect-timeout 8 --max-time 150 "$PRIMARY_URL/v1/ai/generate" \
            -H "Content-Type: application/json" \
            -H "X-DEEP33-Session-Id: $SESSION" \
            -H "X-Idempotency-Key: ci-search-engine-${{ github.run_id }}" \
            -d '{"messages":[{"role":"user","content":"Investiga en internet DEEP33, consulta fuentes oficiales y fuentes recientes, y distingue la evidencia encontrada."}]}' >/tmp/web-ai.json

          jq -e '.web_navigation==true and (.sources|length)>=1 and .result.sources != null' /tmp/web-ai.json >/dev/null
          echo "PRIMARY_WEB_SEARCH_ENGINE_PASS"

  android_e2e:
    needs: [production_gate, android_validation]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Enable KVM for Android Emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Android real connectivity E2E — attempt 1
        id: android_e2e_attempt_1
        continue-on-error: true
        env:
          DEEP33_PRIMARY_URL: ${{ env.PRIMARY_URL }}
          DEEP33_SECONDARY_URL: ${{ env.SECONDARY_URL }}
          DEEP33_TERTIARY_URL: ${{ env.TERTIARY_URL }}
          DEEP33_REQUIRE_REDUNDANCY: "true"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          working-directory: android
          script: bash deep33-real-connectivity-e2e.sh

      - name: Android real connectivity E2E — attempt 2
        id: android_e2e_attempt_2
        if: ${{ steps.android_e2e_attempt_1.outcome != 'success' }}
        continue-on-error: true
        env:
          DEEP33_PRIMARY_URL: ${{ env.PRIMARY_URL }}
          DEEP33_SECONDARY_URL: ${{ env.SECONDARY_URL }}
          DEEP33_TERTIARY_URL: ${{ env.TERTIARY_URL }}
          DEEP33_REQUIRE_REDUNDANCY: "true"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-retry
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          working-directory: android
          script: bash deep33-real-connectivity-e2e.sh

      - name: Android real connectivity E2E — attempt 3
        id: android_e2e_attempt_3
        if: ${{ steps.android_e2e_attempt_1.outcome != 'success' && steps.android_e2e_attempt_2.outcome != 'success' }}
        continue-on-error: true
        env:
          DEEP33_PRIMARY_URL: ${{ env.PRIMARY_URL }}
          DEEP33_SECONDARY_URL: ${{ env.SECONDARY_URL }}
          DEEP33_TERTIARY_URL: ${{ env.TERTIARY_URL }}
          DEEP33_REQUIRE_REDUNDANCY: "true"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-final
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          working-directory: android
          script: bash deep33-real-connectivity-e2e.sh

      - name: Assert Android E2E success
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ "${{ steps.android_e2e_attempt_1.outcome }}" = "success" ] ||              [ "${{ steps.android_e2e_attempt_2.outcome }}" = "success" ] ||              [ "${{ steps.android_e2e_attempt_3.outcome }}" = "success" ]; then
            echo "ANDROID_E2E_PASS"
            exit 0
          fi
          echo "ANDROID_E2E_FAIL all_attempts_failed"
          exit 1

      - name: Android E2E diagnostics
        if: ${{ always() }}
        run: |
          set +e
          mkdir -p /tmp/deep33-e2e
          echo "=== ADB DEVICES ==="
          adb devices -l || true
          echo "=== SDK ==="
          timeout 10s adb shell getprop ro.build.version.sdk || true
          timeout 10s adb shell getprop ro.build.version.release || true
          echo "=== DNS ==="
          timeout 10s adb shell getprop net.dns1 || true
          timeout 10s adb shell getprop net.dns2 || true
          echo "=== INSTRUMENTATION ==="
          timeout 10s adb shell pm list instrumentation || true
          echo "=== PROCESSES ==="
          timeout 10s adb shell ps -A | grep -Ei 'instrument|deep33|gradle' || true
          echo "=== CRASH BUFFER ==="
          timeout 15s adb logcat -d -b crash -t 1200 > /tmp/deep33-e2e/crash.log || true

      - name: Publish APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ success() }}
        with:
          name: DEEP33-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Android E2E evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: DEEP33-android-e2e-evidence
          path: |
            /tmp/deep33-e2e
            android/app/build/outputs/androidTest-results
            android/app/build/outputs/logs
          if-no-files-found: warn

  recovery_gate:
    needs: android_e2e
    runs-on: ubuntu-latest
    steps:
      - name: Verify all production nodes after Android E2E
        run: |
          set -euo pipefail
          for entry in             "PRIMARY|$PRIMARY_URL"             "SECONDARY|$SECONDARY_URL"             "TERTIARY|$TERTIARY_URL"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            health="$(curl -fsS --connect-timeout 8 --max-time 30 "$url/health")"
            ready="$(curl -fsS --connect-timeout 8 --max-time 45 "$url/ready")"
            printf '%s' "$health" | jq -e '.status=="PASS"' >/dev/null
            printf '%s' "$ready" | jq -e '.status=="PASS" and .ready==true' >/dev/null
            echo "${name}_RECOVERY_PASS"
          done

      - name: Verify PRIMARY edge and inference after recovery
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 90 "$PRIMARY_URL/v1/connectivity/audit" |
            jq -e '.edge=="PASS" and .internet=="PASS" and .search.ok==true'
          curl -fsS --connect-timeout 8 --max-time 120 "$PRIMARY_URL/v1/ai/diagnostics" |
            jq -e '.online==true and .checks.MODEL=="PASS" and .checks.CHAT=="PASS"'
          echo "RECOVERY_INFERENCE_PASS"


  release_gate:
    needs: recovery_gate
    if: ${{ github.event_name == 'push' && success() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Mark exact release PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa production-pass "$GITHUB_SHA" -m "DEEP33 certified production release $GITHUB_SHA"
          git push origin refs/tags/production-pass --force
          echo "DEEP33_CRITICAL_GATES_PASS $GITHUB_SHA"
