concurrency:
  group: deep33-ci-${{ github.run_id }}
  cancel-in-progress: false

name: DEEP33 CI
# CI trigger: validate the latest Android UI fix.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  PRIMARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary
  TERTIARY_URL: https://deep33-backend.onrender.com
  SUPABASE_URL: https://opocgzydeknuchtrqzfa.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA

jobs:
  backend_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Reject legacy upstream dependencies
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=.git "c-33\\.blitz\\.cloud\|caggrometal-svg/.*IAC33\|deep33.c-33" supabase backend android README.md render.yaml Dockerfile 2>/dev/null; then
            echo "LEGACY_UPSTREAM_REFERENCE_FOUND"
            exit 1
          fi
          echo "NO_LEGACY_UPSTREAM_PASS"
      - name: Import and syntax gate
        run: |
          python -c "import backend.main, backend.gateway, backend.memory; print('DEEP33_IMPORT_OK')"
          python -m compileall -q backend
      - name: Unit and contract tests
        run: python -m pytest tests -q


  production_realtime_search:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create authenticated production session
        run: |
          set -euo pipefail
          auth_json="$(curl -fsS --connect-timeout 8 --max-time 30 \
            -X POST "https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-auth" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "content-type: application/json" \
            -d "{\"action\":\"session\",\"memory_profile_id\":\"ci-production-realtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${SECONDS}\"}")"
          token="$(printf '%s' "$auth_json" | jq -r '.access_token // empty')"
          test -n "$token"
          echo "DEEP33_CI_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Verify PRIMARY realtime search
        run: |
          set -euo pipefail
          query="situación actual de la comuna de Las Condes en Chile"
          search_ok=0
          result=""
          for attempt in $(seq 1 6); do
            response="$(curl -sS --connect-timeout 8 --max-time 90 \
              -w '\\nDEEP33_HTTP_STATUS:%{http_code}' \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Authorization: Bearer $DEEP33_CI_TOKEN" \
              --get "$PRIMARY_URL/v1/web/search" \
              --data-urlencode "q=$query" || true)"
            status_code="${response##*DEEP33_HTTP_STATUS:}"
            result="${response%$'\\n'DEEP33_HTTP_STATUS:*}"
            if [ "$status_code" = "200" ] && printf '%s' "$result" | jq -e '.ok == true and .realtime == true and .fresh_request == true and .engine == "DEEP33 Search Engine" and .engine_version == "1.3.0" and (.queries | length) >= 1 and (.providers | length) >= 1 and (.verification.relevant_results // 0) >= 1 and (.retrieved_at | strings | length) > 10' >/dev/null 2>&1; then
              search_ok=1
              printf '%s\\n' "$result"
              echo "PRIMARY_REALTIME_SEARCH_PASS"
              break
            fi
            echo "PRIMARY_REALTIME_SEARCH_NOT_READY attempt=$attempt status=$status_code"
            printf '%s\\n' "$result"
            sleep 5
          done
          test "$search_ok" = "1" || { echo "PRIMARY_REALTIME_SEARCH_FAIL"; exit 1; }
      - name: Wait for TERTIARY web tool readiness
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 18); do
            echo "TERTIARY_WEB_STATUS_ATTEMPT=$attempt"
            body="$(curl -sS --connect-timeout 8 --max-time 30 -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $DEEP33_CI_TOKEN" "$TERTIARY_URL/v1/web/status" || true)"
            printf '%s\n' "$body"
            if printf '%s' "$body" | jq -e '.engine=="DEEP33 Search Engine" and .engine_version=="1.3.0" and .tool_loop_enabled==true' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = "1" || { echo "TERTIARY_WEB_STATUS_FAIL"; exit 1; }
          echo "TERTIARY_WEB_STATUS_PASS"

      - name: Verify TERTIARY realtime search
        run: |
          set -euo pipefail
          query="situación actual de la comuna de Las Condes en Chile"
          session_id="ci-production-realtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          status_code="000"
          result=""
          for attempt in $(seq 1 8); do
            echo "TERTIARY_REALTIME_SEARCH_ATTEMPT=$attempt"
            response="$(curl -sS --connect-timeout 8 --max-time 90 \
              -w '\nDEEP33_HTTP_STATUS:%{http_code}' \
              -H "Authorization: Bearer $DEEP33_CI_TOKEN" \
              -H "X-DEEP33-Session-Id: $session_id" \
              --get "$TERTIARY_URL/v1/web/search" \
              --data-urlencode "q=$query" || true)"
            status_code="${response##*DEEP33_HTTP_STATUS:}"
            result="${response%$'\n'DEEP33_HTTP_STATUS:*}"
            if [ "$status_code" = "200" ] && printf '%s' "$result" | jq -e '.ok == true and .realtime == true and .fresh_request == true and .engine == "DEEP33 Search Engine" and .engine_version == "1.3.0" and (.queries | length) >= 1 and (.providers | length) >= 1 and (.retrieved_at | strings | length) > 10' >/dev/null 2>&1; then
              printf '%s\n' "$result"
              echo "TERTIARY_REALTIME_SEARCH_PASS"
              exit 0
            fi
            echo "TERTIARY_REALTIME_SEARCH_NOT_READY status=$status_code"
            printf '%s\n' "$result"
            sleep 5
          done
          echo "TERTIARY_REALTIME_SEARCH_FAIL status=$status_code"
          exit 1

  android_validation:
    needs: backend_unit
    runs-on: ubuntu-latest
    env:
      DEEP33_PRIMARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
      DEEP33_SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary
      DEEP33_TERTIARY_URL: https://deep33-backend.onrender.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Android lint and build
        run: cd android && gradle :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon

  performance_gate:
    needs: [backend_unit, android_validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: pip install -r backend/requirements.txt
      - name: Performance architecture contract
        run: |
          set -euo pipefail
          python -m pytest tests/test_performance_contract.py tests/test_web_loop.py tests/test_search_engine.py -q
          echo "DEEP33_PERFORMANCE_CONTRACT_PASS"
      - name: Protect transport endpoint contract
        run: |
          set -euo pipefail
          python -m pytest tests/test_connectivity_hardening.py -q
          echo "TRANSPORT_ENDPOINT_CONTRACT_PASS"
      - name: Phase 11 performance trace certification
        run: |
          set -euo pipefail
          python -m pytest tests/test_performance_contract.py -q
          echo "DEEP33_PHASE_11_TRACE_PASS"
      - name: Static performance invariants
        run: |
          set -euo pipefail
          grep -q 'body = stream_gateway(' backend/main.py
          ! grep -q '_sse_text_chunks(result\["text"\])' backend/main.py
          grep -q 'PARALLEL_PROVIDERS' backend/search/engine.py
          grep -q 'SEARCH_CACHE_TTL_SECONDS' tools/web_search.py
          grep -q 'generationStateListeners' android/app/src/main/java/cl/caggrometal/deep33/SessionStore.kt
          grep -q 'lastCheckpointAt' android/app/src/main/java/cl/caggrometal/deep33/Deep33GenerationService.kt
          grep -q 'speakStreamingSentences' android/app/src/main/java/cl/caggrometal/deep33/MainActivity.kt
          echo "DEEP33_PERFORMANCE_INVARIANTS_PASS"

  android_feature_instrumentation:
    needs: backend_unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEEP33_PRIMARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
      DEEP33_SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary
      DEEP33_TERTIARY_URL: https://deep33-backend.onrender.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Enable KVM for Android Emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Run DEEP33 local feature instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-feature-tests
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          disable-spellchecker: true
          channel: stable
          working-directory: android
          script: |
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cl.caggrometal.deep33.Deep33UiContractV2Test,cl.caggrometal.deep33.Deep33FeaturePersistenceTest,cl.caggrometal.deep33.Deep33LifecycleRecoveryTest,cl.caggrometal.deep33.SessionStorePersistenceTest --no-daemon

  change_scope:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.scope.outputs.backend_changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: scope
        run: |
          set -euo pipefail
          baseline="${{ github.event.before }}"
          backend_changed=true
          echo "SCOPE_BASELINE=event-before:$baseline"

          # A missing/invalid push baseline must fail closed to running the gates.
          if [ "${{ github.event_name }}" = "push" ] &&
             [ -n "$baseline" ] &&
             [ "$baseline" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "$baseline^{commit}" 2>/dev/null; then
            if changed="$(git diff --name-only "$baseline" "$GITHUB_SHA")"; then
              backend_changed=false
              if printf "%s\\n" "$changed" | grep -Eq '^(backend/|supabase/|render.yaml$|Dockerfile$|android/app/build.gradle.kts$|android/app/src/main/java/cl/caggrometal/deep33/Deep33Api.kt$|android/deep33-real-connectivity-e2e.sh$|.github/workflows/)'; then
                backend_changed=true
              fi
            else
              echo "SCOPE_DIFF_UNAVAILABLE_FAIL_CLOSED"
              backend_changed=true
            fi
          fi
          echo "backend_changed=$backend_changed" >> "$GITHUB_OUTPUT"


  production_gate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [backend_unit, change_scope]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for backend change detection
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Create authenticated production gate session
        run: |
          set -euo pipefail
          token=""
          for attempt in $(seq 1 3); do
            profile_id="ci-production-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${SECONDS}-${attempt}"
            status="$(curl -sS --connect-timeout 8 --max-time 30 -o "$RUNNER_TEMP/deep33-gate-auth.json" -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/deep33-auth" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "content-type: application/json" -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}" || true)"
            if [ "$status" = "200" ]; then
              token="$(jq -r '.access_token // empty' "$RUNNER_TEMP/deep33-gate-auth.json")"
              break
            fi
            if [ "$status" = "409" ]; then echo "GATE_AUTH_PROFILE_COLLISION attempt=$attempt"; continue; fi
            echo "GATE_AUTH_SESSION_FAILED status=$status"
            jq -c '{error: (.error // "unknown")}' "$RUNNER_TEMP/deep33-gate-auth.json" || true
            exit 1
          done
          test -n "$token" || { echo "GATE_AUTH_SESSION_FAILED retries_exhausted"; exit 1; }
          cat > "$RUNNER_TEMP/deep33-authenticated-curl.sh" <<'BASH'
          curl() {
            local arg has_auth=0
            for arg in "$@"; do
              case "$arg" in Authorization:*|authorization:*) has_auth=1 ;; esac
            done
            if [ "$has_auth" = "1" ]; then
              command curl "$@"
            else
              command curl "$@" -H "Authorization: Bearer ${DEEP33_GATE_TOKEN:?DEEP33_GATE_TOKEN_MISSING}"
            fi
          }
          BASH
          echo "DEEP33_GATE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "BASH_ENV=$RUNNER_TEMP/deep33-authenticated-curl.sh" >> "$GITHUB_ENV"
      - name: Validate PRIMARY deployment when backend changed
        run: |
          set -euo pipefail
          echo "PRODUCTION_SCOPE_BACKEND_CHANGED=${{ needs.change_scope.outputs.backend_changed }}"
          if [ "${{ needs.change_scope.outputs.backend_changed }}" != "true" ]; then
            echo "PRIMARY_DEPLOY_SHA_CHECK_SKIPPED_BACKEND_UNCHANGED"
            exit 0
          fi

          ready=0
          for attempt in $(seq 1 12); do
            echo "PRIMARY_DEPLOY_ATTEMPT=$attempt expected=$GITHUB_SHA"
            body="$(curl -sS --connect-timeout 8 --max-time 30 "$PRIMARY_URL/health" || true)"
            echo "$body"
            if printf "%s" "$body" | jq -e '.status=="PASS" and (.service=="DEEP33 Edge Gateway" or .service=="DEEP33 Backend")' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = "1" || {
            echo "PRIMARY_DEPLOY_SHA_NOT_READY"
            exit 1
          }
          echo "PRIMARY_DEPLOY_SHA_PASS"

      - name: Verify DEEP33 edge connectivity and search
        run: |
          set -euo pipefail
          audit_ok=0
          for attempt in $(seq 1 6); do
            echo "EDGE_AUDIT_ATTEMPT=$attempt"
            if curl -fsS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/health" >/tmp/health.json &&
              jq -e '.status=="PASS" and (.service=="DEEP33 Edge Gateway" or .service=="DEEP33 Backend")' /tmp/health.json >/dev/null &&
              curl -fsS --connect-timeout 8 --max-time 90 "$PRIMARY_URL/v1/connectivity/audit" >/tmp/audit.json &&
              jq -e '.edge=="PASS" and .checks.INTERNET=="PASS" and .checks.DNS=="PASS" and .checks.SEARCH=="PASS" and .search.ok==true and (.search.results|length)>=1' /tmp/audit.json >/dev/null; then
              audit_ok=1
              break
            fi
            echo "EDGE_AUDIT_NOT_READY"
            sleep 10
          done
          if [ "$audit_ok" != "1" ]; then
            echo "DEEP33_INTERNET_SEARCH_FAIL"
            echo "HEALTH_BODY_BEGIN"
            cat /tmp/health.json 2>/dev/null || true
            echo
            echo "HEALTH_BODY_END"
            echo "AUDIT_BODY_BEGIN"
            cat /tmp/audit.json 2>/dev/null || true
            echo
            echo "AUDIT_BODY_END"
            exit 1
          fi
          echo "DEEP33_INTERNET_SEARCH_PASS"

      - name: Require independent failover endpoints
        env:
          PRIMARY_URL: ${{ env.PRIMARY_URL }}
          SECONDARY_URL: ${{ env.SECONDARY_URL }}
          TERTIARY_URL: ${{ env.TERTIARY_URL }}
        run: |
          set -euo pipefail
          if [ -n "$SECONDARY_URL" ] && [ -n "$TERTIARY_URL" ]; then
            test "$PRIMARY_URL" != "$SECONDARY_URL" || { echo "PRIMARY_SECONDARY_DUPLICATE"; exit 1; }
            test "$PRIMARY_URL" != "$TERTIARY_URL" || { echo "PRIMARY_TERTIARY_DUPLICATE"; exit 1; }
            test "$SECONDARY_URL" != "$TERTIARY_URL" || { echo "SECONDARY_TERTIARY_DUPLICATE"; exit 1; }
            echo "FAILOVER_DIVERSITY_PASS"
          else
            echo "FAILOVER_DIVERSITY_SKIPPED_SINGLE_CANONICAL_EDGE"
          fi
      - name: Verify production endpoint diversity
        run: |
          set -euo pipefail
          test -n "$PRIMARY_URL"
          if [ -n "$SECONDARY_URL" ] && [ -n "$TERTIARY_URL" ]; then
            test "$PRIMARY_URL" != "$SECONDARY_URL"
            test "$PRIMARY_URL" != "$TERTIARY_URL"
            test "$SECONDARY_URL" != "$TERTIARY_URL"
            echo "FAILOVER_ENDPOINT_DIVERSITY_PASS"
          else
            echo "FAILOVER_ENDPOINT_DIVERSITY_SKIPPED_SINGLE_CANONICAL_EDGE"
          fi

      - name: Verify all production nodes readiness
        run: |
          set -euo pipefail
          entries=("PRIMARY|$PRIMARY_URL")
          [ -n "$SECONDARY_URL" ] && entries+=("SECONDARY|$SECONDARY_URL")
          [ -n "$TERTIARY_URL" ] && entries+=("TERTIARY|$TERTIARY_URL")
          for entry in "${entries[@]}"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            ok=0
            last_body=""
            for i in $(seq 1 6); do
              last_body="$(curl -sS --connect-timeout 8 --max-time 45 "$url/ready" || true)"
              if printf "%s" "$last_body" | jq -e '.status=="PASS" and .ready==true' >/dev/null 2>&1; then
                echo "${name}_READY_PASS"
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "${name}_READY_FAIL"
              echo "${name}_READY_BODY_BEGIN"
              printf "%s\n" "$last_body"
              echo "${name}_READY_BODY_END"
              diag="$(curl -sS --connect-timeout 8 --max-time 90 "$url/v1/ai/diagnostics" || true)"
              echo "${name}_DIAGNOSTICS_BEGIN"
              printf "%s\n" "$diag"
              echo "${name}_DIAGNOSTICS_END"
              exit 1
            fi
          done

      - name: Verify PRIMARY memory availability
        run: |
          set -euo pipefail
          SESSION="ci-memory-${{ github.run_id }}"
          curl -fsS --connect-timeout 8 --max-time 45 \
            "$PRIMARY_URL/v1/memory/context" \
            -H "X-DEEP33-Session-Id: $SESSION" |
            jq -e 'has("messages") and has("memories")'
          echo "PRIMARY_MEMORY_AVAILABLE_PASS"

      - name: Verify PRIMARY real inference
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 120 "$PRIMARY_URL/v1/ai/diagnostics" >/tmp/diag.json
          python - <<'PY'
          import json
          body=json.load(open("/tmp/diag.json"))
          assert body["online"] is True, body
          assert body["checks"]["MODEL"]=="PASS", body
          assert body["checks"]["CHAT"]=="PASS", body
          print("PRIMARY_INFERENCE_PASS", body["inference"])
          PY


      - name: Verify PRIMARY Hybrid Search + pgvector
        run: |
          set -euo pipefail
          SESSION="ci-hybrid-${{ github.run_id }}"
          STATUS="$(curl -fsS --connect-timeout 8 --max-time 30 "$PRIMARY_URL/v1/search/hybrid/status" -H "X-DEEP33-Session-Id: $SESSION")"
          if ! printf "%s" "$STATUS" | jq -e '.engine=="DEEP33 Hybrid Search" and .engine_version=="1.3.0" and .enabled==true and .configured==true and .dimensions==1536 and .transport=="supabase_edge_function" and .vector_backend=="pgvector" and .keyword_backend=="postgresql_tsvector"' >/dev/null; then
            echo "PRIMARY_HYBRID_STATUS_FAIL"
            printf "%s\n" "$STATUS"
            exit 1
          fi
          echo "PRIMARY_HYBRID_STATUS_PASS"

          EDGE_STATUS="$(curl -fsS --connect-timeout 8 --max-time 30 "$PRIMARY_URL/v1/ai/edge-status")"
          echo "PRIMARY_EDGE_AI_STATUS=$EDGE_STATUS"

          EMBEDDING="$(python -c 'import json; print(json.dumps([1.0]+[0.0]*1535))')"
          BODY="$(jq -n --arg q "DEEP33 hybrid verification" --argjson e "$EMBEDDING" '{query:$q,embedding:$e,limit:5,metadata_filter:{}}')"
          hybrid_ok=0
          last_search=""
          for attempt in $(seq 1 3); do
            echo "PRIMARY_HYBRID_SEARCH_ATTEMPT=$attempt"
            last_search="$(curl -sS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/v1/search/hybrid" -H "Content-Type: application/json" -H "X-DEEP33-Session-Id: $SESSION" -d "$BODY" || true)"
            if printf "%s" "$last_search" | jq -e '.engine=="DEEP33 Hybrid Search" and .engine_version=="1.3.0" and .mode=="hybrid" and (.results|type)=="array"' >/dev/null 2>&1; then
              hybrid_ok=1
              break
            fi
            echo "PRIMARY_HYBRID_SEARCH_NOT_READY"
            printf "%s\n" "$last_search"
            sleep 5
          done
          if [ "$hybrid_ok" != "1" ]; then
            echo "PRIMARY_HYBRID_SEARCH_FAIL"
            printf "%s\n" "$last_search"
            exit 1
          fi
          echo "PRIMARY_HYBRID_SEARCH_PASS"
      - name: Verify PRIMARY DEEP33 Search Engine
        run: |
          set -euo pipefail
          SESSION="${{ github.run_id }}"
          status_ok=0
          for attempt in $(seq 1 3); do
            STATUS="$(curl -sS --connect-timeout 8 --max-time 30 "$PRIMARY_URL/v1/web/status" -H "X-DEEP33-Session-Id: $SESSION" || true)"
            if printf "%s" "$STATUS" | jq -e '.engine=="DEEP33 Search Engine" and .engine_version=="1.3.0" and .tool_loop_enabled==true' >/dev/null 2>&1; then
              status_ok=1
              break
            fi
            echo "PRIMARY_WEB_STATUS_NOT_READY attempt=$attempt"
            printf "%s\n" "$STATUS"
            sleep 5
          done
          test "$status_ok" = "1"

          search_ok=0
          for attempt in $(seq 1 3); do
            SEARCH="$(curl -sS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/v1/web/search?q=Noticias%20mundiales" -H "X-DEEP33-Session-Id: $SESSION" || true)"
            if printf "%s" "$SEARCH" | jq -e '.ok==true and .engine=="DEEP33 Search Engine" and .engine_version=="1.3.0" and .realtime==true and .depth=="realtime" and (.results|length)>=1 and (.verification.distinct_domains)>=1' >/dev/null 2>&1; then
              search_ok=1
              break
            fi
            echo "PRIMARY_WEB_SEARCH_NOT_READY query=Noticias-mundiales attempt=$attempt"
            printf "%s\n" "$SEARCH"
            sleep 5
          done
          test "$search_ok" = "1"

          direct_ok=0
          for attempt in $(seq 1 3); do
            DIRECT_STATUS="$(curl -sS --connect-timeout 8 --max-time 120 -o /tmp/direct-ai.json -w "%{http_code}" "$PRIMARY_URL/v1/ai/generate" \
              -H "Content-Type: application/json" \
              -H "X-DEEP33-Session-Id: $SESSION-direct-$attempt" \
              -H "X-Idempotency-Key: ci-direct-generation-${{ github.run_id }}-$attempt" \
              -H "X-DEEP33-Skip-Web-Tools: true" \
              -d '{"messages":[{"role":"user","content":"Responde solo: OK"}]}')"
            echo "PRIMARY_DIRECT_GENERATION_HTTP=$DIRECT_STATUS attempt=$attempt"
            if [ "$DIRECT_STATUS" = "200" ]; then
              direct_ok=1
              break
            fi
            cat /tmp/direct-ai.json || true
            sleep 5
          done
          if [ "$direct_ok" != "1" ]; then
            echo "PRIMARY_DIRECT_GENERATION_FAIL_BODY_BEGIN"
            cat /tmp/direct-ai.json || true
            echo
            echo "PRIMARY_DIRECT_GENERATION_FAIL_BODY_END"
            exit 1
          fi
          echo "PRIMARY_DIRECT_GENERATION_PASS"

          web_ok=0
          for attempt in $(seq 1 3); do
            WEB_STATUS="$(curl -sS --connect-timeout 8 --max-time 120 -o /tmp/web-ai.json -w "%{http_code}" "$PRIMARY_URL/v1/ai/generate" \
              -H "Content-Type: application/json" \
              -H "X-DEEP33-Session-Id: $SESSION-web-$attempt" \
              -H "X-Idempotency-Key: ci-web-generation-${{ github.run_id }}-$attempt" \
              -d '{"messages":[{"role":"user","content":"Busca en internet la fecha actual en Chile y responde solo: OK"}]}')"
            echo "PRIMARY_WEB_GENERATION_HTTP=$WEB_STATUS attempt=$attempt"
            if [ "$WEB_STATUS" = "200" ]; then
              web_ok=1
              break
            fi
            cat /tmp/web-ai.json || true
            sleep 5
          done
          if [ "$web_ok" != "1" ]; then
            echo "PRIMARY_WEB_GENERATION_FAIL_BODY_BEGIN"
            cat /tmp/web-ai.json || true
            echo
            echo "PRIMARY_WEB_GENERATION_FAIL_BODY_END"
            exit 1
          fi
          echo "PRIMARY_WEB_SEARCH_ENGINE_PASS"

  android_e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [production_gate, android_validation, change_scope]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Enable KVM for Android Emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Android real connectivity E2E — attempt 1
        id: android_e2e_attempt_1
        continue-on-error: true
        env:
          DEEP33_PRIMARY_URL: ${{ env.PRIMARY_URL }}
          DEEP33_SECONDARY_URL: ${{ env.SECONDARY_URL }}
          DEEP33_TERTIARY_URL: ${{ env.TERTIARY_URL }}
          DEEP33_REQUIRE_REDUNDANCY: "false"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 1.1.1.1,8.8.8.8
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          working-directory: android
          script: bash deep33-real-connectivity-e2e.sh

      - name: Android real connectivity E2E — attempt 2
        id: android_e2e_attempt_2
        if: ${{ steps.android_e2e_attempt_1.outcome != 'success' }}
        continue-on-error: true
        env:
          DEEP33_PRIMARY_URL: ${{ env.PRIMARY_URL }}
          DEEP33_SECONDARY_URL: ${{ env.SECONDARY_URL }}
          DEEP33_TERTIARY_URL: ${{ env.TERTIARY_URL }}
          DEEP33_REQUIRE_REDUNDANCY: "true"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-retry
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 1.1.1.1,8.8.8.8
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          working-directory: android
          script: bash deep33-real-connectivity-e2e.sh

      - name: Android real connectivity E2E — attempt 3
        id: android_e2e_attempt_3
        if: ${{ steps.android_e2e_attempt_1.outcome != 'success' && steps.android_e2e_attempt_2.outcome != 'success' }}
        continue-on-error: true
        env:
          DEEP33_PRIMARY_URL: ${{ env.PRIMARY_URL }}
          DEEP33_SECONDARY_URL: ${{ env.SECONDARY_URL }}
          DEEP33_TERTIARY_URL: ${{ env.TERTIARY_URL }}
          DEEP33_REQUIRE_REDUNDANCY: "true"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-final
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 1.1.1.1,8.8.8.8
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          working-directory: android
          script: bash deep33-real-connectivity-e2e.sh

      - name: Assert Android E2E success
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ "${{ steps.android_e2e_attempt_1.outcome }}" = "success" ] ||              [ "${{ steps.android_e2e_attempt_2.outcome }}" = "success" ] ||              [ "${{ steps.android_e2e_attempt_3.outcome }}" = "success" ]; then
            echo "ANDROID_E2E_PASS"
            exit 0
          fi
          echo "ANDROID_E2E_FAIL all_attempts_failed"
          exit 1

      - name: Android E2E diagnostics
        if: ${{ always() }}
        run: |
          set +e
          mkdir -p /tmp/deep33-e2e
          echo "=== ADB DEVICES ==="
          adb devices -l || true
          echo "=== SDK ==="
          timeout 10s adb shell getprop ro.build.version.sdk || true
          timeout 10s adb shell getprop ro.build.version.release || true
          echo "=== DNS ==="
          timeout 10s adb shell getprop net.dns1 || true
          timeout 10s adb shell getprop net.dns2 || true
          echo "=== INSTRUMENTATION ==="
          timeout 10s adb shell pm list instrumentation || true
          echo "=== PROCESSES ==="
          timeout 10s adb shell ps -A | grep -Ei 'instrument|deep33|gradle' || true
          echo "=== CRASH BUFFER ==="
          timeout 15s adb logcat -d -b crash -t 1200 > /tmp/deep33-e2e/crash.log || true

      - name: Publish APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ success() }}
        with:
          name: DEEP33-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Android E2E evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: DEEP33-android-e2e-evidence
          path: |
            /tmp/deep33-e2e
            android/app/build/outputs/androidTest-results
            android/app/build/outputs/logs
          if-no-files-found: warn

  recovery_gate:
    needs: android_e2e
    runs-on: ubuntu-latest
    steps:

      - name: Create authenticated recovery gate session
        run: |
          set -euo pipefail
          token=""
          for attempt in $(seq 1 3); do
            profile_id="ci-recovery-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${SECONDS}-${attempt}"
            status="$(curl -sS --connect-timeout 8 --max-time 30 -o "$RUNNER_TEMP/deep33-gate-auth.json" -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/deep33-auth" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "content-type: application/json" -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}" || true)"
            if [ "$status" = "200" ]; then
              token="$(jq -r '.access_token // empty' "$RUNNER_TEMP/deep33-gate-auth.json")"
              break
            fi
            if [ "$status" = "409" ]; then echo "GATE_AUTH_PROFILE_COLLISION attempt=$attempt"; continue; fi
            echo "GATE_AUTH_SESSION_FAILED status=$status"
            jq -c '{error: (.error // "unknown")}' "$RUNNER_TEMP/deep33-gate-auth.json" || true
            exit 1
          done
          test -n "$token" || { echo "GATE_AUTH_SESSION_FAILED retries_exhausted"; exit 1; }
          cat > "$RUNNER_TEMP/deep33-authenticated-curl.sh" <<'BASH'
          curl() {
            local arg has_auth=0
            for arg in "$@"; do
              case "$arg" in Authorization:*|authorization:*) has_auth=1 ;; esac
            done
            if [ "$has_auth" = "1" ]; then
              command curl "$@"
            else
              command curl "$@" -H "Authorization: Bearer ${DEEP33_GATE_TOKEN:?DEEP33_GATE_TOKEN_MISSING}"
            fi
          }
          BASH
          echo "DEEP33_GATE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "BASH_ENV=$RUNNER_TEMP/deep33-authenticated-curl.sh" >> "$GITHUB_ENV"
      - name: Verify all production nodes after Android E2E
        run: |
          set -euo pipefail
          entries=("PRIMARY|$PRIMARY_URL")
          [ -n "$SECONDARY_URL" ] && entries+=("SECONDARY|$SECONDARY_URL")
          [ -n "$TERTIARY_URL" ] && entries+=("TERTIARY|$TERTIARY_URL")
          for entry in "${entries[@]}"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            health="$(curl -fsS --connect-timeout 8 --max-time 30 "$url/health")"
            ready="$(curl -fsS --connect-timeout 8 --max-time 45 "$url/ready")"
            printf '%s' "$health" | jq -e '.status=="PASS"' >/dev/null
            printf '%s' "$ready" | jq -e '.status=="PASS" and .ready==true' >/dev/null
            echo "${name}_RECOVERY_PASS"
          done

      - name: Verify PRIMARY edge and inference after recovery
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 90 "$PRIMARY_URL/v1/connectivity/audit" |
            jq -e '.edge=="PASS" and .checks.INTERNET=="PASS" and .checks.DNS=="PASS" and .checks.SEARCH=="PASS" and .search.ok==true'
          curl -fsS --connect-timeout 8 --max-time 120 "$PRIMARY_URL/v1/ai/diagnostics" |
            jq -e '.online==true and .checks.MODEL=="PASS" and .checks.CHAT=="PASS"'
          echo "RECOVERY_INFERENCE_PASS"


  release_gate:
    needs: recovery_gate
    if: ${{ github.event_name == 'push' && success() }}
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Mark exact release PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa production-pass "$GITHUB_SHA" -m "DEEP33 certified production release $GITHUB_SHA"
          git push origin refs/tags/production-pass --force
          gh workflow run android-debug-apk.yml --ref production-pass
          gh workflow run android-fast-apk.yml --ref production-pass
          gh workflow run android-package.yml --ref production-pass
          echo "DEEP33_CRITICAL_GATES_PASS $GITHUB_SHA"
          echo "DEEP33_CERTIFIED_APK_DISPATCH_PASS $GITHUB_SHA"
# Full certification trigger
