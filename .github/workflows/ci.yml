name: DEEP33 CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q backend

      - name: Real Render to model E2E
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[fallback-test]')
        env:
          DEEP33_URL: https://deep33-backend.onrender.com
        run: |
          set -euo pipefail

          echo "Waiting for Render to serve DEEP33 0.1.3..."
          for i in $(seq 1 18); do
            if curl -fsS --max-time 15 "$DEEP33_URL/health" | jq -e '.status == "PASS" and .version == "0.1.3"' >/dev/null; then
              break
            fi
            sleep 10
          done

          curl -fsS --max-time 30 "$DEEP33_URL/health" | tee /tmp/health.json
          curl -fsS --max-time 30 "$DEEP33_URL/v1/network/status" | tee /tmp/network.json
          curl -fsS --max-time 30 "$DEEP33_URL/v1/ai/status" | tee /tmp/ai.json
          curl -fsS --max-time 45 "$DEEP33_URL/v1/ai/diagnostics" | tee /tmp/diag.json

          jq -e '.status == "PASS" and .version == "0.1.3"' /tmp/health.json
          jq -e '.internet_available == true and .dns_ok == true and .https_ok == true' /tmp/network.json
          jq -e '.gateway == "PASS"' /tmp/ai.json
          jq -e '.online == true and .checks.NETWORK == "PASS" and .checks.AI_GATEWAY == "PASS" and .checks.MODEL == "PASS"' /tmp/diag.json

          SESSION_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for n in 1 2 3; do
            echo "Chat generation sample $n/3"
            ok=false
            for attempt in 1 2 3; do
              echo "  provider attempt $attempt/3"
              if curl -fsS --max-time 90                 -H "X-DEEP33-Session-Id: $SESSION_ID"                 -H 'content-type: application/json'                 -d '{"messages":[{"role":"user","content":"Return only this exact token: DEEP33_E2E_OK"}]}'                 "$DEEP33_URL/v1/ai/generate" | tee "/tmp/chat-$n.json"                 && jq -e '((.response.choices[0].message.content // "") | contains("DEEP33_E2E_OK"))' "/tmp/chat-$n.json"; then
                ok=true
                break
              fi
              sleep 3
            done
            test "$ok" = true
          done

          curl -fsS --max-time 30 -H "X-DEEP33-Session-Id: $SESSION_ID" "$DEEP33_URL/v1/memory/context" | tee /tmp/memory-before.json
          jq -e '.messages | length >= 2 and any(.[]; (.content // "") | contains("DEEP33_E2E_OK"))' /tmp/memory-before.json

          curl -fsS --max-time 30             -X POST             -H "X-DEEP33-Session-Id: $SESSION_ID"             -H 'content-type: application/json'             -d '{"kind":"explicit","content":"DEEP33_EXPLICIT_MEMORY_E2E_OK"}'             "$DEEP33_URL/v1/memory/remember" | tee /tmp/memory-remember.json
          jq -e '.remembered == true or .ok == true' /tmp/memory-remember.json

          curl -fsS --max-time 30 -H "X-DEEP33-Session-Id: $SESSION_ID" "$DEEP33_URL/v1/memory/context" | tee /tmp/memory-after.json
          jq -e '.memories | any(.[]; (.content // "") | contains("DEEP33_EXPLICIT_MEMORY_E2E_OK"))' /tmp/memory-after.json

  android:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android build
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEEP33-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android real connectivity E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: false
          disable-linux-hw-accel: auto
          enable-hw-keyboard: false
          channel: stable
          script: cd android && gradle :app:connectedDebugAndroidTest --no-daemon
