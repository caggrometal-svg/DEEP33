concurrency:
  group: deep33-ci-${{ github.ref }}
  cancel-in-progress: true

name: DEEP33 CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  PRIMARY_URL: https://deep33-backend.onrender.com
  SECONDARY_URL: https://deep33-backup.onrender.com
  TERTIARY_URL: https://deep33-api.onrender.com

jobs:
  backend_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Import and syntax gate
        run: |
          python -c "import backend.main, backend.gateway, backend.memory; print('DEEP33_IMPORT_OK')"
          python -m compileall -q backend
      - name: Unit and contract tests
        run: python -m pytest tests -q

  android_validation:
    needs: backend_unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Android lint and build
        run: cd android && gradle :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest --no-daemon

  production_gate:
    if: ${{ github.event_name != 'pull_request' }}
    needs: backend_unit
    runs-on: ubuntu-latest
    steps:
      - name: Verify production DNS and exact Git SHAs
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          verify_node() {
            name="$1"
            url="$2"
            for i in $(seq 1 36); do
              body="$(curl -fsS --connect-timeout 8 --max-time 20 "$url/health" || true)"
              sha="$(python -c 'import json,sys; print(json.load(sys.stdin).get("git_sha",""))' <<< "$body" 2>/dev/null || true)"
              if [ "$sha" = "$EXPECTED_SHA" ]; then
                echo "${name}_SHA_PASS $sha"
                return 0
              fi
              sleep 5
            done
            echo "${name}_SHA_FAIL expected=$EXPECTED_SHA"
            exit 1
          }

          for target in "$PRIMARY_URL" "$SECONDARY_URL" "$TERTIARY_URL"; do
            host="$(printf '%s' "$target" | sed 's#https://##;s#/.*##')"
            echo "DNS_CHECK $host"
            getent ahosts "$host"
          done

          verify_node PRIMARY "$PRIMARY_URL"
          verify_node SECONDARY "$SECONDARY_URL"
          verify_node TERTIARY "$TERTIARY_URL"

      - name: Verify all production nodes readiness
        run: |
          set -euo pipefail
          for entry in             "PRIMARY|$PRIMARY_URL"             "SECONDARY|$SECONDARY_URL"             "TERTIARY|$TERTIARY_URL"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            ok=0
            for i in $(seq 1 6); do
              body="$(curl -fsS --connect-timeout 8 --max-time 30 "$url/ready" || true)"
              if printf '%s' "$body" | jq -e '.status=="PASS" and .ready==true' >/dev/null 2>&1; then
                echo "${name}_READY_PASS"
                ok=1
                break
              fi
              sleep 5
            done
            test "$ok" = 1
          done

      - name: Verify PRIMARY real inference
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 120 "$PRIMARY_URL/v1/ai/diagnostics" >/tmp/diag.json
          python - <<'PY'
          import json
          body=json.load(open("/tmp/diag.json"))
          assert body["online"] is True, body
          assert body["checks"]["MODEL"]=="PASS", body
          assert body["checks"]["CHAT"]=="PASS", body
          print("PRIMARY_INFERENCE_PASS", body["inference"])
          PY

  android_e2e:
    needs: [production_gate, android_validation]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Enable KVM for Android Emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Android real connectivity E2E
        env:
          DEEP33_PRIMARY_URL: https://deep33-backend.onrender.com
          DEEP33_SECONDARY_URL: https://deep33-backup.onrender.com
          DEEP33_TERTIARY_URL: https://deep33-api.onrender.com
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          script: |
            set -euo pipefail
            cd android

            echo "=== EMULATOR DNS ==="
            adb shell getprop net.dns1 || true
            adb shell getprop net.dns2 || true

            echo "=== HOST DNS PREFLIGHT ==="
            for host in deep33-backend.onrender.com deep33-backup.onrender.com deep33-api.onrender.com; do
              getent ahosts "$host"
            done

            gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest.apk' | head -n 1)"
            test -n "$TEST_APK"
            adb install -r "$TEST_APK"
            mkdir -p /tmp/deep33-e2e
            set +e
            timeout --foreground 15m adb shell am instrument -w -r cl.caggrometal.deep33.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/deep33-e2e/instrumentation.log
            instrument_status=${PIPESTATUS[0]}
            set -e
            cp -R app/build/outputs/androidTest-results /tmp/deep33-e2e/connected-results 2>/dev/null || true
            exit "$instrument_status"

      - name: Android E2E diagnostics
        if: ${{ always() }}
        run: |
          set +e
          echo "=== ADB DEVICES ==="
          adb devices -l || true
          echo "=== SDK ==="
          timeout 10s adb shell getprop ro.build.version.sdk || true
          timeout 10s adb shell getprop ro.build.version.release || true
          echo "=== DNS ==="
          timeout 10s adb shell getprop net.dns1 || true
          timeout 10s adb shell getprop net.dns2 || true
          echo "=== INSTRUMENTATION ==="
          timeout 10s adb shell pm list instrumentation || true
          echo "=== PROCESSES ==="
          timeout 10s adb shell ps -A | grep -Ei 'instrument|deep33|gradle' || true
          echo "=== CRASH BUFFER ==="
          timeout 15s adb logcat -d -b crash -t 1200 > /tmp/deep33-e2e/crash.log || true

      - name: Publish APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ success() }}
        with:
          name: DEEP33-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Android E2E evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: DEEP33-android-e2e-evidence
          path: |
            /tmp/deep33-e2e
            android/app/build/outputs/androidTest-results
            android/app/build/outputs/logs
          if-no-files-found: warn

  recovery_gate:
    needs: android_e2e
    runs-on: ubuntu-latest
    steps:
      - name: Verify all production nodes after Android E2E
        run: |
          set -euo pipefail
          for entry in             "PRIMARY|$PRIMARY_URL"             "SECONDARY|$SECONDARY_URL"             "TERTIARY|$TERTIARY_URL"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            health="$(curl -fsS --connect-timeout 8 --max-time 30 "$url/health")"
            ready="$(curl -fsS --connect-timeout 8 --max-time 45 "$url/ready")"
            printf '%s' "$health" | jq -e '.status=="PASS"' >/dev/null
            printf '%s' "$ready" | jq -e '.status=="PASS" and .ready==true' >/dev/null
            echo "${name}_RECOVERY_PASS"
          done

      - name: Verify PRIMARY inference after recovery
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 120 "$PRIMARY_URL/v1/ai/diagnostics" >/tmp/recovery-diag.json
          jq -e '.online==true and .checks.MODEL=="PASS" and .checks.CHAT=="PASS"' /tmp/recovery-diag.json

  rollback_on_failure:
    needs: [backend_unit, production_gate, android_validation, android_e2e, recovery_gate]
    if: ${{ always() && github.event_name == 'push' && (needs.backend_unit.result == 'failure' || needs.production_gate.result == 'failure' || needs.android_validation.result == 'failure' || needs.android_e2e.result == 'failure' || needs.recovery_gate.result == 'failure') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Roll back main only to certified production-pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "ROLLBACK_SKIPPED_CONCURRENT_COMMIT current=$current failed=$GITHUB_SHA"
            exit 0
          fi

          git fetch origin refs/tags/production-pass --force >/dev/null 2>&1 || true
          pass="$(git rev-parse refs/tags/production-pass^{commit} 2>/dev/null || true)"
          if ! printf '%s' "$pass" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ROLLBACK_UNAVAILABLE no_certified_production_pass"
            exit 0
          fi

          test "$pass" != "$GITHUB_SHA"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f "sha=$pass" -F "force=true"
          echo "ROLLBACK_PASS target=$pass"

  release_gate:
    needs: recovery_gate
    if: ${{ github.event_name == 'push' && success() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Mark exact release PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa production-pass "$GITHUB_SHA" -m "DEEP33 certified production release $GITHUB_SHA"
          git push origin refs/tags/production-pass --force
          echo "DEEP33_CRITICAL_GATES_PASS $GITHUB_SHA"
