name: DEEP33 Real Performance Benchmark

on:
  push:
    branches:
      - benchmark/current-speed-2026-10-03

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEP33_PRIMARY_URL: https://deep33-backend.onrender.com
      SAMPLE_COUNT: "30"
      WARMUP_COUNT: "3"
      INTER_REQUEST_DELAY: "1.1"
    steps:
      - name: Run real streaming benchmark
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          python3 <<'PY'
          import json, os, statistics, time, uuid
          import urllib.request, urllib.error

          BASE = os.environ["DEEP33_PRIMARY_URL"].rstrip("/")
          N = int(os.environ["SAMPLE_COUNT"])
          W = int(os.environ["WARMUP_COUNT"])
          DELAY = float(os.environ["INTER_REQUEST_DELAY"])

          scenarios = [
              ("FAST", "2x2?"),
              ("BALANCED", "Explícame brevemente qué es una API."),
              ("WEB", "Busca en internet la hora actual en Santiago de Chile y responde en una frase."),
              ("DEEP", "Explica en profundidad cómo el streaming reduce la latencia percibida en una aplicación de IA, en pocas secciones."),
          ]

          def get_json(path):
              req = urllib.request.Request(BASE + path, method="GET")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          def percentile(values, p):
              if not values:
                  return None
              xs = sorted(values)
              k = (len(xs) - 1) * p / 100
              lo = int(k)
              hi = min(lo + 1, len(xs) - 1)
              if lo == hi:
                  return round(xs[lo], 2)
              return round(xs[lo] + (xs[hi] - xs[lo]) * (k - lo), 2)

          def one(label, prompt, warmup=False):
              rid = f"bench-{label.lower()}-{uuid.uuid4()}"
              sid = f"bench-session-{uuid.uuid4()}"
              key = f"bench-key-{uuid.uuid4()}"
              body = json.dumps({
                  "messages": [{"role": "user", "content": prompt}],
                  "personality": "NEUTRO",
              }).encode("utf-8")
              req = urllib.request.Request(
                  BASE + "/v1/chat/stream",
                  data=body,
                  method="POST",
                  headers={
                      "Accept": "text/event-stream",
                      "Content-Type": "application/json",
                      "X-DEEP33-Session-Id": sid,
                      "X-Request-ID": rid,
                      "X-Idempotency-Key": key,
                      "X-DEEP33-Personality": "NEUTRO",
                      "Cache-Control": "no-cache",
                  },
              )
              t0 = time.perf_counter()
              first_content_ms = None
              first_byte_ms = None
              done = False
              status = None
              error = None
              total_ms = None
              chars = 0
              try:
                  with urllib.request.urlopen(req, timeout=150) as r:
                      status = r.status
                      first_byte_ms = (time.perf_counter() - t0) * 1000
                      for raw in r:
                          line = raw.decode("utf-8", errors="replace").strip()
                          if not line.startswith("data:"):
                              continue
                          data = line[5:].strip()
                          if data == "[DONE]":
                              done = True
                              break
                          try:
                              obj = json.loads(data)
                          except Exception:
                              continue
                          for choice in obj.get("choices", []):
                              delta = choice.get("delta") or {}
                              content = delta.get("content")
                              if isinstance(content, str) and content:
                                  chars += len(content)
                                  if first_content_ms is None:
                                      first_content_ms = (time.perf_counter() - t0) * 1000
                  total_ms = (time.perf_counter() - t0) * 1000
              except Exception as exc:
                  total_ms = (time.perf_counter() - t0) * 1000
                  error = repr(exc)

              return {
                  "scenario": label,
                  "warmup": warmup,
                  "request_id": rid,
                  "status": status,
                  "first_byte_ms": round(first_byte_ms, 2) if first_byte_ms is not None else None,
                  "ttft_ms": round(first_content_ms, 2) if first_content_ms is not None else None,
                  "total_ms": round(total_ms, 2) if total_ms is not None else None,
                  "chars": chars,
                  "done": done,
                  "error": error,
              }

          before = None
          try:
              before = get_json("/metrics")
          except Exception as exc:
              before = {"error": repr(exc)}

          rows = []
          for label, prompt in scenarios:
              for i in range(W):
                  rows.append(one(label, prompt, warmup=True))
                  time.sleep(DELAY)
              for i in range(N):
                  rows.append(one(label, prompt, warmup=False))
                  time.sleep(DELAY)

          after = None
          try:
              after = get_json("/metrics")
          except Exception as exc:
              after = {"error": repr(exc)}

          summary = {}
          for label, _ in scenarios:
              data = [r for r in rows if r["scenario"] == label and not r["warmup"]]
              ok = [r for r in data if r["status"] == 200 and r["done"] and r["ttft_ms"] is not None]
              summary[label] = {
                  "samples": len(data),
                  "successful": len(ok),
                  "failed": len(data) - len(ok),
                  "failure_rate_pct": round((len(data)-len(ok))*100/len(data), 2) if data else None,
                  "ttft_ms": {
                      "p50": percentile([r["ttft_ms"] for r in ok], 50),
                      "p95": percentile([r["ttft_ms"] for r in ok], 95),
                  },
                  "total_ms": {
                      "p50": percentile([r["total_ms"] for r in ok], 50),
                      "p95": percentile([r["total_ms"] for r in ok], 95),
                  },
                  "first_byte_ms": {
                      "p50": percentile([r["first_byte_ms"] for r in ok], 50),
                      "p95": percentile([r["first_byte_ms"] for r in ok], 95),
                  },
              }

          result = {
              "benchmark": {
                  "base_url": BASE,
                  "sample_count": N,
                  "warmup_count": W,
                  "inter_request_delay_s": DELAY,
                  "generated_at_epoch": time.time(),
              },
              "summary": summary,
              "samples": rows,
              "metrics_before": before,
              "metrics_after": after,
          }

          with open("benchmark-results/current-baseline.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(json.dumps(summary, ensure_ascii=False, indent=2))

          if any(v["successful"] < N * 0.8 for v in summary.values()):
              raise SystemExit("BENCHMARK_INSUFFICIENT_SUCCESS_RATE")
          PY

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: DEEP33-current-speed-baseline
          path: benchmark-results/current-baseline.json
          if-no-files-found: error

      - name: Print certification marker
        run: |
          echo "DEEP33_REAL_SPEED_BENCHMARK_COMPLETE"
