name: DEEP33 Global Gate

on:
  push:
    branches:
      - main
      - fix/deep33-test-global-101026-resilience-v2
      - fix/deep33-ttft-under-3s
      - fix/deep33-global-101026-final-gates
      - fix/deep33-global-101026-live-search
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_live:
        description: Require live Render/Android SSE validation
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  production_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      DEEP33_BASE_URL: ${{ secrets.DEEP33_BASE_URL }}
      DEEP33_TEST_AUTH_TOKEN: ${{ secrets.DEEP33_TEST_AUTH_TOKEN }}
      DEEP33_TEST_SESSION_ID: deep33-global-gate
      SUPABASE_URL: https://opocgzydeknuchtrqzfa.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA
      DEEP33_REQUIRE_LIVE_GATE: ${{ github.ref == 'refs/heads/main' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.require_live == 'true' && 'true' || 'false') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Enable canonical live production target
        if: env.DEEP33_REQUIRE_LIVE_GATE == 'true' && env.DEEP33_BASE_URL == ''
        run: echo "DEEP33_BASE_URL=https://deep33-backend.onrender.com" >> "$GITHUB_ENV"

      - name: Prepare authenticated live production session
        if: env.DEEP33_REQUIRE_LIVE_GATE == 'true' && env.DEEP33_TEST_AUTH_TOKEN == ''
        run: |
          set -euo pipefail
          token=""
          for attempt in 1 2 3; do
            profile_id="global-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${attempt}"
            status="$(curl -sS --connect-timeout 8 --max-time 30               -o /tmp/deep33-global-auth.json -w "%{http_code}"               -X POST "$SUPABASE_URL/functions/v1/deep33-auth"               -H "apikey: $SUPABASE_PUBLISHABLE_KEY"               -H "content-type: application/json"               -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}" || true)"
            if [ "$status" = "200" ]; then
              token="$(jq -r '.access_token // empty' /tmp/deep33-global-auth.json)"
              [ -n "$token" ] && break
            fi
            echo "GLOBAL_GATE_AUTH_RETRY attempt=$attempt http=$status"
            [ "$attempt" -lt 3 ] && sleep 2
          done
          test -n "$token"
          echo "::add-mask::$token"
          echo "DEEP33_TEST_AUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Compile changed Python
        run: |
          python -m py_compile             backend/search/resilient.py             backend/search/web_pipeline.py             tools/web_search.py             tools/web_fetch.py             backend/main.py             backend/gateway.py             test_deep33_global_gate.py

      - name: DEEP33-TEST-GLOBAL-101026
        run: python test_deep33_global_gate.py

      - name: Enforce live production evidence on main
        if: github.ref == 'refs/heads/main'
        run: |
          test -n "$DEEP33_BASE_URL"
          test "$DEEP33_REQUIRE_LIVE_GATE" = "true"
          test -n "$DEEP33_TEST_AUTH_TOKEN"

      - name: Existing search and performance regression tests
        run: |
          python -m pytest -q             tests/test_performance_contract.py             tests/test_hybrid_search.py             tests/test_connectivity_hardening.py             tests/test_ttft_fast_path.py
