name: DEEP33 Doctor Full Validation

on:
  push:
    branches:
      - doctor/deep33-architecture-speed-multiuser-20261008
  workflow_dispatch:

concurrency:
  group: deep33-doctor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_URL: https://opocgzydeknuchtrqzfa.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA
  PRIMARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary
  TERTIARY_URL: https://deep33-backend.onrender.com

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: python -m pytest tests -q

  android:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - run: |
          cd android
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon
      - run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t android/app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release-unsigned.apk | tee android-apk-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-0.5.1-doctor-full-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android-apk-sha256.txt
          if-no-files-found: error

  instrumentation:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-doctor
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          disable-spellchecker: true
          working-directory: android
          script: |
            set -eu
            trap 'adb logcat -d -v epoch -s DEEP33_PERF:I > deep33-performance.log 2>/dev/null || true' EXIT
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cl.caggrometal.deep33.Deep33UiContractV2Test,cl.caggrometal.deep33.Deep33FeaturePersistenceTest,cl.caggrometal.deep33.Deep33LifecycleRecoveryTest,cl.caggrometal.deep33.SessionStorePersistenceTest,cl.caggrometal.deep33.SseTextParserTest --no-daemon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DEEP33-performance-instrumentation
          path: android/deep33-performance.log
          if-no-files-found: warn

  production:
    needs: [backend, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create authenticated session
        run: |
          set -euo pipefail
          profile_id="doctor-${GITHUB_RUN_ID}"
          auth_http="$(curl -sS --connect-timeout 8 --max-time 30 -o /tmp/deep33-auth.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/functions/v1/deep33-auth" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "content-type: application/json" \
            -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}")"
          auth_json="$(cat /tmp/deep33-auth.json)"
          echo "DEEP33_AUTH_HTTP=$auth_http"
          printf '%s\n' "$auth_json" | jq -e 'del(.access_token, .refresh_token)'
          test "$auth_http" = "200"
          token="$(printf '%s' "$auth_json" | jq -r '.access_token // empty')"
          test -n "$token"
          echo "DEEP33_DOCTOR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Validate protected Edge endpoints
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $DEEP33_DOCTOR_TOKEN")
          curl -fsS --connect-timeout 8 --max-time 45 "${auth[@]}" "$PRIMARY_URL/health" | jq -e '.status=="PASS"'
          curl -fsS --connect-timeout 8 --max-time 45 "${auth[@]}" "$PRIMARY_URL/ready" | jq -e '.status=="PASS" and .ready==true'
                    audit_json="$(curl -fsS --connect-timeout 8 --max-time 90 "${auth[@]}" "$PRIMARY_URL/v1/connectivity/audit")"
          printf "%s\n" "$audit_json" | jq -e '.edge=="PASS" and .checks.INTERNET=="PASS" and .search.ok==true'

      - name: Validate realtime local news retrieval in production
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $DEEP33_DOCTOR_TOKEN")
          query="situación actual de la comuna de Las Condes en Chile"
          result="$(curl -fsS --connect-timeout 8 --max-time 90 "${auth[@]}" --get "$PRIMARY_URL/v1/web/search" --data-urlencode "q=$query")"
          printf "%s\n" "$result" > /tmp/deep33-realtime-local.json
          jq -e '.ok == true and .realtime == true and .fresh_request == true and .engine == "DEEP33 Search Engine" and .engine_version == "1.3.0" and (.queries | length) >= 3 and (.providers | length) >= 2 and (.retrieved_at | strings | length) > 10' /tmp/deep33-realtime-local.json
          jq -e '(.queries | join(" ")) as $queries | ($queries | test("últimas noticias de hoy"))' /tmp/deep33-realtime-local.json
      - name: Validate direct tertiary backend
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $DEEP33_DOCTOR_TOKEN" -H "X-DEEP33-Session-Id: doctor-${GITHUB_RUN_ID}")
          curl -fsS --connect-timeout 8 --max-time 45 "${auth[@]}" "$TERTIARY_URL/health" | jq -e '.status=="PASS"'
          curl -fsS --connect-timeout 8 --max-time 60 "${auth[@]}" "$TERTIARY_URL/ready" | jq -e '.status=="PASS" and .ready==true'

      - name: Validate real inference, SSE, memory and feedback
        run: |
          set -euo pipefail
          session_id="doctor-${GITHUB_RUN_ID}"
          request_id="doctor-inference-${GITHUB_RUN_ID}"
          idempotency_key="doctor-idem-${GITHUB_RUN_ID}"
          body='{"messages":[{"role":"user","content":"Responde exactamente: DEEP33_DOCTOR_OK"}],"personality":"NEUTRO"}'
          curl -fsS --connect-timeout 8 --max-time 120 \
            -H "Authorization: Bearer $DEEP33_DOCTOR_TOKEN" \
            -H "X-DEEP33-Session-Id: $session_id" \
            -H "X-Request-ID: $request_id" \
            -H "X-Idempotency-Key: $idempotency_key" \
            -H "content-type: application/json" \
            -d "$body" \
            "$PRIMARY_URL/v1/ai/generate" > /tmp/deep33-generate.json
          jq -e '.result.text | strings | contains("DEEP33_DOCTOR_OK")' /tmp/deep33-generate.json
          response_hash="$(jq -r '.result.text' /tmp/deep33-generate.json | sha256sum | awk '{print $1}')"
          test -n "$response_hash"

          stream_request_id="doctor-stream-${GITHUB_RUN_ID}"
          stream_idem="doctor-stream-idem-${GITHUB_RUN_ID}"
          stream_body='{"messages":[{"role":"user","content":"Responde exactamente: DEEP33_STREAM_OK"}],"personality":"NEUTRO"}'
          curl -fsSN --connect-timeout 8 --max-time 120 \
            -H "Authorization: Bearer $DEEP33_DOCTOR_TOKEN" \
            -H "X-DEEP33-Session-Id: $session_id" \
            -H "X-Request-ID: $stream_request_id" \
            -H "X-Idempotency-Key: $stream_idem" \
            -H "content-type: application/json" \
            -d "$stream_body" \
            "$PRIMARY_URL/v1/chat/stream" > /tmp/deep33-stream.txt
          test -s /tmp/deep33-stream.txt
          grep -q '"choices"' /tmp/deep33-stream.txt
          grep -q '"content"' /tmp/deep33-stream.txt
          grep -q "\[DONE\]" /tmp/deep33-stream.txt

          curl -fsS --connect-timeout 8 --max-time 45 \
            -H "Authorization: Bearer $DEEP33_DOCTOR_TOKEN" \
            -H "X-DEEP33-Session-Id: $session_id" \
            "$PRIMARY_URL/v1/memory/context" > /tmp/deep33-context.json
          jq -e 'has("messages") and has("memories")' /tmp/deep33-context.json

          sync_request_id="doctor-memory-${GITHUB_RUN_ID}"
          sync_idem="doctor-memory-idem-${GITHUB_RUN_ID}"
          sync_body='{"messages":[{"role":"user","content":"DEEP33_MEMORY_DOCTOR"},{"role":"assistant","content":"DEEP33_MEMORY_OK"}],"personality":"NEUTRO","preferences":{"doctor":"true"}}'
          curl -fsS --connect-timeout 8 --max-time 60 \
            -H "Authorization: Bearer $DEEP33_DOCTOR_TOKEN" \
            -H "X-DEEP33-Session-Id: $session_id" \
            -H "X-Request-ID: $sync_request_id" \
            -H "X-Idempotency-Key: $sync_idem" \
            -H "content-type: application/json" \
            -d "$sync_body" \
            "$PRIMARY_URL/v1/memory/sync" | jq -e '.ok == true'

          curl -fsS --connect-timeout 8 --max-time 45 \
            -H "Authorization: Bearer $DEEP33_DOCTOR_TOKEN" \
            -H "X-DEEP33-Session-Id: $session_id" \
            -H "content-type: application/json" \
            -d "{\"rating\":\"useful\",\"request_id\":\"$request_id\",\"response_hash\":\"$response_hash\"}" \
            "$PRIMARY_URL/v1/feedback" | jq -e '.ok == true and .persisted == true'

  evidence:
    needs: [backend, android, instrumentation, production]
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat <<EOF
          DEEP33_DOCTOR_FULL=true
          BACKEND_TESTS=PASS
          ANDROID_BUILD=PASS
          ANDROID_INSTRUMENTATION=PASS
          PRODUCTION_EDGE=PASS
          PRODUCTION_TERTIARY=PASS
          HEAD=$GITHUB_SHA
          EOF
