name: DEEP33 Doctor Full Validation

on:
  push:
    branches:
      - doctor/deep33-architecture-speed-multiuser-20261008
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_URL: https://opocgzydeknuchtrqzfa.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA
  PRIMARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary
  TERTIARY_URL: https://deep33-backend.onrender.com

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: python -m pytest tests -q

  android:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - run: |
          cd android
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon
      - run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t android/app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release-unsigned.apk | tee android-apk-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-0.5.1-doctor-full-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android-apk-sha256.txt
          if-no-files-found: error

  instrumentation:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-doctor
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim
          disable-animations: true
          disable-spellchecker: true
          working-directory: android
          script: |
            set -euo pipefail
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=cl.caggrometal.deep33.Deep33UiContractV2Test,cl.caggrometal.deep33.Deep33FeaturePersistenceTest,cl.caggrometal.deep33.Deep33LifecycleRecoveryTest,cl.caggrometal.deep33.SessionStorePersistenceTest,cl.caggrometal.deep33.SseTextParserTest --no-daemon

  production:
    needs: [backend, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create authenticated session
        run: |
          set -euo pipefail
          profile_id="doctor-${GITHUB_RUN_ID}"
          auth_json="$(curl -fsS --connect-timeout 8 --max-time 30 \
            -X POST "$SUPABASE_URL/functions/v1/deep33-auth" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "content-type: application/json" \
            -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}")"
          token="$(printf '%s' "$auth_json" | jq -r '.access_token // empty')"
          test -n "$token"
          echo "DEEP33_DOCTOR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Validate protected Edge endpoints
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $DEEP33_DOCTOR_TOKEN")
          curl -fsS --connect-timeout 8 --max-time 45 "${auth[@]}" "$PRIMARY_URL/health" | jq -e '.status=="PASS"'
          curl -fsS --connect-timeout 8 --max-time 45 "${auth[@]}" "$PRIMARY_URL/ready" | jq -e '.status=="PASS" and .ready==true'
          curl -fsS --connect-timeout 8 --max-time 90 "${auth[@]}" "$PRIMARY_URL/v1/connectivity/audit" | jq -e '.edge=="PASS" and .internet=="PASS" and .search.ok==true'
      - name: Validate direct tertiary backend
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $DEEP33_DOCTOR_TOKEN" -H "X-DEEP33-Session-Id: doctor-${GITHUB_RUN_ID}")
          curl -fsS --connect-timeout 8 --max-time 45 "${auth[@]}" "$TERTIARY_URL/health" | jq -e '.status=="PASS"'
          curl -fsS --connect-timeout 8 --max-time 60 "${auth[@]}" "$TERTIARY_URL/ready" | jq -e '.status=="PASS" and .ready==true'

  evidence:
    needs: [backend, android, instrumentation, production]
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat <<EOF
          DEEP33_DOCTOR_FULL=true
          BACKEND_TESTS=PASS
          ANDROID_BUILD=PASS
          ANDROID_INSTRUMENTATION=PASS
          PRODUCTION_EDGE=PASS
          PRODUCTION_TERTIARY=PASS
          HEAD=$GITHUB_SHA
          EOF
