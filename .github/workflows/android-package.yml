name: DEEP33 Android Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DEEP33_PRIMARY_URL: https://deep33-backend.onrender.com

jobs:
  backend_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Render backend
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$DEEP33_PRIMARY_URL/health" | tee /tmp/health.json
          curl -fsS --max-time 30 "$DEEP33_PRIMARY_URL/ready" | tee /tmp/ready.json
          curl -fsS --max-time 95 "$DEEP33_PRIMARY_URL/v1/ai/diagnostics" | tee /tmp/diag.json
          python - <<'PY'
          import json
          health=json.load(open("/tmp/health.json"))
          ready=json.load(open("/tmp/ready.json"))
          diag=json.load(open("/tmp/diag.json"))
          assert health["status"] == "PASS", health
          assert ready["status"] == "PASS" and ready["ready"] is True, ready
          assert diag["online"] is True, diag
          assert diag["checks"]["MODEL"] == "PASS", diag
          assert diag["checks"]["CHAT"] == "PASS", diag
          print("DEEP33_BACKEND_GATE_PASS")
          PY

  android_package:
    needs: backend_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Android and build packages
        run: |
          cd android
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DEEP33-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release APK
        uses: actions/upload-artifact@v4
        with:
          name: DEEP33-release-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
