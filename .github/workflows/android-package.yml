name: DEEP33 Android Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DEEP33_PRIMARY_URL: https://deep33-backend.onrender.com
  DEEP33_SECONDARY_URL: https://deep33-backup.onrender.com
  DEEP33_TERTIARY_URL: https://deep33-api.onrender.com

jobs:
  backend_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Render backend
        run: |
          set -euo pipefail
          for url in "$DEEP33_PRIMARY_URL" "$DEEP33_SECONDARY_URL" "$DEEP33_TERTIARY_URL"; do
            curl -fsS --connect-timeout 8 --max-time 45 "$url/health" | tee /tmp/health.json >/dev/null
            curl -fsS --connect-timeout 8 --max-time 60 "$url/ready" | tee /tmp/ready.json >/dev/null
            curl -fsS --connect-timeout 8 --max-time 120 "$url/v1/ai/diagnostics" | tee /tmp/diag.json >/dev/null
            python - <<'PY'
          import json
          health=json.load(open("/tmp/health.json"))
          ready=json.load(open("/tmp/ready.json"))
          diag=json.load(open("/tmp/diag.json"))
          assert health["status"] == "PASS", health
          assert ready["status"] == "PASS" and ready["ready"] is True, ready
          assert diag["online"] is True, diag
          assert diag["checks"]["MODEL"] == "PASS", diag
          assert diag["checks"]["CHAT"] == "PASS", diag
          print("DEEP33_NODE_GATE_PASS", health["git_sha"])
          PY
          done

  android_package:
    needs: backend_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Require certified production-pass
        run: |
          set -euo pipefail
          git fetch origin refs/tags/production-pass --force
          certified="$(git rev-parse refs/tags/production-pass^{commit})"
          current="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$certified" = "$current" || {
            echo "RELEASE_BLOCKED certified=$certified current=$current"
            exit 1
          }
          echo "RELEASE_CERTIFIED $certified"

      - name: Prepare release signing
        env:
          DEEP33_RELEASE_KEYSTORE_B64: ${{ secrets.DEEP33_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$DEEP33_RELEASE_KEYSTORE_B64"
          printf '%s' "$DEEP33_RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/deep33-release.keystore"
          test -s "$RUNNER_TEMP/deep33-release.keystore"

      - name: Validate Android and build packages
        env:
          DEEP33_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/deep33-release.keystore
          DEEP33_RELEASE_STORE_PASSWORD: ${{ secrets.DEEP33_RELEASE_STORE_PASSWORD }}
          DEEP33_RELEASE_KEY_ALIAS: ${{ secrets.DEEP33_RELEASE_KEY_ALIAS }}
          DEEP33_RELEASE_KEY_PASSWORD: ${{ secrets.DEEP33_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEEP33_RELEASE_STORE_PASSWORD"
          test -n "$DEEP33_RELEASE_KEY_ALIAS"
          test -n "$DEEP33_RELEASE_KEY_PASSWORD"
          cd android
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Publish debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-release-apk-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
