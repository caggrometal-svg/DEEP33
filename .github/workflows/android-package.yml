name: DEEP33 Android Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "production-pass"

permissions:
  contents: read

env:
  DEEP33_PRIMARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  DEEP33_SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary
  DEEP33_TERTIARY_URL: https://deep33-backend.onrender.com
  DEEP33_REQUIRE_REDUNDANCY: "true"

jobs:
  backend_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Create CI DEEP33 auth session
        env:
          SUPABASE_URL: https://opocgzydeknuchtrqzfa.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA
        run: |
          set -euo pipefail
          body="$(curl -fsS --connect-timeout 8 --max-time 30 \
            -X POST "$SUPABASE_URL/functions/v1/deep33-auth" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "content-type: application/json" \
            -d "{\"action\":\"session\",\"memory_profile_id\":\"ci-package-${GITHUB_RUN_ID}\"}")"
          token="$(printf '%s' "$body" | jq -r '.access_token // empty')"
          test -n "$token"
          echo "DEEP33_CI_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify DEEP33 edge backend
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer $DEEP33_CI_ACCESS_TOKEN")
          curl -fsS --connect-timeout 8 --max-time 45 "${headers[@]}" "$DEEP33_PRIMARY_URL/health" | jq -e '.status=="PASS" and .service=="DEEP33 Edge Gateway"'
          curl -fsS --connect-timeout 8 --max-time 90 "${headers[@]}" "$DEEP33_PRIMARY_URL/v1/connectivity/audit" | jq -e '.edge=="PASS" and .internet=="PASS" and .search.ok==true'
          echo "DEEP33_EDGE_GATE_PASS"


  android_package:
    needs: backend_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Require canonical DEEP33 failover endpoint
        run: |
          set -euo pipefail
          test -n "$DEEP33_SECONDARY_URL" || { echo "SECONDARY_URL_MISSING"; exit 1; }
          test "$DEEP33_PRIMARY_URL" != "$DEEP33_SECONDARY_URL" || { echo "PRIMARY_SECONDARY_DUPLICATE"; exit 1; }
          echo "FAILOVER_DIVERSITY_PASS"
      - name: Install certification test runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Require certified production-pass
        run: |
          set -euo pipefail
          git fetch origin refs/tags/production-pass --force
          certified="$(git rev-parse refs/tags/production-pass^{commit})"
          current="$(git rev-parse HEAD)"
          test "$certified" = "$current" || {
            echo "RELEASE_BLOCKED certified=$certified current=$current"
            exit 1
          }
          echo "RELEASE_CERTIFIED $certified"
          python -m pip install --disable-pip-version-check --no-input pytest==8.4.1
          python -m pytest tests/test_connectivity_hardening.py -q
          echo "RELEASE_CERTIFICATION_GATE_PASS"

      - name: Validate Android and build certified debug package
        run: |
          set -euo pipefail
          cd android
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Publish debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-certified-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
