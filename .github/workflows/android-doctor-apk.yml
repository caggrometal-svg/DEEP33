name: DEEP33 Doctor APK

on:
  push:
    branches:
      - doctor/deep33-architecture-speed-multiuser-20261008
  workflow_dispatch:

concurrency:
  group: deep33-doctor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Android lint and unit tests
        run: |
          set -euo pipefail
          cd android
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
      - name: APK integrity and hashes
        run: |
          set -euo pipefail
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          unzip -t "$DEBUG_APK" >/dev/null
          unzip -t "$RELEASE_APK" >/dev/null
          sha256sum "$DEBUG_APK" "$RELEASE_APK" | tee apk-sha256.txt
          grep -q "versionName" android/app/build.gradle.kts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-0.5.1-doctor-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            apk-sha256.txt
          if-no-files-found: error
