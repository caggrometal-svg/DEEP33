name: DEEP33 Current APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Require certified production-pass SHA
        run: |
          set -euo pipefail
          git fetch origin refs/tags/production-pass --force
          git fetch origin refs/heads/main:refs/remotes/origin/main --force
          certified="$(git rev-parse refs/tags/production-pass^{commit})"
          current="$(git rev-parse HEAD)"
          main_head="$(git rev-parse refs/remotes/origin/main^{commit})"
          test "$certified" = "$current" && test "$certified" = "$main_head" || {
            echo "APK_BUILD_BLOCKED_CERTIFIED=$certified CURRENT=$current MAIN=$main_head"
            exit 1
          }
          echo "APK_BUILD_CERTIFIED_SHA=$certified"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Build DEEP33 debug APK
        run: |
          set -euo pipefail
          cd android
          gradle :app:assembleDebug --no-daemon

      - name: Publish DEEP33 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-current-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
