concurrency:
  group: deep33-production-e2e-${{ github.ref }}
  cancel-in-progress: true

name: DEEP33 Production E2E

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_URL: https://guqevsjbjyapqjjtutza.supabase.co/functions/v1/deep33-proxy
  SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  TERTIARY_URL: https://guqevsjbjyapqjjtutza.supabase.co/functions/v1/deep33-tertiary

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify DEEP33 edge connectivity and search
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/health" | jq -e '.status=="PASS" and .service=="DEEP33 Backend"'
          curl -fsS --connect-timeout 8 --max-time 90 "$PRIMARY_URL/v1/connectivity/audit" | tee /tmp/audit.json
          jq -e '.edge=="PASS" and .internet=="PASS" and .search.ok==true and (.search.results|length)>=1' /tmp/audit.json
          echo "DEEP33_EDGE_AUDIT_PASS"

      - name: Verify edge audit and real inference
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 90 "$PRIMARY_URL/v1/connectivity/audit" | jq -e '.edge=="PASS" and .internet=="PASS" and .search.ok==true'
          curl -fsS --connect-timeout 8 --max-time 120 "$PRIMARY_URL/v1/ai/diagnostics" | tee /tmp/diag.json
          jq -e '.online==true and .checks.MODEL=="PASS" and .checks.CHAT=="PASS"' /tmp/diag.json
          curl -fsS --connect-timeout 8 --max-time 120 \
            -H "X-DEEP33-Session-Id: prod-e2e-${GITHUB_RUN_ID}" \
            -H "X-Request-ID: prod-${GITHUB_RUN_ID}" \
            -H "X-Idempotency-Key: prod-${GITHUB_RUN_ID}" \
            -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"Return only this exact token: DEEP33_E2E_OK"}]}' \
            "$PRIMARY_URL/v1/ai/generate" |
            jq -e '((.result.text // .response.choices[0].message.content // "") | contains("DEEP33_E2E_OK"))'
