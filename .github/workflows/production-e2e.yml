concurrency:
  group: deep33-production-e2e-${{ github.ref }}
  cancel-in-progress: true

name: DEEP33 Production E2E

on:
  workflow_dispatch:
  # Re-run live production smoke tests whenever the auth workflow or an
  # edge runtime contract changes; health-only checks are not sufficient.
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/production-e2e.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/warmup.yml"
      - "backend/search/engine.py"
      - "tests/test_search_engine.py"
      - "render.yaml"
      - "supabase/functions/deep33-proxy/index.ts"
      - "supabase/functions/deep33-tertiary/index.ts"
      - "tests/test_connectivity_hardening.py"
      - "tools/web_fetch.py"
      - "tools/web_search.py"
      - "tests/test_web_tools.py"

permissions:
  contents: read

env:
  SUPABASE_URL: https://opocgzydeknuchtrqzfa.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA
  PRIMARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary
  TERTIARY_URL: https://deep33-backend.onrender.com

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Create authenticated E2E user session
        run: |
          set -euo pipefail
          token=""
          for attempt in 1 2 3; do
            # GITHUB_RUN_ID is reused on rerun; add the attempt and rotate on HTTP 409.
            profile_id="e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${SECONDS}-${attempt}"
            response="$(curl -sS --connect-timeout 8 --max-time 30 \
              -w '\nDEEP33_HTTP_STATUS:%{http_code}' \
              -X POST "$SUPABASE_URL/functions/v1/deep33-auth" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "content-type: application/json" \
              -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}" || true)"
            status="${response##*DEEP33_HTTP_STATUS:}"
            auth_json="${response%$'\n'DEEP33_HTTP_STATUS:*}"
            if [ "$status" = "200" ]; then
              token="$(printf '%s' "$auth_json" | jq -r '.access_token // empty')"
              break
            fi
            if [ "$status" = "409" ]; then
              echo "AUTH_PROFILE_COLLISION attempt=$attempt; rotating test profile"
            elif [ "$status" = "000" ] || [ "$status" = "429" ] || [ "${status:0:1}" = "5" ]; then
              echo "AUTH_TRANSIENT_FAILURE attempt=$attempt http=$status"
            else
              echo "AUTH_SESSION_FAILED status=$status"
              printf '%s\n' "$auth_json" | jq -c '{error: (.error // "unknown")}' || true
              exit 1
            fi
            [ "$attempt" -lt 3 ] && sleep 3
          done
          test -n "$token" || { echo "AUTH_SESSION_FAILED retries_exhausted"; exit 1; }
          echo "DEEP33_E2E_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Verify every production transport node
        run: |
          set -euo pipefail
          entries=("PRIMARY|$PRIMARY_URL" "SECONDARY|$SECONDARY_URL" "TERTIARY|$TERTIARY_URL")
          for entry in "${entries[@]}"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            node_ready=0
            last_health_code=0
            last_ready_code=0
            for attempt in $(seq 1 12); do
              last_health_code="$(curl -sS --connect-timeout 8 --max-time 30 -o "/tmp/${name,,}-health.json" -w "%{http_code}" -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$url/health" || true)"
              if [ "$last_health_code" = "200" ] && jq -e '.status=="PASS"' "/tmp/${name,,}-health.json" >/dev/null 2>&1; then
                last_ready_code="$(curl -sS --connect-timeout 8 --max-time 45 -o "/tmp/${name,,}-ready.json" -w "%{http_code}" -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$url/ready" || true)"
                if [ "$last_ready_code" = "200" ] && jq -e '.status=="PASS" and .ready==true' "/tmp/${name,,}-ready.json" >/dev/null 2>&1; then
                  node_ready=1
                  break
                fi
              fi
              echo "${name}_PRODUCTION_NODE_NOT_READY attempt=$attempt health_http=$last_health_code ready_http=$last_ready_code"
              sleep 10
            done
            if [ "$node_ready" != "1" ]; then
              echo "${name}_PRODUCTION_NODE_FAIL"
              cat "/tmp/${name,,}-health.json" "/tmp/${name,,}-ready.json" 2>/dev/null || true
              exit 1
            fi
            echo "${name}_PRODUCTION_NODE_PASS"
          done
          test "$PRIMARY_URL" != "$SECONDARY_URL"
          test "$PRIMARY_URL" != "$TERTIARY_URL"
          test "$SECONDARY_URL" != "$TERTIARY_URL"
          echo "DEEP33_PRODUCTION_REDUNDANCY_PASS"

      - name: Verify DEEP33 edge connectivity and search
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 60 -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$PRIMARY_URL/health" | jq -e '.status=="PASS" and .service=="DEEP33 Edge Gateway"'
          audit_ok=0
          for attempt in $(seq 1 5); do
            echo "DEEP33_EDGE_AUDIT_ATTEMPT=$attempt"
            curl -sS --connect-timeout 8 --max-time 90 -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$PRIMARY_URL/v1/connectivity/audit" -o /tmp/audit.json || true
            if jq -e '.edge=="PASS" and .checks.INTERNET=="PASS" and .checks.DNS=="PASS" and .checks.SEARCH=="PASS" and .search.ok==true and (.search.results|length)>=1 and (.search.verification.relevant_results // 0) >= 1' /tmp/audit.json >/dev/null 2>&1; then
              audit_ok=1
              break
            fi
            echo "DEEP33_EDGE_AUDIT_NOT_READY"
            jq -c '{status,checks,search_ok:.search.ok,results:(.search.results|length),timestamp}' /tmp/audit.json 2>/dev/null || true
            sleep 5
          done
          if [ "$audit_ok" != "1" ]; then
            echo "DEEP33_EDGE_AUDIT_FAIL"
            cat /tmp/audit.json 2>/dev/null || true
            exit 1
          fi
          cat /tmp/audit.json
          echo "DEEP33_EDGE_AUDIT_PASS"

# Validate broad Internet navigation (not a news-aggregator-only path).
      - name: Verify generic web search and real source-page navigation
        run: |
          set -euo pipefail
          query="Python asyncio official documentation"
          status="$(curl -sS --connect-timeout 8 --max-time 45 \
            -o /tmp/deep33-navigation-search.json -w "%{http_code}" \
            -G "$TERTIARY_URL/v1/web/search" \
            -H "Authorization: Bearer $DEEP33_E2E_TOKEN" \
            -H "X-DEEP33-Session-Id: navigation-e2e-$GITHUB_RUN_ID" \
            -H "X-Request-ID: navigation-e2e-$GITHUB_RUN_ID" \
            --data-urlencode "q=$query" || true)"
          if [ "$status" != "200" ] || ! jq -e '.ok == true and (.results | length) >= 1' /tmp/deep33-navigation-search.json >/dev/null 2>&1; then
            echo "WEB_NAVIGATION_SEARCH_FAIL http=$status"
            jq -c '{ok,provider,providers,results:(.results|length),errors}' /tmp/deep33-navigation-search.json 2>/dev/null || true
            exit 1
          fi
          mapfile -t source_urls < <(jq -r '[.results[]? | .url? // empty | select(startswith("https://"))] | unique | sort_by(test("^https://news\\.google\\.com/rss/articles/")) | .[:6][]' /tmp/deep33-navigation-search.json)
          fetch_ok=0
          for index in "${!source_urls[@]}"; do
            source_url="${source_urls[$index]}"
            fetch_status="$(curl -sS --connect-timeout 5 --max-time 15 \
              -o /tmp/deep33-navigation-fetch.json -w "%{http_code}" \
              -G "$TERTIARY_URL/v1/web/fetch" \
              -H "Authorization: Bearer $DEEP33_E2E_TOKEN" \
              -H "X-DEEP33-Session-Id: navigation-e2e-$GITHUB_RUN_ID" \
              -H "X-Request-ID: navigation-e2e-$GITHUB_RUN_ID-$index" \
              --data-urlencode "url=$source_url" || true)"
            if [ "$fetch_status" = "200" ] && jq -e '.ok == true and (.text | strings | length) >= 20 and (.final_url | strings | length) > 10' /tmp/deep33-navigation-fetch.json >/dev/null 2>&1; then
              jq -c '{navigation:"PASS",title,final_url,bytes,redirects,text_chars:(.text|length)}' /tmp/deep33-navigation-fetch.json
              fetch_ok=1
              break
            fi
            echo "WEB_NAVIGATION_SOURCE_NOT_READABLE candidate=$((index + 1)) http=$fetch_status"
            jq -c '{ok,error,title,final_url,bytes,redirects}' /tmp/deep33-navigation-fetch.json 2>/dev/null || true
          done
          if [ "$fetch_ok" != "1" ]; then
            echo "WEB_NAVIGATION_FAIL no_search_result_could_be_opened"
            exit 1
          fi
          echo "DEEP33_WEB_SOURCE_NAVIGATION_PASS"

      - name: Verify the primary Edge chat performs search, source navigation, and response
        run: |
          set -euo pipefail
          payload='{"messages":[{"role":"user","content":"Busca en internet la documentación oficial de Python asyncio y explica brevemente qué es."}],"personality":"NEUTRO"}'
          status="$(curl -sS --connect-timeout 8 --max-time 45 \
            -o /tmp/deep33-edge-web-chat.sse -w "%{http_code}" \
            -X POST "$PRIMARY_URL/v1/chat/stream" \
            -H "Authorization: Bearer $DEEP33_E2E_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-DEEP33-Session-Id: edge-web-e2e-$GITHUB_RUN_ID" \
            -H "X-Request-ID: edge-web-e2e-$GITHUB_RUN_ID" \
            --data-binary "$payload" || true)"
          if [ "$status" != "200" ]; then
            echo "DEEP33_EDGE_WEB_CHAT_FAIL http=$status"
            head -c 1000 /tmp/deep33-edge-web-chat.sse 2>/dev/null || true
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          raw = Path("/tmp/deep33-edge-web-chat.sse").read_text(errors="replace")
          if "event: error" in raw:
              print("DEEP33_EDGE_WEB_CHAT_FAIL error_event=true")
              raise SystemExit(1)
          chunks = []
          done = False
          for block in raw.split("\n\n"):
              for line in block.splitlines():
                  if not line.startswith("data: "):
                      continue
                  data = line[6:].strip()
                  if data == "[DONE]":
                      done = True
                      continue
                  try:
                      event = json.loads(data)
                  except json.JSONDecodeError:
                      continue
                  choices = event.get("choices")
                  if isinstance(choices, list) and choices:
                      delta = choices[0].get("delta", {})
                      value = delta.get("content", "") if isinstance(delta, dict) else ""
                      if isinstance(value, str) and value:
                          chunks.append(value)
          answer = "".join(chunks).strip()
          if not done or len(answer) < 20:
              print(f"DEEP33_EDGE_WEB_CHAT_FAIL done={done} text_chars={len(answer)}")
              raise SystemExit(1)
          print(f"DEEP33_EDGE_WEB_NAVIGATION_E2E_PASS text_chars={len(answer)}")
          PY

      - name: Measure live production search latency (10 independent requests)
        run: |
          set -euo pipefail
          query="últimas noticias de Chile hoy"
          : > /tmp/deep33-search-latency-ms.txt
          for sample in $(seq 1 10); do
            response_file="/tmp/deep33-search-${sample}.json"
            measurement="$(curl -sS --connect-timeout 8 --max-time 45 \
              -o "$response_file" -w '%{http_code} %{time_total}' \
              -G "$PRIMARY_URL/v1/web/search" \
              -H "Authorization: Bearer $DEEP33_E2E_TOKEN" \
              -H "Cache-Control: no-cache" \
              -H "X-DEEP33-Session-Id: search-bench-${GITHUB_RUN_ID}-${sample}" \
              -H "X-Request-ID: search-bench-${GITHUB_RUN_ID}-${sample}" \
              --data-urlencode "q=$query" || true)"
            status="${measurement%% *}"
            seconds="${measurement#* }"
            if [ "$status" != "200" ] || ! jq -e '.ok == true and .realtime == true and .fresh_request == true and (.results | length) >= 1 and (.providers | length) >= 1 and (.retrieved_at | strings | length) > 10' "$response_file" >/dev/null 2>&1; then
              echo "PRODUCTION_SEARCH_SAMPLE_FAIL sample=$sample http=$status"
              jq -c '{ok,realtime,fresh_request,providers,results:(.results|length),retrieved_at,errors}' "$response_file" 2>/dev/null || true
              exit 1
            fi
            milliseconds="$(awk -v seconds="$seconds" 'BEGIN { printf "%.2f", seconds * 1000 }')"
            printf '%s\n' "$milliseconds" >> /tmp/deep33-search-latency-ms.txt
            echo "PRODUCTION_SEARCH_SAMPLE_PASS sample=$sample latency_ms=$milliseconds"
          done
          python - <<'PY'
          import math
          from pathlib import Path
          values = sorted(float(line) for line in Path("/tmp/deep33-search-latency-ms.txt").read_text().splitlines() if line.strip())
          if len(values) != 10:
              raise SystemExit(f"PRODUCTION_SEARCH_SAMPLE_COUNT_FAIL n={len(values)}")
          p50 = (values[4] + values[5]) / 2
          p95 = values[math.ceil(0.95 * len(values)) - 1]
          print(
              "PRODUCTION_SEARCH_LATENCY "
              f"samples={len(values)} p50_ms={p50:.2f} p95_ms={p95:.2f} "
              f"min_ms={values[0]:.2f} max_ms={values[-1]:.2f}"
          )
          PY

      - name: Verify edge audit and real inference
        run: |
          set -euo pipefail
          audit_ok=0
          for attempt in $(seq 1 3); do
            curl -sS --connect-timeout 8 --max-time 90 -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$PRIMARY_URL/v1/connectivity/audit" -o /tmp/audit-recheck.json || true
            if jq -e '.edge=="PASS" and .checks.INTERNET=="PASS" and .checks.DNS=="PASS" and .checks.SEARCH=="PASS" and .search.ok==true and (.search.results|length)>=1 and (.search.verification.relevant_results // 0) >= 1' /tmp/audit-recheck.json >/dev/null 2>&1; then
              audit_ok=1
              break
            fi
            echo "DEEP33_EDGE_AUDIT_RECHECK_NOT_READY attempt=$attempt"
            sleep 5
          done
          test "$audit_ok" = "1" || { cat /tmp/audit-recheck.json 2>/dev/null || true; exit 1; }
          diagnostics_ok=0
          for attempt in $(seq 1 5); do
            status="$(curl -sS --connect-timeout 8 --max-time 120 -o /tmp/diag.json -w "%{http_code}" -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$PRIMARY_URL/v1/ai/diagnostics" || true)"
            if [ "$status" = "200" ] && jq -e '.online==true and .checks.MODEL=="PASS" and .checks.CHAT=="PASS"' /tmp/diag.json >/dev/null 2>&1; then
              diagnostics_ok=1
              break
            fi
            echo "DEEP33_DIAGNOSTICS_NOT_READY attempt=$attempt http=$status"
            jq -c '{online,checks,inference,timestamp}' /tmp/diag.json 2>/dev/null || true
            [ "$attempt" -lt 5 ] && sleep 5
          done
          test "$diagnostics_ok" = "1" || { echo "DEEP33_DIAGNOSTICS_FAIL"; cat /tmp/diag.json 2>/dev/null || true; exit 1; }
          inference_ok=0
          for attempt in $(seq 1 4); do
            echo "DEEP33_REAL_INFERENCE_ATTEMPT=$attempt"
            status="$(curl -sS --connect-timeout 8 --max-time 120 \
              -o /tmp/generate-response.json -w "%{http_code}" \
              -H "Authorization: Bearer $DEEP33_E2E_TOKEN" \
              -H "X-DEEP33-Session-Id: prod-e2e-${GITHUB_RUN_ID}-${attempt}" \
              -H "X-Request-ID: prod-${GITHUB_RUN_ID}-${attempt}" \
              -H "X-Idempotency-Key: prod-${GITHUB_RUN_ID}-${attempt}" \
              -H 'content-type: application/json' \
              -d '{"messages":[{"role":"user","content":"Return only this exact token: DEEP33_E2E_OK"}]}' \
              "$PRIMARY_URL/v1/ai/generate" || true)"
            if [ "$status" = "200" ] && jq -e '((.result.text // .response.choices[0].message.content // "") | contains("DEEP33_E2E_OK"))' /tmp/generate-response.json >/dev/null 2>&1; then
              cat /tmp/generate-response.json | jq -c '{inference:"PASS", response:(.result.text // .response.choices[0].message.content)}'
              inference_ok=1
              break
            fi
            echo "DEEP33_REAL_INFERENCE_NOT_READY attempt=$attempt http=$status"
            jq -c '{error:(.error // .detail // .message // "non-json-or-empty-response"), code:(.code // null)}' /tmp/generate-response.json 2>/dev/null || true
            if [ "$attempt" -lt 4 ]; then sleep 5; fi
          done
          test "$inference_ok" = "1" || { echo "DEEP33_REAL_INFERENCE_FAIL"; exit 1; }
          echo "DEEP33_REAL_INFERENCE_PASS"
