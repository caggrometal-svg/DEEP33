concurrency:
  group: deep33-production-e2e-${{ github.ref }}
  cancel-in-progress: true

name: DEEP33 Production E2E

on:
  workflow_dispatch:
  # Run the production smoke test when its auth/retry logic changes.
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/production-e2e.yml"

permissions:
  contents: read

env:
  SUPABASE_URL: https://opocgzydeknuchtrqzfa.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA
  PRIMARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary
  TERTIARY_URL: https://deep33-backend.onrender.com

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Create authenticated E2E user session
        run: |
          set -euo pipefail
          token=""
          for attempt in 1 2 3; do
            # GITHUB_RUN_ID is reused on rerun; add the attempt and rotate on HTTP 409.
            profile_id="e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${SECONDS}-${attempt}"
            response="$(curl -sS --connect-timeout 8 --max-time 30 \
              -w '\nDEEP33_HTTP_STATUS:%{http_code}' \
              -X POST "$SUPABASE_URL/functions/v1/deep33-auth" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "content-type: application/json" \
              -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}" || true)"
            status="${response##*DEEP33_HTTP_STATUS:}"
            auth_json="${response%$'\n'DEEP33_HTTP_STATUS:*}"
            if [ "$status" = "200" ]; then
              token="$(printf '%s' "$auth_json" | jq -r '.access_token // empty')"
              break
            fi
            if [ "$status" = "409" ]; then
              echo "AUTH_PROFILE_COLLISION attempt=$attempt; rotating test profile"
              continue
            fi
            echo "AUTH_SESSION_FAILED status=$status"
            printf '%s\n' "$auth_json" | jq -c '{error: (.error // "unknown")}' || true
            exit 1
          done
          test -n "$token" || { echo "AUTH_SESSION_FAILED retries_exhausted"; exit 1; }
          echo "DEEP33_E2E_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Verify every production transport node
        run: |
          set -euo pipefail
          entries=("PRIMARY|$PRIMARY_URL" "SECONDARY|$SECONDARY_URL" "TERTIARY|$TERTIARY_URL")
          for entry in "${entries[@]}"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            curl -fsS --connect-timeout 8 --max-time 30 -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$url/health" | jq -e '.status=="PASS"' >/dev/null
            curl -fsS --connect-timeout 8 --max-time 45 -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$url/ready" | jq -e '.status=="PASS" and .ready==true' >/dev/null
            echo "${name}_PRODUCTION_NODE_PASS"
          done
          test "$PRIMARY_URL" != "$SECONDARY_URL"
          test "$PRIMARY_URL" != "$TERTIARY_URL"
          test "$SECONDARY_URL" != "$TERTIARY_URL"
          echo "DEEP33_PRODUCTION_REDUNDANCY_PASS"

      - name: Verify DEEP33 edge connectivity and search
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 60 -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$PRIMARY_URL/health" | jq -e '.status=="PASS" and .service=="DEEP33 Edge Gateway"'
          curl -fsS --connect-timeout 8 --max-time 90 -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$PRIMARY_URL/v1/connectivity/audit" | tee /tmp/audit.json
          jq -e '.edge=="PASS" and .internet=="PASS" and .search.ok==true and (.search.results|length)>=1' /tmp/audit.json
          echo "DEEP33_EDGE_AUDIT_PASS"

      - name: Verify edge audit and real inference
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 90 -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$PRIMARY_URL/v1/connectivity/audit" | jq -e '.edge=="PASS" and .internet=="PASS" and .search.ok==true'
          curl -fsS --connect-timeout 8 --max-time 120 -H "Authorization: Bearer $DEEP33_E2E_TOKEN" "$PRIMARY_URL/v1/ai/diagnostics" | tee /tmp/diag.json
          jq -e '.online==true and .checks.MODEL=="PASS" and .checks.CHAT=="PASS"' /tmp/diag.json
          curl -fsS --connect-timeout 8 --max-time 120 \
            -H "Authorization: Bearer $DEEP33_E2E_TOKEN" \
            -H "X-DEEP33-Session-Id: prod-e2e-${GITHUB_RUN_ID}" \
            -H "X-Request-ID: prod-${GITHUB_RUN_ID}" \
            -H "X-Idempotency-Key: prod-${GITHUB_RUN_ID}" \
            -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"Return only this exact token: DEEP33_E2E_OK"}]}' \
            "$PRIMARY_URL/v1/ai/generate" |
            jq -e '((.result.text // .response.choices[0].message.content // "") | contains("DEEP33_E2E_OK"))'
