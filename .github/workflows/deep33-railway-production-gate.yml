name: DEEP33 Railway Production Gate

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tools/**"
      - ".github/workflows/deep33-railway-production-gate.yml"
      - "backend/requirements.txt"
      - "supabase/functions/deep33-proxy/**"
      - "supabase/functions/deep33-hybrid-search/**"
  workflow_dispatch:
    inputs:
      require_live:
        description: Require real live production evidence; false skips the gate
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: deep33-railway-production-gate
  cancel-in-progress: false

jobs:
  railway-production-gate:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.require_live == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAILWAY_BASE_URL: https://iac33-fastapi-edge-production.up.railway.app
      SUPABASE_URL: https://opocgzydeknuchtrqzfa.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA
    steps:
      - name: Wait for exact Railway revision to become healthy
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/railway-ready.json -w '%{http_code}' "$RAILWAY_BASE_URL/ready" || true)"
            live_sha="$(jq -r '.git_sha // empty' /tmp/railway-ready.json 2>/dev/null || true)"
            live_status="$(jq -r '.status // empty' /tmp/railway-ready.json 2>/dev/null || true)"
            echo "RAILWAY_SHA_ATTEMPT=$attempt expected=$GITHUB_SHA live=$live_sha status=$live_status http=$code"
            if [ "$code" = "200" ] && [ "$live_status" = "PASS" ] && [ "$live_sha" = "$GITHUB_SHA" ]; then
              jq -c '{status, git_sha, build_id, timestamp}' /tmp/railway-ready.json
              ready=1
              break
            fi
            [ "$attempt" -lt 36 ] && sleep 5
          done
          test "$ready" = "1" || { echo "RAILWAY_EXACT_SHA_FAIL expected=$GITHUB_SHA"; exit 1; }
          echo "RAILWAY_EXACT_SHA_PASS=$GITHUB_SHA"

      - name: Verify real AI inference
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --connect-timeout 5 --max-time 90 -w '\nSTATUS:%{http_code}\nELAPSED:%{time_total}' "$RAILWAY_BASE_URL/v1/ai/inference-check" || true)"
          status="$(printf '%s' "$response" | sed -n 's/^STATUS://p')"
          elapsed="$(printf '%s' "$response" | sed -n 's/^ELAPSED://p')"
          body="$(printf '%s' "$response" | sed '/^STATUS:/,$d')"
          if [ "$status" != "200" ] || ! printf '%s' "$body" | jq -e '.status == "PASS" and .text_ok == true and ((.model // "") | length) > 0' >/dev/null 2>&1; then
            printf '%s\n' "$body" | jq -c '{status, provider, model, text_ok, timestamp}' 2>/dev/null || true
            echo "RAILWAY_REAL_INFERENCE_FAIL http=$status elapsed_seconds=$elapsed"
            exit 1
          fi
          printf '%s' "$body" | jq -c '{status, provider, model, text_ok, timestamp}'
          echo "RAILWAY_REAL_INFERENCE_PASS elapsed_seconds=$elapsed"

      - name: Verify web tools and hybrid search configuration
        shell: bash
        run: |
          set -euo pipefail
          web_status="$(curl -fsS --connect-timeout 5 --max-time 12 "$RAILWAY_BASE_URL/v1/web/status")"
          printf '%s' "$web_status" | jq -e '.tool_loop_enabled == true and .realtime_policy_enabled == true' >/dev/null
          printf '%s' "$web_status" | jq -c '{engine, engine_version, tool_loop_enabled, realtime_policy_enabled, fetch_limits}'
          hybrid_status="$(curl -fsS --connect-timeout 5 --max-time 12 "$RAILWAY_BASE_URL/v1/search/hybrid/status")"
          printf '%s' "$hybrid_status" | jq -e '.enabled == true and .configured == true' >/dev/null
          printf '%s' "$hybrid_status" | jq -c '{engine, engine_version, enabled, configured, transport, vector_backend, keyword_backend}'
          echo "RAILWAY_SEARCH_CONFIGURATION_PASS"

      - name: Create isolated authenticated test session
        shell: bash
        run: |
          set -euo pipefail
          profile_id="railway-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          response="$(curl -sS --connect-timeout 5 --max-time 20 -w '\nSTATUS:%{http_code}' \
            -X POST "$SUPABASE_URL/functions/v1/deep33-auth" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'content-type: application/json' \
            -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}" || true)"
          status="${response##*STATUS:}"
          body="${response%$'\n'STATUS:*}"
          token=""
          if [ "$status" = "200" ]; then
            token="$(printf '%s' "$body" | jq -r '.access_token // empty')"
          fi
          test -n "$token" || { echo "RAILWAY_AUTH_SESSION_FAIL http=$status"; exit 1; }
          echo "::add-mask::$token"
          {
            echo "DEEP33_RAILWAY_GATE_TOKEN=$token"
            echo "DEEP33_RAILWAY_GATE_SESSION_ID=$profile_id"
          } >> "$GITHUB_ENV"
          echo "RAILWAY_AUTH_SESSION_PASS"

      - name: Verify real semantic embedding runtime
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --connect-timeout 5 --max-time 30 -o /tmp/deep33-embedding-ping.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/functions/v1/deep33-hybrid-search" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $DEEP33_RAILWAY_GATE_TOKEN" \
            -H 'content-type: application/json' \
            -d '{"action":"ping"}' || true)"
          body="$(cat /tmp/deep33-embedding-ping.json 2>/dev/null || true)"
          test "$status" = "200" || { echo "RAILWAY_EMBEDDING_RUNTIME_FAIL http=$status"; exit 1; }
          printf '%s' "$body" | jq -e '.ok == true and .embedding_model == "Supabase/gte-small" and .embedding_smoke == true and .model_dimensions == 384 and .storage_dimensions == 1536 and .version >= 2' >/dev/null || {
            printf '%s' "$body" | jq -c '{ok, service, version, embedding_model, storage_dimensions}'
            echo "RAILWAY_EMBEDDING_RUNTIME_FAIL: semantic embedding runtime unavailable"
            exit 1
          }
          printf '%s' "$body" | jq -c '{ok, service, version, embedding_model, storage_dimensions}'
          echo "RAILWAY_EMBEDDING_RUNTIME_PASS"

      - name: Verify user-scoped memory write/read and isolation
        shell: bash
        run: |
          set -euo pipefail
          marker="DEEP33_GATE_MEMORY_$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "::add-mask::$marker"
          echo "DEEP33_GATE_MEMORY_MARKER=$marker" >> "$GITHUB_ENV"

          write_status="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/deep33-memory-write.json -w '%{http_code}' \
            -X POST "$RAILWAY_BASE_URL/v1/memory/remember" \
            -H "Authorization: Bearer $DEEP33_RAILWAY_GATE_TOKEN" \
            -H "X-DEEP33-Session-Id: $DEEP33_RAILWAY_GATE_SESSION_ID" \
            -H 'content-type: application/json' \
            -d "{\"kind\":\"explicit\",\"content\":\"$marker\"}" || true)"
          write_body="$(cat /tmp/deep33-memory-write.json 2>/dev/null || true)"
          test "$write_status" = "200" || { echo "RAILWAY_MEMORY_WRITE_FAIL http=$write_status"; exit 1; }
          printf '%s' "$write_body" | jq -e '.remembered == true or .ok == true' >/dev/null || {
            printf '%s' "$write_body" | jq -c '{ok, remembered, error}'
            echo "RAILWAY_MEMORY_WRITE_FAIL: persistence not confirmed"
            exit 1
          }

          read_status="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/deep33-memory-read.json -w '%{http_code}' \
            -H "Authorization: Bearer $DEEP33_RAILWAY_GATE_TOKEN" \
            -H "X-DEEP33-Session-Id: $DEEP33_RAILWAY_GATE_SESSION_ID" \
            "$RAILWAY_BASE_URL/v1/memory/context" || true)"
          read_body="$(cat /tmp/deep33-memory-read.json 2>/dev/null || true)"
          test "$read_status" = "200" || { echo "RAILWAY_MEMORY_READ_FAIL http=$read_status"; exit 1; }
          printf '%s' "$read_body" | jq --arg marker "$marker" -e '(.messages | type == "array") and (.memories | type == "array") and any(.memories[]; ((.content // "") | contains($marker)))' >/dev/null || {
            printf '%s' "$read_body" | jq -c '{session, message_count: ((.messages // []) | length), memory_count: ((.memories // []) | length)}'
            echo "RAILWAY_MEMORY_READ_FAIL: the writing user cannot retrieve its marker"
            exit 1
          }
          echo "RAILWAY_MEMORY_WRITE_READ_PASS"

          profile_b="railway-isolation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          auth_status=0
          token_b=""
          for attempt in 1 2 3; do
            auth_status="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/deep33-memory-auth-b.json -w '%{http_code}' \
              -X POST "$SUPABASE_URL/functions/v1/deep33-auth" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H 'content-type: application/json' \
              -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_b\"}" || true)"
            auth_body="$(cat /tmp/deep33-memory-auth-b.json 2>/dev/null || true)"
            token_b="$(printf '%s' "$auth_body" | jq -r '.access_token // empty')"
            [ -n "$token_b" ] && break
            [ "$attempt" -lt 3 ] && sleep 3
          done
          test -n "$token_b" || { echo "RAILWAY_MEMORY_ISOLATION_AUTH_FAIL http=$auth_status"; exit 1; }
          echo "::add-mask::$token_b"
          isolate_status="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/deep33-memory-isolated.json -w '%{http_code}' \
            -H "Authorization: Bearer $token_b" \
            -H "X-DEEP33-Session-Id: $profile_b" \
            "$RAILWAY_BASE_URL/v1/memory/context" || true)"
          isolate_body="$(cat /tmp/deep33-memory-isolated.json 2>/dev/null || true)"
          test "$isolate_status" = "200" || { echo "RAILWAY_MEMORY_ISOLATION_READ_FAIL http=$isolate_status"; exit 1; }
          if printf '%s' "$isolate_body" | jq --arg marker "$marker" -e 'any((.memories // [])[]; ((.content // "") | contains($marker)))' >/dev/null; then
            echo "RAILWAY_MEMORY_ISOLATION_FAIL: user B read user A's marker"
            exit 1
          fi
          echo "RAILWAY_MEMORY_ISOLATION_PASS"

      - name: Verify hybrid search request reaches Supabase Edge
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --connect-timeout 5 --max-time 15 -w '\nSTATUS:%{http_code}' \
            -X POST "$RAILWAY_BASE_URL/v1/search/hybrid" \
            -H "Authorization: Bearer $DEEP33_RAILWAY_GATE_TOKEN" \
            -H "X-DEEP33-Session-Id: $DEEP33_RAILWAY_GATE_SESSION_ID" \
            -H 'content-type: application/json' \
            -d '{"query":"DEEP33 Search Engine orchestrator providers","limit":3}' || true)"
          status="${response##*STATUS:}"
          body="${response%$'\n'STATUS:*}"
          test "$status" = "200" || { echo "RAILWAY_HYBRID_SEARCH_FAIL http=$status body=${body:0:500}"; exit 1; }
          printf '%s' "$body" | jq -e '.ok == true and .mode == "hybrid" and .embedding_model == "Supabase/gte-small" and (.results | type == "array") and (.results | length) > 0 and any(.results[]; (.vector_rank // 0) > 0) and any(.results[]; (.keyword_rank // 0) > 0)' >/dev/null || {
            printf '%s' "$body" | jq -c '{ok, engine, engine_version, mode, embedding_model, results: [(.results // [])[] | {document_id, keyword_rank, vector_rank, keyword_score, vector_score}]}'
            echo "RAILWAY_HYBRID_SEARCH_FAIL: semantic embeddings and keyword/vector fusion are not both confirmed"
            exit 1
          }
          printf '%s' "$body" | jq -c '{ok, engine, engine_version, mode, result_count: ((.results // []) | length)}'
          echo "RAILWAY_HYBRID_SEARCH_PASS"

      - name: Verify live multi-domain web search
        shell: bash
        run: |
          set -euo pipefail
          query="latest artificial intelligence research and technology news today"
          response="$(curl -sS --connect-timeout 5 --max-time 20 -w '\nSTATUS:%{http_code}' \
            -H "Authorization: Bearer $DEEP33_RAILWAY_GATE_TOKEN" \
            -H "X-DEEP33-Session-Id: $DEEP33_RAILWAY_GATE_SESSION_ID" \
            --get "$RAILWAY_BASE_URL/v1/web/search" --data-urlencode "q=$query" || true)"
          status="${response##*STATUS:}"
          body="${response%$'\n'STATUS:*}"
          test "$status" = "200" || { echo "RAILWAY_LIVE_SEARCH_FAIL http=$status body=${body:0:500}"; exit 1; }
          printf '%s' "$body" > /tmp/railway-live-search.json
          printf '%s' "$body" | jq -e '.ok == true and .fresh_request == true and .realtime == true and (.results | length) >= 3 and (.verification.distinct_domains // 0) >= 3 and (.verification.distinct_providers // 0) >= 2 and (.providers | unique | length) >= 2 and (.retrieved_at | strings | length) > 10' >/dev/null || {
            printf '%s' "$body" | jq -c '{ok, engine, engine_version, realtime, fresh_request, result_count: (.results | length), providers, verification, retrieved_at}'
            echo "RAILWAY_LIVE_MULTIDOMAIN_SEARCH_FAIL: requires at least two successful independent providers and three domains"
            exit 1
          }
          printf '%s' "$body" | jq -c '{ok, engine, engine_version, realtime, fresh_request, result_count: (.results | length), providers, verification, retrieved_at}'
          echo "RAILWAY_LIVE_MULTIDOMAIN_SEARCH_PASS"

      - name: Verify source-page fetch from web-search result
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t urls < <(jq -r '.results[0:2][]?.url // empty' /tmp/railway-live-search.json)
          fetched=0
          index=0
          for url in "${urls[@]}"; do
            index=$((index + 1))
            [ -n "$url" ] || continue
            response="$(curl -sS --connect-timeout 5 --max-time 8 -w '\nSTATUS:%{http_code}' \
              -H "Authorization: Bearer $DEEP33_RAILWAY_GATE_TOKEN" \
              -H "X-DEEP33-Session-Id: $DEEP33_RAILWAY_GATE_SESSION_ID" \
              --get "$RAILWAY_BASE_URL/v1/web/fetch" --data-urlencode "url=$url" || true)"
            status="${response##*STATUS:}"
            body="${response%$'\n'STATUS:*}"
            if [ "$status" = "200" ] && printf '%s' "$body" | jq -e '.ok == true and ((.text // "") | length) > 80' >/dev/null 2>&1; then
              printf '%s' "$body" | jq -c '{ok, final_url, title, text_chars: ((.text // "") | length), redirects}'
              fetched=1
              break
            fi
            echo "RAILWAY_WEB_FETCH_CANDIDATE_FAILED candidate=$index http=$status"
          done
          test "$fetched" = "1" || { echo "RAILWAY_WEB_FETCH_FAIL"; exit 1; }
          echo "RAILWAY_WEB_FETCH_PASS"
