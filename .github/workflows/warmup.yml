name: DEEP33 Warmup

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary
  TERTIARY_URL: https://deep33-backend.onrender.com

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep every DEEP33 transport node warm
        run: |
          set -euo pipefail
          entries=("PRIMARY|$PRIMARY_URL" "SECONDARY|$SECONDARY_URL" "TERTIARY|$TERTIARY_URL")
          for entry in "${entries[@]}"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            curl -fsS --connect-timeout 8 --max-time 30 "$url/health" | jq -e '.status=="PASS"' >/dev/null
            curl -fsS --connect-timeout 8 --max-time 45 "$url/ready" | jq -e '.status=="PASS" and .ready==true' >/dev/null
            echo "${name}_WARM_PASS"
          done
          curl -fsS --connect-timeout 8 --max-time 90 "$PRIMARY_URL/v1/connectivity/audit" | jq -e '.edge=="PASS" and .internet=="PASS" and .search.ok==true' >/dev/null
          echo "DEEP33_WARM_PASS"

      - name: Certify real model inference through DEEP33 edge
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail

          set +e
          DIAG="$(curl -sS --connect-timeout 8 --max-time 90             -w '\n__HTTP_STATUS__%{http_code}'             "$PRIMARY_URL/v1/ai/inference-check" 2>&1)"
          set -e
          echo "=== EDGE INFERENCE CHECK ==="
          printf '%s\n' "$DIAG"

          BODY='{"messages":[{"role":"user","content":"Return exactly DEEP33_E2E_OK"}],"personality":"NEUTRO"}'
          STREAM="$(curl -sS             --connect-timeout 8             --max-time 120             -w '\n__HTTP_STATUS__%{http_code}'             -H 'Content-Type: application/json'             -H 'Accept: text/event-stream'             -H 'X-DEEP33-Session-Id: DEEP33-WARMUP-STREAM'             -H 'X-Request-ID: DEEP33-WARMUP-STREAM'             -H 'X-Idempotency-Key: DEEP33-WARMUP-STREAM'             -d "$BODY"             "$PRIMARY_URL/v1/chat/stream" || true)"

          echo "=== EDGE SSE INFERENCE ==="
          printf '%s\n' "$STREAM"

          EDGE_STATUS="$(printf '%s\n' "$STREAM" | sed -n 's/^__HTTP_STATUS__//p' | tail -n1)"
          EDGE_BODY="$(printf '%s\n' "$STREAM" | sed '/^__HTTP_STATUS__/d')"
          test "$EDGE_STATUS" = "200"
          printf '%s\n' "$EDGE_BODY" | grep -q '"content"'
          printf '%s\n' "$EDGE_BODY" | grep -q '\[DONE\]'
          echo "DEEP33_DIRECT_STREAM_INFERENCE_PASS"
