name: DEEP33 Warmup

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep DEEP33 edge warm
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 60 "$PRIMARY_URL/health" | jq -e '.status=="PASS"' >/dev/null
          curl -fsS --connect-timeout 8 --max-time 90 "$PRIMARY_URL/v1/connectivity/audit" | jq -e '.edge=="PASS" and .internet=="PASS" and .search.ok==true' >/dev/null
          echo "DEEP33_WARM_PASS"

      - name: Certify real model inference
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail

          set +e
          DIAG="$(curl -sS --connect-timeout 8 --max-time 90 "$PRIMARY_URL/v1/ai/inference-check" 2>&1)"
          DIAG_CODE="$?"
          set -e

          if [ "$DIAG_CODE" -eq 0 ]; then
            echo "$DIAG" | jq -e '.status=="PASS" and .direct_edge==true and .text_ok==true' >/dev/null
            echo "DEEP33_INFERENCE_PROBE_PASS"
          else
            echo "DEEP33_INFERENCE_PROBE_DEGRADED: $DIAG"
          fi

          BODY='{"messages":[{"role":"user","content":"Return exactly DEEP33_E2E_OK"}],"personality":"NEUTRO"}'
          STREAM="$(curl -sS             --connect-timeout 8             --max-time 120             -H 'Content-Type: application/json'             -H 'Accept: text/event-stream'             -H 'X-Request-ID: DEEP33-WARMUP-STREAM'             -H 'X-Idempotency-Key: DEEP33-WARMUP-STREAM'             -d "$BODY"             "$PRIMARY_URL/v1/chat/stream")"

          echo "$STREAM" | grep -q '"content"' 
          echo "$STREAM" | grep -q '[DONE]'
          echo "DEEP33_DIRECT_STREAM_INFERENCE_PASS"