name: DEEP33 Fast APK

on:
  workflow_dispatch:
  push:
    tags: [production-pass]

permissions:
  contents: read

env:
  DEEP33_PRIMARY_URL: https://deep33-backend.onrender.com
  DEEP33_SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  DEEP33_TERTIARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Require certified production-pass
        run: |
          set -euo pipefail
          git fetch origin refs/tags/production-pass --force
          certified="$(git rev-parse refs/tags/production-pass^{commit})"
          test "$certified" = "$GITHUB_SHA" || {
            echo "APK_BUILD_BLOCKED_CERTIFIED=$certified CURRENT=$GITHUB_SHA"
            exit 1
          }
          python -m pytest tests/test_connectivity_hardening.py -q
          echo "APK_CERTIFICATION_GATE_PASS"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Build DEEP33 debug APK
        run: |
          set -euo pipefail
          cd android
          gradle :app:assembleDebug --no-daemon
      - name: Publish DEEP33 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-current-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
