name: DEEP33 Android E2E Diagnosis

on:
  push:
    branches: [debug/android-e2e-diagnosis]

env:
  PRIMARY_URL: https://deep33-backend.onrender.com
  SECONDARY_URL: https://deep33-backup.onrender.com
  TERTIARY_URL: https://deep33-api.onrender.com

jobs:
  android_e2e_diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Enable KVM for Android Emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm
      - name: Android E2E diagnosis
        env:
          DEEP33_PRIMARY_URL: https://deep33-backend.onrender.com
          DEEP33_SECONDARY_URL: https://deep33-backup.onrender.com
          DEEP33_TERTIARY_URL: https://deep33-api.onrender.com
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-diagnosis
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 8.8.8.8,8.8.4.4
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          script: |
            set -eu
            mkdir -p diagnosis
            cd android
            {
              echo "=== EMULATOR DNS ==="
              adb shell getprop net.dns1
              adb shell getprop net.dns2
              echo "=== HOST DNS PREFLIGHT ==="
              for host in deep33-backend.onrender.com deep33-backup.onrender.com deep33-api.onrender.com; do
                getent ahosts "$host"
              done
              echo "=== BUILD ==="
              gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
              adb wait-for-device
              adb install -r app/build/outputs/apk/debug/app-debug.apk
              TEST_APK="$(find app/build/outputs/apk/androidTest -type f -name '*androidTest.apk' | head -n 1)"
              test -n "$TEST_APK"
              adb install -r "$TEST_APK"
              echo "=== INSTRUMENTATION ==="
              set +e
              timeout --foreground 15m adb shell am instrument -w -r cl.caggrometal.deep33.test/androidx.test.runner.AndroidJUnitRunner > ../diagnosis/instrumentation.log 2>&1
              status="$?"
              cat ../diagnosis/instrumentation.log
              set -e
              echo "INSTRUMENTATION_EXIT=$status"
              cp -R app/build/outputs/androidTest-results ../diagnosis/androidTest-results 2>/dev/null || true
              cp -R app/build/outputs/logs ../diagnosis/build-logs 2>/dev/null || true
              exit "$status"
            } || status="$?"
            cd ..
            echo "$status" > diagnosis/exit-status.txt
            exit "$status"
      - name: Collect diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p diagnosis
          timeout 10s adb devices -l > diagnosis/adb-devices.txt 2>&1 || true
          timeout 10s adb shell getprop net.dns1 > diagnosis/dns1.txt 2>&1 || true
          timeout 10s adb shell getprop net.dns2 > diagnosis/dns2.txt 2>&1 || true
          timeout 10s adb shell ps -A > diagnosis/ps.txt 2>&1 || true
          timeout 20s adb logcat -d -t 2000 > diagnosis/logcat.txt 2>&1 || true
      - name: Upload diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-android-e2e-diagnosis
          path: diagnosis
          if-no-files-found: warn