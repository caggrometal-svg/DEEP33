name: DEEP33 Global Internet Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/search/**"
      - "tools/web_search.py"
      - "tools/web_fetch.py"
      - "backend/main.py"
      - "supabase/functions/deep33-proxy/**"
      - "supabase/functions/deep33-tertiary/**"
      - "tests/test_edge_tertiary_idempotency_contract.py"
      - "tests/test_deep33_global_gate.py"
      - ".github/workflows/deep33-global-internet-gate.yml"
      - ".github/workflows/deep33-global-gate.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/production-e2e.yml"
  push:
    branches: ["main", "fix/cert-green-live-search-161026"]
    paths:
      - "backend/search/**"
      - "tools/web_search.py"
      - "tools/web_fetch.py"
      - "backend/main.py"
      - "supabase/functions/deep33-proxy/**"
      - "supabase/functions/deep33-tertiary/**"
      - "tests/test_edge_tertiary_idempotency_contract.py"
      - "tests/test_deep33_global_gate.py"
      - ".github/workflows/deep33-global-internet-gate.yml"
      - ".github/workflows/production-e2e.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deep33-global-gate.yml"

permissions:
  contents: read

concurrency:
  group: deep33-global-internet-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: https://opocgzydeknuchtrqzfa.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA
  DEEP33_PRODUCTION_GATE_URL: https://iac33-fastapi-edge-production.up.railway.app
  DEEP33_REQUIRE_LIVE_GATE: "true"
  PYTHONPATH: .

jobs:
  chaos-unit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run deterministic resilience and chaos gate
        env:
          DEEP33_PRODUCTION_GATE_URL: ""
        run: |
          set -euo pipefail
          pytest -q -k "not test_live_production_gate_zero_5xx_multidomain_and_android_sse"             tests/test_deep33_global_gate.py             tests/test_search_engine.py             tests/test_web_search.py             tests/test_web_fetch.py             tests/test_web_tools.py             tests/test_sse_contract.py
      - name: Compile production Python modules
        run: |
          python -m py_compile             backend/main.py             backend/search/engine.py             backend/search/resilience.py             tools/web_search.py             tools/web_fetch.py

  production-railway-gate:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/cert-green-live-search-161026')) || github.event_name == 'workflow_dispatch'
    needs: chaos-unit-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Create authenticated E2E session
        run: |
          set -euo pipefail
          profile_id="global-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          response="$(curl -sS --connect-timeout 8 --max-time 30             -w '\nDEEP33_HTTP_STATUS:%{http_code}'             -X POST "$SUPABASE_URL/functions/v1/deep33-auth"             -H "apikey: $SUPABASE_PUBLISHABLE_KEY"             -H "content-type: application/json"             -d "{\"action\":\"session\",\"memory_profile_id\":\"$profile_id\"}")"
          status="${response##*DEEP33_HTTP_STATUS:}"
          body="${response%$'\n'DEEP33_HTTP_STATUS:*}"
          test "$status" = "200" || { echo "$body"; exit 1; }
          token="$(printf '%s' "$body" | jq -r '.access_token // empty')"
          test -n "$token"
          echo "DEEP33_E2E_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Wait for exact Railway revision to become healthy
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 36); do
            code="$(curl -sS --connect-timeout 8 --max-time 30 -o /tmp/health.json -w "%{http_code}" "$DEEP33_PRODUCTION_GATE_URL/health" || true)"
            live_sha="$(jq -r '.git_sha // empty' /tmp/health.json 2>/dev/null || true)"
            live_status="$(jq -r '.status // empty' /tmp/health.json 2>/dev/null || true)"
            echo "RAILWAY_SHA_ATTEMPT=$attempt expected=$GITHUB_SHA live=$live_sha status=$live_status"
            if [ "$code" = "200" ] && [ "$live_status" = "PASS" ] && [ "$live_sha" = "$GITHUB_SHA" ]; then
              ok=1
              break
            fi
            # Railway only deploys runtime paths. A newer main SHA is compatible
            # when every intervening file is outside the exact runtime watch set.
            if [ "$live_status" = "PASS" ] && [ -n "$live_sha" ] && [ "$live_sha" != "$GITHUB_SHA" ]; then
              if ! git cat-file -e "$live_sha^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$live_sha" || true
              fi
              if git cat-file -e "$live_sha^{commit}" 2>/dev/null; then
                changed_files="$(git diff --name-only "$live_sha" "$GITHUB_SHA" || true)"
                if [ -n "$changed_files" ] && ! printf '%s\n' "$changed_files" | grep -Eq '^(Dockerfile$|\.dockerignore$|\.python-version$|backend/|tools/|supabase/|api/)'; then
                  echo "RAILWAY_RUNTIME_SHA_COMPATIBLE live=$live_sha head=$GITHUB_SHA"
                  ok=1
                  break
                fi
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Run live multidomain, stress and Android SSE gate
        run: |
          set -euo pipefail
          pytest -q tests/test_deep33_global_gate.py::test_live_production_gate_zero_5xx_multidomain_and_android_sse
