name: DEEP33 Master Pipeline & Integration Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: read
  statuses: read
  id-token: write

concurrency:
  group: deep33-master-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-gate:
    name: validate-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      TEST_SESSION_TOKEN: ${{ secrets.TEST_USER_SESSION_TOKEN }}
      CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SUPABASE_URL: https://opocgzydeknuchtrqzfa.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_7SoFLxFrXYC7IvEuWYLi2w_PglkkzKA
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CURRENT_SHA" || {
            echo "CHECKOUT_SHA_MISMATCH expected=$CURRENT_SHA actual=$actual"
            exit 1
          }
          echo "CHECKOUT_SHA_PASS=$actual"

      - name: Resolve exact Vercel preview for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "VERCEL_URL=https://deep33-backend.vercel.app" >> "$GITHUB_ENV"
            echo "VERCEL_TARGET_RESOLVED=production"
            exit 0
          fi

          # Vercel's GitHub integration publishes a commit status named "Vercel".
          # Preview aliases are deterministic for this project/team. The next
          # gate proves that the alias actually serves CURRENT_SHA before tests run.
          branch_slug="$(printf '%s' "$PR_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          test -n "$branch_slug" || { echo "VERCEL_BRANCH_ALIAS_SLUG_EMPTY branch=$PR_BRANCH"; exit 1; }
          alias="deep33-backend-git-${branch_slug}-iac33.vercel.app"
          status_api="https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$CURRENT_SHA/status"

          for attempt in $(seq 1 12); do
            status_payload="$(curl -fsS --connect-timeout 8 --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$status_api" || true)"

            vercel_state="$(printf '%s' "$status_payload" | jq -r '([.statuses[]? | select(.context == "Vercel")] | sort_by(.updated_at // .created_at) | last) as $v | ($v.state // empty)' 2>/dev/null || true)"
            vercel_description="$(printf '%s' "$status_payload" | jq -r '([.statuses[]? | select(.context == "Vercel")] | sort_by(.updated_at // .created_at) | last) as $v | ($v.description // empty)' 2>/dev/null || true)"

            if [ "$vercel_state" = "failure" ] || [ "$vercel_state" = "error" ]; then
              if printf '%s' "$vercel_description" | grep -Eiq 'rate.?limit|retry in 24 hours|build-rate-limit'; then
                echo "VERCEL_DEPLOY_RATE_LIMITED sha=$CURRENT_SHA description=$vercel_description"
              else
                echo "VERCEL_DEPLOY_STATUS_FAIL sha=$CURRENT_SHA state=$vercel_state description=$vercel_description"
              fi
              exit 1
            fi

            if [ "$vercel_state" = "success" ]; then
              echo "VERCEL_URL=https://$alias" >> "$GITHUB_ENV"
              echo "VERCEL_TARGET_RESOLVED=$alias"
              echo "VERCEL_STATUS_PASS sha=$CURRENT_SHA"
              exit 0
            fi

            echo "WAITING_FOR_VERCEL_STATUS attempt=$attempt sha=$CURRENT_SHA state=${vercel_state:-missing} description=${vercel_description:-none}"
            [ "$attempt" -lt 12 ] && sleep 5
          done

          echo "VERCEL_STATUS_NOT_READY sha=$CURRENT_SHA"
          exit 1

      - name: Run authenticated Vercel, live-web, and SSE gates
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/verify_deep33.sh
          ./scripts/verify_deep33.sh
