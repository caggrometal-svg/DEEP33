name: DEEP33 Web Orchestration Canary

on:
  workflow_dispatch:
  push:
    branches: [fix/web-server-orchestration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  isolated_web_regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests/test_web_orchestrator.py tests/test_web_loop.py -q

  real_web_canary:
    needs: isolated_web_regression
    runs-on: ubuntu-latest
    env:
      DEEP33_WEB_ORCHESTRATOR: server
      DEEP33_WEB_TOOLS_ENABLED: true
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY || secrets.KILO_API_KEY }}
      AI_GATEWAY_PROVIDER: ${{ vars.AI_GATEWAY_PROVIDER || 'kilo' }}
      AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL || 'https://api.kilo.ai/api/gateway/chat/completions' }}
      AI_GATEWAY_HEALTH_URL: ${{ vars.AI_GATEWAY_HEALTH_URL || 'https://api.kilo.ai/api/gateway/models' }}
      AI_GATEWAY_MODEL: ${{ vars.AI_GATEWAY_MODEL || 'kilo-auto/small' }}
      AI_PROVIDER_TIMEOUT_SECONDS: "18"
      AI_TIMEOUT_SECONDS: "75"
      DEEP33_MEMORY_URL: ""
      SUPABASE_ANON_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
      - run: pip install -r backend/requirements.txt
      - name: Real provider + real web canary
        run: |
          python - <<'PY'
          import os
          from backend import main

          if not os.getenv("AI_GATEWAY_API_KEY", "").strip():
              raise SystemExit("REAL_WEB_CANARY_BLOCKED: AI gateway secret is not configured in GitHub Actions")

          class LocalMemory:
              enabled = True
              async def context(self, session_id): return {"session": {"session_id": session_id}, "messages": [], "memories": []}
              async def sync(self, *args, **kwargs): return {"ok": True}
              async def idempotency_claim(self, *args, **kwargs): return {"state": "CLAIMED", "lease_token": "canary"}
              async def idempotency_status(self, *args, **kwargs): return {"state": "IN_PROGRESS"}
              async def idempotency_complete(self, *args, **kwargs): return {"ok": True}
              async def idempotency_fail(self, *args, **kwargs): return {"ok": True}

          main.memory = LocalMemory()

          from fastapi.testclient import TestClient
          client = TestClient(main.app)
          response = client.post(
              "/v1/ai/generate",
              json={"messages": [{"role": "user", "content": "Investiga en internet una noticia actual sobre DEEP33 y cita fuentes."}]},
              headers={"X-DEEP33-Session-Id": "real-canary"},
          )
          print("HTTP_STATUS", response.status_code)
          print(response.text[:12000])
          response.raise_for_status()
          body = response.json()
          assert body["web_navigation"] is True, body
          assert len(body["sources"]) >= 1, body
          assert body["result"]["text"].strip(), body
          assert body["response"]["choices"][0]["message"]["content"].strip(), body
          print("REAL_WEB_CANARY_PASS")
          PY
