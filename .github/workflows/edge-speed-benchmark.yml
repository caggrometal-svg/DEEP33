name: DEEP33 Edge Speed Benchmark

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  benchmark:
    if: ${{ github.event.head_commit.message != 'chore(benchmark): persist edge benchmark result' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
      N: "30"
      WARMUP: "3"
      DELAY: "1.1"
    steps:
      - uses: actions/checkout@v4

      - name: Benchmark production Edge streaming
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench
          python3 <<'PY'
          import json, os, time, uuid, urllib.request, urllib.error

          BASE=os.environ["BASE_URL"].rstrip("/")
          N=int(os.environ["N"]); W=int(os.environ["WARMUP"]); DELAY=float(os.environ["DELAY"])

          scenarios=[
              ("FAST","2x2?"),
              ("BALANCED","Explícame brevemente qué es una API."),
              ("WEB","Busca en internet el precio actual del dólar estadounidense en Chile y responde en una sola frase."),
              ("DEEP","Explica en profundidad cómo el streaming reduce la latencia percibida en una aplicación de inteligencia artificial, usando pocas secciones pero suficiente detalle."),
          ]

          def pct(values,p):
              if not values: return None
              xs=sorted(values); k=(len(xs)-1)*p/100; lo=int(k); hi=min(lo+1,len(xs)-1)
              v=xs[lo] if lo==hi else xs[lo]+(xs[hi]-xs[lo])*(k-lo)
              return round(v,2)

          def call(label,prompt,warmup):
              rid=f"edgebench-{label.lower()}-{uuid.uuid4()}"
              sid=f"edgebench-session-{uuid.uuid4()}"
              key=f"edgebench-key-{uuid.uuid4()}"
              body=json.dumps({"messages":[{"role":"user","content":prompt}],"personality":"NEUTRO"}).encode()
              req=urllib.request.Request(
                  BASE+"/v1/chat/stream",data=body,method="POST",
                  headers={
                      "Accept":"text/event-stream","Content-Type":"application/json",
                      "X-DEEP33-Session-Id":sid,"X-Request-ID":rid,
                      "X-Idempotency-Key":key,"X-DEEP33-Personality":"NEUTRO",
                      "Cache-Control":"no-cache",
                  }
              )
              t0=time.perf_counter(); first_byte=None; ttft=None; total=None; done=False; status=None; chars=0; err=None
              try:
                  with urllib.request.urlopen(req,timeout=150) as resp:
                      status=resp.status
                      first_byte=(time.perf_counter()-t0)*1000
                      for raw in resp:
                          line=raw.decode("utf-8","replace").strip()
                          if not line.startswith("data:"): continue
                          data=line[5:].strip()
                          if data=="[DONE]":
                              done=True; break
                          try: obj=json.loads(data)
                          except Exception: continue
                          for choice in obj.get("choices",[]):
                              delta=choice.get("delta") or {}
                              c=delta.get("content")
                              if isinstance(c,str) and c:
                                  chars += len(c)
                                  if ttft is None: ttft=(time.perf_counter()-t0)*1000
                  total=(time.perf_counter()-t0)*1000
              except Exception as exc:
                  total=(time.perf_counter()-t0)*1000; err=repr(exc)
              return {"scenario":label,"warmup":warmup,"request_id":rid,"status":status,
                      "first_byte_ms":None if first_byte is None else round(first_byte,2),
                      "ttft_ms":None if ttft is None else round(ttft,2),
                      "total_ms":None if total is None else round(total,2),
                      "chars":chars,"done":done,"error":err}

          rows=[]
          for label,prompt in scenarios:
              for _ in range(W):
                  rows.append(call(label,prompt,True)); time.sleep(DELAY)
              for _ in range(N):
                  rows.append(call(label,prompt,False)); time.sleep(DELAY)

          summary={}
          for label,_ in scenarios:
              data=[r for r in rows if r["scenario"]==label and not r["warmup"]]
              ok=[r for r in data if r["status"]==200 and r["done"] and r["ttft_ms"] is not None]
              summary[label]={
                  "samples":len(data),"successful":len(ok),"failed":len(data)-len(ok),
                  "failure_rate_pct":round((len(data)-len(ok))*100/len(data),2) if data else None,
                  "ttft_ms":{"p50":pct([r["ttft_ms"] for r in ok],50),"p95":pct([r["ttft_ms"] for r in ok],95)},
                  "total_ms":{"p50":pct([r["total_ms"] for r in ok],50),"p95":pct([r["total_ms"] for r in ok],95)},
                  "first_byte_ms":{"p50":pct([r["first_byte_ms"] for r in ok],50),"p95":pct([r["first_byte_ms"] for r in ok],95)},
              }

          result={
              "benchmark":{"target":BASE,"sample_count":N,"warmup_count":W,"delay_s":DELAY,
                           "generated_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())},
              "summary":summary,"samples":rows
          }
          with open("/tmp/bench/current-edge-baseline.json","w",encoding="utf-8") as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          print(json.dumps(summary,ensure_ascii=False,indent=2))

          if any(v["successful"] < int(N*0.8) for v in summary.values()):
              raise SystemExit("EDGE_BENCHMARK_INSUFFICIENT_SUCCESS")
          PY

      - name: Persist benchmark evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin benchmark-results-2026-10-03
          git checkout benchmark-results-2026-10-03
          mkdir -p benchmark-results
          cp /tmp/bench/current-edge-baseline.json benchmark-results/current-edge-baseline.json
          git add benchmark-results/current-edge-baseline.json
          git commit -m "chore(benchmark): persist edge benchmark result" || true
          git push origin benchmark-results-2026-10-03

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEEP33-edge-speed-baseline
          path: /tmp/bench/current-edge-baseline.json
