name: DEEP33 Android Debug APK v0.4.3

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEEP33_PRIMARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  DEEP33_SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary
  DEEP33_TERTIARY_URL: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Lint, tests and debug APK
        run: |
          set -euo pipefail
          cd android
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable KVM for Android Emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm
      - name: Android lifecycle instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          DEEP33_INSTRUMENTATION_CLASS: cl.caggrometal.deep33.Deep33LifecycleRecoveryTest
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          avd-name: deep33-debug
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 1.1.1.1,8.8.8.8
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          enable-hw-keyboard: false
          channel: stable
          working-directory: android
          script: |
            bash deep33-real-connectivity-e2e.sh
      - name: Publish DEEP33 debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-v0.4.3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish instrumentation APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-v0.4.3-androidTest-apk
          path: android/app/build/outputs/apk/androidTest/debug/*androidTest.apk
          if-no-files-found: error
