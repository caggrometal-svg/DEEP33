name: DEEP33 Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEEP33_PRIMARY_URL: https://guqevsjbjyapqjjtutza.supabase.co/functions/v1/deep33-proxy
  DEEP33_SECONDARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-proxy
  DEEP33_TERTIARY_URL: https://opocgzydeknuchtrqzfa.supabase.co/functions/v1/deep33-tertiary

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Lint, tests and debug APK
        run: |
          set -euo pipefail
          cd android
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Publish DEEP33 debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-v0.4.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish instrumentation APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DEEP33-v0.4.0-androidTest-apk
          path: android/app/build/outputs/apk/androidTest/debug/*androidTest.apk
          if-no-files-found: error
